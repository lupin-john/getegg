    wingL.inner.rotation.set(0, 1.15, -0.35); wingL.outer.rotation.z = -0.85;
    wingR.inner.rotation.set(0, -1.15, 0.35); wingR.outer.rotation.z = 0.85;
    armL.shoulder.rotation.set(-0.55, 0, -0.15); armL.elbow.rotation.x = -0.75;
    armR.shoulder.rotation.set(-0.50, 0, 0.15); armR.elbow.rotation.x = -0.55;
    if (armR.sword) armR.sword.rotation.set(0.65, -0.25, 0);
    legL.hip.rotation.x = -1.25; legL.knee.rotation.x = 1.85; legL.ankle.rotation.x = -0.60;
    legR.hip.rotation.x = -1.25; legR.knee.rotation.x = 1.85; legR.ankle.rotation.x = -0.60;
    tails.forEach((t, idx) => { t.rotation.x = idx === 0 ? -0.35 : 0.08; t.rotation.y = 0.42; });

    animParts.body = body;
    animParts.headPivot = headPivot;
    animParts.wingL = wingL;
    animParts.wingR = wingR;
    animParts.coreMesh = coreMesh;

    // [앞에 놓인 대악마(마왕) 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('DemonEgg_Root', 0, 0.36, 0, eggGroup);
    const eDarkArmorM = mat(0x16090d, 0.4, 0.55);
    const eCrimsonSkinM = mat(0x7f1d1d, 0.5, 0.25);
    const eMagmaM = mat(0xff4500, 0.15, 0.1, 0xdc2626, 2.5);
    const eYellowCoreM = mat(0xfef08a, 0.1, 0.1, 0xf97316, 3.0);
    const eHornM = mat(0x1c1917, 0.5, 0.4);
    const eggS = 1.08;
    const { topCap: eTopCap, coreMesh: eCoreMesh } = buildBlockyEggShell(eggRoot, eggS, eCrimsonSkinM, eMagmaM, eYellowCoreM);
    addBoxE(eggRoot, 0.92 * eggS, 0.55 * eggS, 0.14 * eggS, eDarkArmorM, 0, 0.72 * eggS, 0.62 * eggS);
    addBoxE(eggRoot, 0.34 * eggS, 0.34 * eggS, 0.16 * eggS, eYellowCoreM, 0, 0.75 * eggS, 0.66 * eggS, 0, 0, Math.PI / 4);
    for (const side of [-1, 1]) {
      const hornGroup = new THREE.Group();
      hornGroup.position.set(side * 0.38 * eggS, 0.24 * eggS, 0);
      eTopCap.add(hornGroup);
      addBoxE(hornGroup, 0.26, 0.24, 0.24, eHornM, side * 0.12, 0.06, 0, 0, 0, side * -0.45);
      addBoxE(hornGroup, 0.20, 0.38, 0.20, eHornM, side * 0.30, 0.28, -0.06, -0.2, 0, side * -0.15);
      addBoxE(hornGroup, 0.14, 0.36, 0.14, eMagmaM, side * 0.26, 0.58, -0.12, -0.35, 0, side * 0.25);
    }
    const eWingL = createJoint('DemonEgg_WingL', 0.68 * eggS, 0.85 * eggS, -0.10, eggRoot);
    const eWingR = createJoint('DemonEgg_WingR', -0.68 * eggS, 0.85 * eggS, -0.10, eggRoot);
    for (const { w, side } of [{ w: eWingL, side: 1 }, { w: eWingR, side: -1 }]) {
      addBoxE(w, 0.62, 0.12, 0.12, eDarkArmorM, side * 0.28, 0.22, 0, 0, 0, side * 0.42);
      addBoxE(w, 0.10, 0.24, 0.10, eMagmaM, side * 0.55, 0.42, 0.05, 0.3, 0, side * -0.2);
      addBoxE(w, 0.60, 0.62, 0.04, eCrimsonSkinM, side * 0.34, -0.06, -0.03, 0, 0, side * 0.22);
      addBoxE(w, 0.58, 0.06, 0.06, eMagmaM, side * 0.34, -0.36, -0.02, 0, 0, side * 0.22);
    }
    const eTailPivot = createJoint('DemonEgg_Tail', 0, 0.26 * eggS, -0.64 * eggS, eggRoot);
    addBoxE(eTailPivot, 0.14, 0.14, 0.55, eCrimsonSkinM, 0.28, 0.08, -0.18, 0.25, 0.65, 0);
    addBoxE(eTailPivot, 0.28, 0.08, 0.28, eMagmaM, 0.48, 0.18, -0.32, 0.25, 0.65, Math.PI / 4);

    egg.eggRoot = eggRoot;
    egg.eWingL = eWingL;
    egg.eWingR = eWingR;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (8) ✨ Lv.8 대천사(세라핌) (6장의 천사 날개를 접고 성검·성방패와 함께 안식하는 자세) + 대천사 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'archangel') {
    // ---- 원본 "블록형 로우폴리 대천사" 뷰어의 리깅을 그대로 가져와 조립(장식 일부는 간소화) ----
    const marbleM = mat(0xf8fafc, 0.35, 0.3);
    const silverM = mat(0xcbd5e1, 0.4, 0.4);
    const goldM = mat(0xfacc15, 0.3, 0.55);
    const royalBlueM = mat(0x1e3a8a, 0.65, 0.1);
    const shadowHoodM = mat(0x090d16, 0.85, 0.1);
    const featherPureM = mat(0xffffff, 0.45, 0.1);
    const featherLightM = mat(0xfef9c3, 0.4, 0.1, 0xfde047, 0.4);
    const holyCyanM = mat(0xe0f2fe, 0.2, 0.1, 0x38bdf8, 1.2);
    const haloGlowM = mat(0xfef08a, 0.15, 0.2, 0xf59e0b, 1.3);
    const holyBladeM = mat(0xffffff, 0.2, 0.1, 0xfacc15, 1.1);
    const eyeClosedM = mat(0x334155, 0.7);

    const addBlockA = (parent, w, h, d, x, y, z, m, rx = 0, ry = 0, rz = 0) => {
      const o = box(w, h, d, m, x, y, z);
      if (rx) o.rotation.x = rx; if (ry) o.rotation.y = ry; if (rz) o.rotation.z = rz;
      parent.add(o);
      return o;
    };

    const pelvis = createJoint('Pelvis', 0, 1.35, 0, creatureGroup);
    addBlockA(pelvis, 0.86, 0.34, 0.56, 0, 0, 0, marbleM);
    addBlockA(pelvis, 0.92, 0.14, 0.62, 0, 0.10, 0, goldM);
    addBlockA(pelvis, 0.24, 0.24, 0.10, 0, 0.10, 0.30, holyCyanM);

    const tabardFront = createJoint('Tabard_Front', 0, -0.08, 0.28, pelvis);
    addBlockA(tabardFront, 0.38, 0.85, 0.05, 0, -0.42, 0, royalBlueM);
    addBlockA(tabardFront, 0.28, 0.78, 0.06, 0, -0.42, 0.01, goldM);
    const tabardBack = createJoint('Tabard_Back', 0, -0.05, -0.28, pelvis);
    addBlockA(tabardBack, 0.76, 1.15, 0.06, 0, -0.55, 0, royalBlueM);

    const body = createJoint('Abdomen', 0, 0.20, 0, pelvis); // update()가 쓰는 이름(body)
    addBlockA(body, 0.80, 0.48, 0.52, 0, 0.24, 0, silverM);
    addBlockA(body, 0.62, 0.42, 0.56, 0, 0.24, 0.02, marbleM);
    addBlockA(body, 0.16, 0.40, 0.58, 0, 0.24, 0.03, goldM);

    const chest = createJoint('Chest', 0, 0.46, 0, body);
    addBlockA(chest, 1.24, 0.82, 0.72, 0, 0.40, 0, marbleM);
    addBlockA(chest, 0.96, 0.16, 0.76, 0, 0.46, 0.02, goldM);
    addBlockA(chest, 0.20, 0.72, 0.76, 0, 0.40, 0.02, goldM);
    addBlockA(chest, 0.30, 0.30, 0.78, 0, 0.46, 0.04, holyCyanM);
    addBlockA(chest, 0.72, 0.68, 0.22, 0, 0.42, -0.38, goldM);

    const neck = createJoint('Neck', 0, 0.82, 0.02, chest);
    addBlockA(neck, 0.42, 0.24, 0.42, 0, 0.10, 0, silverM);

    const headPivot = createJoint('Head', 0, 0.20, 0, neck);
    addBlockA(headPivot, 0.68, 0.66, 0.68, 0, 0.32, -0.02, marbleM);
    addBlockA(headPivot, 0.72, 0.42, 0.64, 0, 0.46, -0.04, royalBlueM);
    addBlockA(headPivot, 0.54, 0.54, 0.56, 0, 0.30, 0.06, shadowHoodM);
    addBlockA(headPivot, 0.58, 0.22, 0.12, 0, 0.16, 0.32, marbleM);
    addBlockA(headPivot, 0.12, 0.46, 0.14, 0, 0.32, 0.34, goldM);
    addBlockA(headPivot, 0.66, 0.14, 0.66, 0, 0.58, 0.02, goldM);
    addBlockA(headPivot, 0.14, 0.38, 0.12, 0, 0.74, 0.32, goldM);
    // 감은 눈
    addBlockA(headPivot, 0.16, 0.03, 0.06, 0.15, 0.32, 0.34, eyeClosedM);
    addBlockA(headPivot, 0.16, 0.03, 0.06, -0.15, 0.32, 0.34, eyeClosedM);

    const haloPivot = createJoint('Halo', 0, 0.92, -0.12, headPivot);
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      addBlockA(haloPivot, 0.46, 0.07, 0.09, Math.cos(angle) * 0.56, 0, Math.sin(angle) * 0.56, haloGlowM, 0, -angle + Math.PI / 2, 0);
    }
    addBlockA(haloPivot, 0.22, 0.08, 0.22, 0, 0, 0, holyCyanM, 0, Math.PI / 4, 0);

    // 세라핌 6장의 날개(상/중/하 3쌍) — 각 쌍이 inner→outer 2단 관절
    const seraphWings = [];
    function buildSeraphWingPair(yPos, zPos, scale) {
      const pair = {};
      for (const side of [-1, 1]) {
        const key = side === 1 ? 'L' : 'R';
        const inner = createJoint(`Wing_Inner_${key}_${yPos}`, side * 0.38, yPos, zPos, chest);
        addBlockA(inner, 1.35 * scale, 0.22 * scale, 0.20 * scale, side * 0.65 * scale, 0.32 * scale, 0, goldM, 0, 0, side * 0.38);
        addBlockA(inner, 1.30 * scale, 0.18 * scale, 0.16 * scale, side * 0.65 * scale, 0.22 * scale, 0.02, marbleM, 0, 0, side * 0.38);
        for (let f = 0; f < 3; f++) {
          const fx = side * (0.28 + f * 0.38) * scale, fh = (0.95 - f * 0.1) * scale;
          addBlockA(inner, 0.22 * scale, fh, 0.09 * scale, fx, (0.1 + f * 0.1 - 0.3) * scale, -0.02, f % 2 === 0 ? featherPureM : featherLightM, 0, 0, side * 0.14);
        }
        const outer = createJoint(`Wing_Outer_${key}_${yPos}`, side * 1.25 * scale, 0.56 * scale, 0, inner);
        addBlockA(outer, 1.65 * scale, 0.16 * scale, 0.15 * scale, side * 0.80 * scale, 0.18 * scale, 0, goldM, 0, 0, side * 0.16);
        for (let f = 0; f < 4; f++) {
          const fx = side * (0.22 + f * 0.32) * scale, fh = (1.2 - f * 0.14) * scale;
          addBlockA(outer, 0.23 * scale, fh, 0.08 * scale, fx, (-0.1 + f * 0.05) * scale, -0.02, f === 0 ? featherLightM : featherPureM, 0, 0, side * (0.22 + f * 0.08));
        }
        pair[key] = { inner, outer };
      }
      return pair;
    }
    const wingsUpper = buildSeraphWingPair(0.66, -0.36, 1.08);
    const wingsMid = buildSeraphWingPair(0.38, -0.40, 0.82);
    const wingsLower = buildSeraphWingPair(0.10, -0.36, 0.60);

    function buildArm(side) {
      const shoulder = createJoint(side === 1 ? 'Shoulder_L' : 'Shoulder_R', side * 0.80, 0.62, 0, chest);
      addBlockA(shoulder, 0.54, 0.42, 0.58, side * 0.16, 0.12, 0, marbleM, 0, 0, -side * 0.18);
      addBlockA(shoulder, 0.58, 0.14, 0.62, side * 0.18, 0.28, 0, goldM, 0, 0, -side * 0.18);
      addBlockA(shoulder, 0.36, 0.66, 0.36, side * 0.12, -0.30, 0, silverM);
      const elbow = createJoint(side === 1 ? 'Elbow_L' : 'Elbow_R', side * 0.12, -0.62, 0, shoulder);
      addBlockA(elbow, 0.38, 0.64, 0.38, 0, -0.28, 0, marbleM);
      addBlockA(elbow, 0.42, 0.16, 0.42, 0, -0.48, 0, goldM);
      const hand = createJoint(side === 1 ? 'Hand_L' : 'Hand_R', 0, -0.62, 0, elbow);
      addBlockA(hand, 0.30, 0.28, 0.32, 0, -0.10, 0, goldM);
      let sword = null, shield = null;
      if (side === -1) {
        sword = createJoint('Celestial_Sword', 0, -0.14, 0.12, hand);
        addBlockA(sword, 0.10, 0.10, 0.85, 0, 0, -0.10, silverM);
        addBlockA(sword, 0.20, 0.20, 0.20, 0, 0, -0.56, goldM);
        addBlockA(sword, 0.96, 0.18, 0.22, 0, 0, 0.32, goldM);
        addBlockA(sword, 0.24, 0.24, 0.24, 0, 0, 0.34, holyCyanM);
        addBlockA(sword, 0.10, 0.34, 2.30, 0, 0, 1.55, holyBladeM);
        addBlockA(sword, 0.14, 0.14, 2.10, 0, 0, 1.45, goldM);
      }
      if (side === 1) {
        shield = createJoint('Aegis_Shield', 0.22, 0.12, 0.12, hand);
        addBlockA(shield, 0.12, 1.25, 0.86, 0, 0, 0, marbleM);
        addBlockA(shield, 0.15, 1.32, 0.14, 0.02, 0, 0, goldM);
        addBlockA(shield, 0.18, 0.32, 0.32, 0.04, 0.16, 0, holyCyanM);
      }
      return { shoulder, elbow, hand, sword, shield };
    }
    const armL = buildArm(1);
    const armR = buildArm(-1);

    function buildLeg(side) {
      const hip = createJoint(side === 1 ? 'Hip_L' : 'Hip_R', side * 0.30, -0.14, 0, pelvis);
      addBlockA(hip, 0.40, 0.78, 0.44, 0, -0.36, 0, silverM);
      addBlockA(hip, 0.36, 0.68, 0.46, 0, -0.36, 0.03, marbleM);
      const knee = createJoint(side === 1 ? 'Knee_L' : 'Knee_R', 0, -0.76, 0, hip);
      addBlockA(knee, 0.38, 0.28, 0.20, 0, 0.04, 0.22, goldM);
      addBlockA(knee, 0.36, 0.78, 0.38, 0, -0.38, 0, marbleM);
      const ankle = createJoint(side === 1 ? 'Ankle_L' : 'Ankle_R', 0, -0.76, 0, knee);
      addBlockA(ankle, 0.38, 0.22, 0.62, 0, -0.10, 0.12, marbleM);
      addBlockA(ankle, 0.40, 0.10, 0.66, 0, -0.16, 0.12, goldM);
      return { hip, knee, ankle };
    }
    const legL = buildLeg(1);
    const legR = buildLeg(-1);

    // ---- 수면(무릎 꿇고 6날개로 몸을 겹겹이 감싼) 자세 ----
    pelvis.position.y = 1.12; pelvis.rotation.x = 0.14;
    body.rotation.x = 0.16;
    chest.rotation.x = 0.22;
    tabardFront.rotation.x = -0.25; tabardBack.rotation.x = 0.12;
    neck.rotation.x = 0.22;
    headPivot.rotation.x = 0.34;
    function foldWingPair(pair, zAngle, yAngle, outerZ) {
      pair.L.inner.rotation.set(0, yAngle, zAngle);
      pair.L.outer.rotation.z = -outerZ;
      pair.R.inner.rotation.set(0, -yAngle, -zAngle);
      pair.R.outer.rotation.z = outerZ;
    }
    foldWingPair(wingsUpper, -0.20, 1.15, 0.78);
    foldWingPair(wingsMid, -0.35, 1.00, 0.65);
    foldWingPair(wingsLower, -0.50, 0.85, 0.50);
    // 접은 자세가 완전히 정해진 뒤에, 그 최종 각도를 기준(baseZ)으로 숨쉬기 흔들림을 적용하게 등록
    for (const pair of [wingsUpper, wingsMid, wingsLower]) {
      seraphWings.push({ pivot: pair.L.inner, side: 1, baseZ: pair.L.inner.rotation.z });
      seraphWings.push({ pivot: pair.R.inner, side: -1, baseZ: pair.R.inner.rotation.z });
    }
    armL.shoulder.rotation.set(-0.58, 0, -0.18); armL.elbow.rotation.x = -0.68;
    armR.shoulder.rotation.set(-0.52, 0, 0.18); armR.elbow.rotation.x = -0.58;
    if (armR.sword) armR.sword.rotation.set(0.68, -0.15, 0);
    legL.hip.rotation.x = -1.25; legL.knee.rotation.x = 1.90; legL.ankle.rotation.x = -0.55;
    legR.hip.rotation.x = -1.25; legR.knee.rotation.x = 1.90; legR.ankle.rotation.x = -0.55;

    animParts.body = body;
    animParts.headPivot = headPivot;
    animParts.haloPivot = haloPivot;
    animParts.seraphWings = seraphWings;

    // [앞에 놓인 대천사(세라핌) 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('ArchangelEgg_Root', 0, 0.58, 0, eggGroup);
    const eMarbleM = mat(0xf8fafc, 0.25, 0.15, 0xe2e8f0, 0.2);
    const eHolyGoldM = mat(0xfacc15, 0.18, 0.85, 0xf59e0b, 0.55);
    const eRoyalBlueM = mat(0x1d4ed8, 0.35, 0.3, 0x1e40af, 0.3);
    const eHolyCyanM = mat(0x7dd3fc, 0.05, 0.1, 0x38bdf8, 2.8);
    const eSunCoreM = mat(0xffffff, 0.05, 0, 0xfef08a, 3.2);
    const eggS = 1.12;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eMarbleM, eHolyGoldM, eSunCoreM);
    addBoxE(eggRoot, 0.54 * eggS, 0.75 * eggS, 0.10 * eggS, eRoyalBlueM, 0, 0.65 * eggS, 0.62 * eggS);
    addBoxE(eggRoot, 0.12 * eggS, 0.68 * eggS, 0.14 * eggS, eHolyGoldM, 0, 0.68 * eggS, 0.64 * eggS);
    addBoxE(eggRoot, 0.48 * eggS, 0.12 * eggS, 0.14 * eggS, eHolyGoldM, 0, 0.76 * eggS, 0.64 * eggS);
    addBoxE(eggRoot, 0.22 * eggS, 0.22 * eggS, 0.16 * eggS, eHolyCyanM, 0, 0.76 * eggS, 0.66 * eggS, 0, 0, Math.PI / 4);
    addBoxE(eTopCap, 0.62 * eggS, 0.14 * eggS, 0.62 * eggS, eHolyGoldM, 0, 0.36 * eggS, 0);
    addBoxE(eTopCap, 0.16 * eggS, 0.28 * eggS, 0.12 * eggS, eHolyCyanM, 0, 0.48 * eggS, 0.28 * eggS);

    const eggHalo = createJoint('ArchangelEgg_Halo', 0, 0.78 * eggS, -0.12, eTopCap);
    eggHalo.rotation.x = 0.32;
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      addBoxE(eggHalo, 0.28, 0.06, 0.08, eSunCoreM, Math.cos(ang) * 0.56, 0, Math.sin(ang) * 0.56, 0, -ang, 0);
      addBoxE(eggHalo, 0.10, 0.08, 0.24, eHolyGoldM, Math.cos(ang) * 0.72, 0, Math.sin(ang) * 0.72, 0, -ang, 0);
    }
    addBoxE(eggHalo, 0.24, 0.08, 0.24, eHolyCyanM, 0, 0, 0, 0, Math.PI / 4, 0);

    const eggWings = [];
    const eWingConfigs = [
      { name: 'Upper', y: 1.05 * eggS, scale: 1.05 },
      { name: 'Mid', y: 0.72 * eggS, scale: 0.85 },
      { name: 'Lower', y: 0.40 * eggS, scale: 0.68 }
    ];
    eWingConfigs.forEach((wc) => {
      for (const side of [-1, 1]) {
        const wp = createJoint(`ArchangelEgg_Wing_${wc.name}_${side > 0 ? 'L' : 'R'}`, side * 0.62 * eggS, wc.y, -0.12, eggRoot);
        const ws = wc.scale;
        addBoxE(wp, 0.56 * ws, 0.12 * ws, 0.10 * ws, eHolyGoldM, side * 0.26 * ws, 0.12 * ws, 0, 0, 0, side * 0.25);
        for (let f = 0; f < 3; f++) {
          addBoxE(wp, (0.58 - f * 0.10) * ws, 0.14 * ws, 0.08 * ws, f === 2 ? eSunCoreM : eMarbleM, side * (0.34 + f * 0.08) * ws, (0 - f * 0.12) * ws, 0, 0, 0, side * (0.18 - f * 0.08));
        }
        eggWings.push({ pivot: wp, side });
      }
    });

    egg.eggRoot = eggRoot;
    egg.eggHalo = eggHalo;
    egg.eggWings = eggWings;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (측정 기반 배치)
  //  1) 생물의 실제 부품 크기를 재서, 벽 안쪽 면에서 WALL_GAP만큼만 띄우고 최대한 벽에 붙임(겹침 없음)
  //  2) 그 앞쪽 부채꼴에 알 3~4개를 랜덤 크기로 놓되, 생물 표면에 바짝 붙이고 서로는 안 겹치게 함
  // -------------------------------------------------------------------------
  const WALL_GAP = 0.5;
  // 생물 움직임(숨쉬기·날개·후광 회전 등)을 한 바퀴 돌려보며 닿을 수 있는 최대 범위를 기준으로 삼음
  const creatureBoxes = sweepMeshBoxes(creatureGroup, i => animateCreature(animParts, i * 0.32, 0.32)).filter(bx => bx.max.y > 0.12);   // 바닥 장식(원반 등)은 제외
  const cMargin = CREATURE_MOTION_MARGIN[zone.id] || 0.1;
  const outerNow = (zone.side === -1 ? Math.min(...creatureBoxes.map(bx => bx.min.x)) : Math.max(...creatureBoxes.map(bx => bx.max.x))) + zone.side * cMargin;   // 움직이는 최대 범위까지 포함
  const shiftX = zone.side * (wallInnerX - WALL_GAP) - outerNow;
  creatureGroup.position.x += shiftX;
  creatureBoxes.forEach(bx => { bx.min.x += shiftX; bx.max.x += shiftX; });
  animParts.fit = { outerX: outerNow + shiftX, shiftX };      // (검증용 기록)

  if (eggFactory) {
    const count = 3 + (Math.random() < 0.5 ? 1 : 0);
    // 크기: 큰 것·작은 것이 섞이도록 구간별로 뽑음. 자리 잡기는 '큰 알부터' (큰 알이 제일 자리를 많이 차지하므로)
    const sizes = [0.55 + Math.random() * 0.15, 0.80 + Math.random() * 0.15, 1.05 + Math.random() * 0.15, 1.30 + Math.random() * 0.20];
    for (let i = sizes.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [sizes[i], sizes[j]] = [sizes[j], sizes[i]]; }
    const picked = sizes.slice(0, count).sort((u, v) => v - u);
    const cx = creatureGroup.position.x;      // 생물 중심 x (root 기준)
    const placed = [];                        // 이미 놓은 알들 { eg, x, z }
    const zLo = Math.min(...creatureBoxes.map(bx => bx.min.z)) - 3.0, zHi = Math.max(...creatureBoxes.map(bx => bx.max.z)) + 3.0;
    // 생물 앞쪽(복도 쪽) 영역을 0.25칸 격자로 나눠, 칸마다 '생물 표면까지 거리'를 미리 계산해 둠(후보 거르기용, 오차 ±0.18)
    const GRID = 0.25, GU = 32, GZ = Math.ceil((zHi - zLo) / GRID);      // u: 생물 중심에서 복도 쪽으로 0~8
    const gridDist = new Float32Array(GU * GZ);
    for (let iu = 0; iu < GU; iu++) {
      const gx = cx - zone.side * (iu + 0.5) * GRID;
      for (let iz = 0; iz < GZ; iz++) {
        const gz = zLo + (iz + 0.5) * GRID;
        let dmin = 1e9;
        for (const bx of creatureBoxes) {
          const dx = Math.max(bx.min.x - gx, 0, gx - bx.max.x), dz = Math.max(bx.min.z - gz, 0, gz - bx.max.z);
          const d2 = dx * dx + dz * dz;
          if (d2 < dmin) dmin = d2;
        }
        gridDist[iu * GZ + iz] = Math.sqrt(dmin);
      }
    }
    const gridGapAt = (px, pz) => {
      const iu = Math.floor(((cx - px) * zone.side) / GRID), iz = Math.floor((pz - zLo) / GRID);
      if (iu < 0 || iu >= GU || iz < 0 || iz >= GZ) return 1e9;
      return gridDist[iu * GZ + iz];
    };
    const PAD = 0.05;                         // 부품 사이 기본 여유(움직임 여유는 따로 더함)

    // eg(알 부품 AABB 목록, 원점 기준)를 (ox,oz)에 놓았을 때 targets(AABB 목록)와 '3D로' 겹치는지
    const hitsBoxes = (eg, ox, oz, targets, pad) => {
      const ax0 = eg.aabb.min.x + ox - pad, ax1 = eg.aabb.max.x + ox + pad, az0 = eg.aabb.min.z + oz - pad, az1 = eg.aabb.max.z + oz + pad;
      for (const t of targets) {
        if (t.max.x < ax0 || t.min.x > ax1 || t.max.z < az0 || t.min.z > az1) continue;     // 전체 범위 밖이면 건너뜀(빠른 거름)
        for (const e of eg.boxes) {
          if (e.max.x + ox + pad < t.min.x || e.min.x + ox - pad > t.max.x) continue;
          if (e.max.z + oz + pad < t.min.z || e.min.z + oz - pad > t.max.z) continue;
          if (e.max.y + pad < t.min.y || e.min.y - pad > t.max.y) continue;                 // 높이도 여유를 두고 비교
          return true;
        }
      }
      return false;
    };

    for (let n = 0; n < count; n++) {
      const g = new THREE.Group();
      const parts = eggFactory(g);
      const sc = picked[n];
      g.rotation.y = inwardYaw + (Math.random() - 0.5) * 1.0;
      g.scale.setScalar(sc);
      // 알 부품의 실제 크기를 움직임(둥실거림·날개·후광·여의주 회전)까지 한 바퀴 돌려서 구함(회전·배율 적용, 원점 기준)
      const baseYe = (zone.id === 'archangel' ? 0.38 : 0.18);
      const eboxes = sweepMeshBoxes(g, i => animateEgg(zone.id, parts, baseYe, i * 0.48 + 0.3, 0.48), 16);
      const aabb = { min: { x: 1e9, z: 1e9 }, max: { x: -1e9, z: -1e9 } };
      eboxes.forEach(bx => { aabb.min.x = Math.min(aabb.min.x, bx.min.x); aabb.max.x = Math.max(aabb.max.x, bx.max.x); aabb.min.z = Math.min(aabb.min.z, bx.min.z); aabb.max.z = Math.max(aabb.max.z, bx.max.z); });
      const eg = { boxes: eboxes, aabb };
      const shellR = 0.64 * parts.shell * sc;      // 알 껍데기 반경(집기·붙임 거리 계산용)
      const eMargin = (EGG_MOTION_MARGIN_1X[zone.id] || 0.15) * sc * MOTION_MARGIN_SCALE;   // 이 알이 움직일 때 더 벌어질 수 있는 범위

      const fits = (px, pz) => {
        if (px + aabb.max.x + eMargin > wallInnerX - 0.8 || px + aabb.min.x - eMargin < -(wallInnerX - 0.8)) return false;   // 양쪽 벽과 거리 확보
        if (hitsBoxes(eg, px, pz, creatureBoxes, PAD + cMargin * MOTION_MARGIN_SCALE + eMargin)) return false;                                 // 생물과 안 겹침(둘 다 움직이는 여유 포함)
        for (const o of placed) if (hitsBoxes(eg, px, pz, o.boxesAbs, PAD + eMargin + o.margin)) return false;           // 다른 알과 안 겹침
        return true;
      };
      const shellGap = (px, pz) => {               // 알 껍데기가 생물 표면에서 얼마나 떨어져 있는지(바닥 평면 기준)
        let gmin = 1e9;
        for (const bx of creatureBoxes) {
          const dx = Math.max(bx.min.x - px, 0, px - bx.max.x), dz = Math.max(bx.min.z - pz, 0, pz - bx.max.z);
          gmin = Math.min(gmin, Math.hypot(dx, dz));
        }
        return gmin - shellR;
      };

      // 생물 앞쪽(안쪽 절반) 영역에서 후보를 무작위로 뽑아, 껍데기가 생물 표면에서 0.5 이내인 곳만 고름.
      // 자리가 없으면 기준을 1.0 → 2.0 → 4.0 → 제한없음 순으로만 완화
      let best = null;
      for (const maxGap of [0.5, 1.0, 2.0, 4.0, 99]) {
        const cands = [];
        for (let k = 0; k < 500; k++) {
          const px = cx - zone.side * (Math.random() * GU * GRID);
          const pz = zLo + Math.random() * (zHi - zLo);
          if (gridGapAt(px, pz) - shellR > maxGap + 0.2) continue;      // 격자로 먼저 빠르게 거름(멀면 탈락)
          if (shellGap(px, pz) > maxGap) continue;                       // 정확한 거리로 다시 확인
          if (fits(px, pz)) cands.push({ x: px, z: pz });
        }
        if (cands.length) { best = cands[Math.floor(Math.random() * cands.length)]; break; }
      }
      if (!best) { console.warn('알 자리를 못 찾아 건너뜀:', zone.id, n); continue; }       // 겹치게 억지로 놓지는 않음

      g.position.set(best.x, 0, best.z);
      root.add(g);
      placed.push({ x: best.x, z: best.z, margin: eMargin, boxesAbs: eboxes.map(bx => ({ min: { x: bx.min.x + best.x, y: bx.min.y, z: bx.min.z + best.z }, max: { x: bx.max.x + best.x, y: bx.max.y, z: bx.max.z + best.z } })) });
      animParts.eggs.push({
        group: g, parts, scale: sc, shell: parts.shell,
        radius: shellR,                          // 알 껍데기 반경(집기 거리 계산용)
        baseY: (zone.id === 'archangel' ? 0.38 : 0.18),
        phase: Math.random() * 6.28,
        home: { pos: g.position.clone(), rot: g.rotation.clone() }
      });
    }
  }
  animParts.creatureBoxes = creatureBoxes;      // (검증용)

  return animParts;
}

// ============================================================================
// 3. 배경 생성 (길게 이어진 복도 + 구역별 맞춤 배경색 + 8종 생물 & 알 배치)
// ============================================================================
function createBackground(scene) {
  const PATH_WIDTH = 16;      // 길의 폭 (벽 사이 간격을 더 넓힘)
  const PATH_LENGTH = 1200;   // 8종 생물이 서로 엄청 멀리 떨어져 배치되도록 길을 1200으로 대폭 확장
  const WALL_HEIGHT = 9;      // 벽 높이
  const WALL_THICK = 1.2;     // 벽 두께

  scene.background = new THREE.Color(0x9fd8ef);
  scene.fog = new THREE.Fog(0x9fd8ef, 55, 210);

  // ---- 조명 ----
  const hemi = new THREE.HemisphereLight(0xffffff, 0x6a8a6a, 1.0);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(6, 14, -4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
  sun.shadow.camera.top = 16;   sun.shadow.camera.bottom = -16;
  sun.shadow.camera.far = 70;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  // ---- 끝/안전구역 치수 ----
  const SAFE_LENGTH = 36;   // 안전구역 가로·세로를 2배로 (ROOM_WIDTH도 이 값과 같이 늘어남, 정사각형 유지)
  const ROOM_EXTRA = (SAFE_LENGTH - PATH_WIDTH) / 2;
  const ROOM_WIDTH = PATH_WIDTH + ROOM_EXTRA * 2;
  const END_Z = PATH_LENGTH / 2;                // +600
  const SAFE_START = END_Z - SAFE_LENGTH;       // +582
  const SAFE_END = END_Z;                       // +600
  const CORRIDOR_Z0 = -PATH_LENGTH / 2;         // -600
  const CORRIDOR_LEN = SAFE_START - CORRIDOR_Z0;
  const corridorX = PATH_WIDTH / 2 + WALL_THICK / 2;

  // ---- 생물 기준 앞뒤 배경 색을 각 생물 특성에 맞게 구간별로 생성 ----
  const biomeWallGroups = [];
  BIOME_ZONES.forEach(zone => {
    const segLen = zone.zMax - zone.zMin;
    const segMidZ = (zone.zMin + zone.zMax) / 2;

    const zFloorMat = new THREE.MeshStandardMaterial({ color: zone.floorColor, roughness: 0.85 });
    const zWallMat  = new THREE.MeshStandardMaterial({ color: zone.wallColor, roughness: 0.9 });
    const zCapMat   = new THREE.MeshStandardMaterial({ color: zone.capColor, roughness: 0.6, metalness: 0.2 });
    const zPanelMat = new THREE.MeshStandardMaterial({ color: zone.panelColor, roughness: 0.75 });

    // 구역 바닥
    const segFloor = new THREE.Mesh(new THREE.PlaneGeometry(PATH_WIDTH, segLen), zFloorMat);
    segFloor.rotation.x = -Math.PI / 2;
    segFloor.position.set(0, 0.012, segMidZ);
    segFloor.receiveShadow = true;
    scene.add(segFloor);

    // 구역 양옆 벽
    const lWall = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, segLen), zWallMat);
    lWall.position.set(-corridorX, WALL_HEIGHT / 2, segMidZ);
    lWall.castShadow = true; lWall.receiveShadow = true;

    const rWall = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, segLen), zWallMat);
    rWall.position.set(corridorX, WALL_HEIGHT / 2, segMidZ);
    rWall.castShadow = true; rWall.receiveShadow = true;
    scene.add(lWall, rWall);

    // 구역 양옆 갓돌(Cap)
    const lCap = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK + 0.4, 0.4, segLen), zCapMat);
    lCap.position.set(-corridorX, WALL_HEIGHT + 0.2, segMidZ);
    const rCap = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK + 0.4, 0.4, segLen), zCapMat);
    rCap.position.set(corridorX, WALL_HEIGHT + 0.2, segMidZ);
    scene.add(lCap, rCap);

    // 구역 벽면 패널 장식
    const panelCount = Math.floor(segLen / 5);
    for (let i = 0; i < panelCount; i++) {
      const pz = zone.zMin + i * 5 + 2.5;
      for (const side of [-1, 1]) {
        const panel = new THREE.Mesh(new THREE.BoxGeometry(0.08, WALL_HEIGHT * 0.84, 2.8), zPanelMat);
        panel.position.set(side * corridorX - side * (WALL_THICK / 2 + 0.04), WALL_HEIGHT * 0.5, pz);
        scene.add(panel);
      }
    }

    // 생물이 위치한 벽면에 생물 상징 후광 아치 장식 추가
    const emblem = new THREE.Mesh(
      new THREE.BoxGeometry(0.14, 5.2, 6.2),
      new THREE.MeshStandardMaterial({
        color: zone.capColor,
        roughness: 0.3,
        metalness: 0.5,
        emissive: zone.accentColor,
        emissiveIntensity: 0.35
      })
    );
    emblem.position.set(
      zone.side * corridorX - zone.side * (WALL_THICK / 2 + 0.06),
      2.8,
      zone.zCenter
    );
    scene.add(emblem);

    biomeWallGroups.push({ zone, lWall, rWall });
  });

  // 가운데 달리는 느낌을 주는 격자
  const grid = new THREE.GridHelper(PATH_LENGTH, PATH_LENGTH / 2, 0xffffff, 0x888888);
  grid.scale.x = PATH_WIDTH / PATH_LENGTH;
  grid.position.y = 0.018;
  grid.material.opacity = 0.22;
  grid.material.transparent = true;
  scene.add(grid);

  // ---- 안전구역 기본 벽 및 바닥 ----
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x8c7a63, roughness: 0.95 });
  const wallTopMat = new THREE.MeshStandardMaterial({ color: 0x6f6050, roughness: 0.95 });

  function makeWall(x, len, z) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, len), wallMat);
    wall.position.set(x, WALL_HEIGHT / 2, z);
    wall.castShadow = true; wall.receiveShadow = true;
    return wall;
  }
  function makeCap(x, len, z) {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK + 0.4, 0.4, len), wallTopMat);
    cap.position.set(x, WALL_HEIGHT + 0.2, z);
    cap.castShadow = true;
    return cap;
  }

  const roomX = ROOM_WIDTH / 2 + WALL_THICK / 2;
  const roomSideLen = SAFE_LENGTH + WALL_THICK;
  const roomMidZ = SAFE_START + SAFE_LENGTH / 2;
  scene.add(makeWall(-roomX, roomSideLen, roomMidZ));
  scene.add(makeWall(roomX, roomSideLen, roomMidZ));
  scene.add(makeCap(-roomX, roomSideLen, roomMidZ));
  scene.add(makeCap(roomX, roomSideLen, roomMidZ));

  const decor = new THREE.Group();
  scene.add(decor);

  const safeZone = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_WIDTH, SAFE_LENGTH),
    new THREE.MeshStandardMaterial({ color: 0xffe066, roughness: 0.8 })
  );
  safeZone.rotation.x = -Math.PI / 2;
  safeZone.position.set(0, 0.015, SAFE_START + SAFE_LENGTH / 2);
  safeZone.receiveShadow = true;
  scene.add(safeZone);

  const safeEdge = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_WIDTH, 0.15),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  safeEdge.rotation.x = -Math.PI / 2;
  safeEdge.position.set(0, 0.02, SAFE_START);
  scene.add(safeEdge);

  const endWall = new THREE.Mesh(
    new THREE.BoxGeometry(ROOM_WIDTH + WALL_THICK * 2, WALL_HEIGHT, WALL_THICK),
    wallMat
  );
  endWall.position.set(0, WALL_HEIGHT / 2, END_Z + WALL_THICK / 2);
  endWall.castShadow = true; endWall.receiveShadow = true;
  scene.add(endWall);

  const endCap = new THREE.Mesh(
    new THREE.BoxGeometry(ROOM_WIDTH + WALL_THICK * 2 + 0.4, 0.4, WALL_THICK + 0.4),
    wallTopMat
  );
  endCap.position.set(0, WALL_HEIGHT + 0.2, END_Z + WALL_THICK / 2);
  scene.add(endCap);

  // 북쪽 맨 끝(-600) 마감 벽
  const northEndWall = new THREE.Mesh(
    new THREE.BoxGeometry(PATH_WIDTH + WALL_THICK * 2, WALL_HEIGHT, WALL_THICK),
    new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4, metalness: 0.5 })
  );
  northEndWall.position.set(0, WALL_HEIGHT / 2, CORRIDOR_Z0 - WALL_THICK / 2);
  scene.add(northEndWall);

  function makeStep(x1, x2, z) {
    const w = new THREE.Mesh(
      new THREE.BoxGeometry(Math.abs(x2 - x1) + WALL_THICK, WALL_HEIGHT, WALL_THICK),
      wallMat
    );
    w.position.set((x1 + x2) / 2, WALL_HEIGHT / 2, z);
    w.castShadow = true; w.receiveShadow = true;
    return w;
  }
  // 복도→안전구역 전환 모서리 벽: 복도 폭과 안전구역 폭의 차이를 막아줌
  // ROOM_EXTRA > 0이면(지금은 10) 복도 끝 양쪽에 'ㄷ'자 막음 벽이 필요
  if (ROOM_WIDTH > PATH_WIDTH + 0.1) {
    // corridorX와 roomX 사이 구간을 채우는 벽
    const stepW = roomX - corridorX;
    const makeTransWall = (sideSign) => {
      const mx = sideSign * (corridorX + stepW / 2);
      const w = new THREE.Mesh(new THREE.BoxGeometry(stepW, WALL_HEIGHT, WALL_THICK), wallMat);
      w.position.set(mx, WALL_HEIGHT / 2, SAFE_START);
      w.castShadow = true; w.receiveShadow = true;
      return w;
    };
    scene.add(makeTransWall(-1));
    scene.add(makeTransWall(1));
  }

  // 안전구역 울타리
  const postMat = new THREE.MeshLambertMaterial({ color: 0x8a6a45 });
  const railFenceMat = new THREE.MeshLambertMaterial({ color: 0x9c7a52 });
  const FENCE_INSET = 0.7;
  const fenceHalf = ROOM_WIDTH / 2 - FENCE_INSET;
  const fenceZ0 = SAFE_START + FENCE_INSET;
  const fenceZ1 = SAFE_END - FENCE_INSET;

  function fencePost(x, z) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.1), postMat);
    post.position.set(x, 0.45, z);
    post.castShadow = true;
    return post;
  }
  function fenceLine(x1, z1, x2, z2) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    const n = Math.max(2, Math.round(len / 1.8));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      decor.add(fencePost(x1 + dx * t, z1 + dz * t));
    }
    for (const railY of [0.3, 0.62]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, len + 0.1), railFenceMat);
      rail.position.set((x1 + x2) / 2, railY, (z1 + z2) / 2);
      rail.rotation.y = Math.atan2(dx, dz);
      rail.castShadow = true;
      decor.add(rail);
    }
  }
  fenceLine(-fenceHalf, fenceZ0, -fenceHalf, fenceZ1);
  fenceLine(fenceHalf, fenceZ0, fenceHalf, fenceZ1);
  fenceLine(-fenceHalf, fenceZ1, fenceHalf, fenceZ1);

  // ---- 8종 생물(자고 있는 상태) & 그 앞의 알 생성 ----
  const creatures = BIOME_ZONES.map(zone => {
    const c = createCreatureAndEgg(zone, corridorX, PATH_WIDTH / 2);
    scene.add(c.root);
    return c;
  });

  let elapsed = 0;
  function update(dt, playerPos) {
    elapsed += dt;

    // 그림자 카메라가 플레이어를 따라가도록 갱신
    if (playerPos) {
      sun.position.set(playerPos.x + 6, 14, playerPos.z - 4);
      sun.target.position.copy(playerPos);
      sun.target.updateMatrixWorld();
    }

    // 8종 생물 수면 호흡 & 알 애니메이션 업데이트 (배치 때 움직임 범위를 재는 데도 같은 함수를 씀)
    creatures.forEach((c, idx) => {
      const t = elapsed * 2.0 + idx * 0.9;
      animateCreature(c, t, dt);
      c.eggs.forEach((e) => animateEgg(c.id, e.parts, e.baseY, t + e.phase, dt));
    });
  }

  return {
    group: decor,
    pathWidth: PATH_WIDTH,
    pathLength: PATH_LENGTH,
    safeZone: { minZ: SAFE_START, maxZ: SAFE_END },
    fencePen: { halfSize: fenceHalf, z0: fenceZ0, z1: fenceZ1 },
    endZ: END_Z,
    startZ: CORRIDOR_Z0,
    roomWidth: ROOM_WIDTH,
    wallThick: WALL_THICK,
    creatures,   // 바깥 frame()에서 접근 가능하게 반환
    update
  };
}
  </script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 320);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const bg = createBackground(scene);

    // ---- 플레이어 캐릭터 색 & GLTF 로더 ----
    // ---- 블록형 로우폴리 사람 캐릭터 (원본 뷰어에서 그대로 이식) ----
    let character = null;  // rig.root를 character로 씀

    // damp 보간 함수
    function damp(curr, target, lambda, dt) {
      return THREE.MathUtils.lerp(curr, target, 1 - Math.exp(-lambda * dt));
    }

    const humanMat = (color, rough = 0.65) =>
      new THREE.MeshStandardMaterial({ color, roughness: rough, flatShading: true });
    const mSkin = humanMat(0xfbbf98, 0.6), mHair = humanMat(0x3b2314, 0.75),
          mShirt = humanMat(0x0ea5e9, 0.65), mShirtD = humanMat(0x0284c7, 0.65),
          mPants = humanMat(0x1e3a8a, 0.7), mShoe = humanMat(0x334155, 0.6),
          mSole = humanMat(0xe2e8f0, 0.7);

    function hJoint(name, x, y, z, parent) {
      const g = new THREE.Group(); g.name = name;
      g.position.set(x, y, z); if (parent) parent.add(g); return g;
    }
    function hBox(w, h, d, m, x, y, z, parent) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true;
      if (parent) parent.add(mesh); return mesh;
    }

    const rig = {};
    // holder: 바닥 위치(x,z,y)·방향·크기 담당 / rig.root: 엉덩이 높이(점프·뛰기 바운스) 애니메이션 담당
    // 예전엔 둘이 같은 객체라 매 프레임 y가 0으로 덮어씌워져 발이 바닥에 파묻혔음
    const HOLDER_SCALE = 0.72;   // 캐릭터 크기(알을 들 때 이 값만큼 줄어드는 걸 상쇄하는 데도 사용)
    const humanHolder = new THREE.Group();
    humanHolder.scale.setScalar(HOLDER_SCALE);
    scene.add(humanHolder);
    rig.root = hJoint('Root', 0, 0.96, 0, humanHolder);
    rig.pelvis = hJoint('Pelvis', 0, 0, 0, rig.root);
    hBox(0.50, 0.18, 0.28, mPants, 0, 0.02, 0, rig.pelvis);
    rig.torso = hJoint('Torso', 0, 0.10, 0, rig.pelvis);
    hBox(0.52, 0.68, 0.28, mShirt, 0, 0.34, 0, rig.torso);
    hBox(0.53, 0.08, 0.29, mShirtD, 0, 0.04, 0, rig.torso);
    hBox(0.24, 0.08, 0.29, mSkin, 0, 0.65, 0.01, rig.torso);
    rig.neck = hJoint('Neck', 0, 0.68, 0, rig.torso);
    hBox(0.20, 0.10, 0.20, mSkin, 0, 0.04, 0, rig.neck);
    rig.head = hJoint('Head', 0, 0.08, 0, rig.neck);
    hBox(0.50, 0.50, 0.50, mSkin, 0, 0.25, 0, rig.head);
    hBox(0.54, 0.16, 0.54, mHair, 0, 0.46, 0, rig.head);
    hBox(0.52, 0.08, 0.14, mHair, 0, 0.36, 0.22, rig.head);
    hBox(0.54, 0.34, 0.16, mHair, 0, 0.28, -0.20, rig.head);
    hBox(0.08, 0.24, 0.40, mHair, 0.24, 0.32, -0.04, rig.head);
    hBox(0.08, 0.24, 0.40, mHair, -0.24, 0.32, -0.04, rig.head);
    const mEyeW = humanMat(0xffffff, 0.3), mEyeP = humanMat(0x1e293b, 0.2), mMouth = humanMat(0x9a3412, 0.6);
    hBox(0.11, 0.07, 0.04, mEyeW, 0.11, 0.24, 0.245, rig.head);
    hBox(0.06, 0.07, 0.05, mEyeP, 0.10, 0.24, 0.248, rig.head);
    hBox(0.11, 0.07, 0.04, mEyeW, -0.11, 0.24, 0.245, rig.head);
    hBox(0.06, 0.07, 0.05, mEyeP, -0.10, 0.24, 0.248, rig.head);
    hBox(0.12, 0.035, 0.05, mHair, 0.11, 0.31, 0.25, rig.head);
    hBox(0.12, 0.035, 0.05, mHair, -0.11, 0.31, 0.25, rig.head);
    hBox(0.07, 0.07, 0.05, mSkin, 0, 0.19, 0.255, rig.head);
    hBox(0.12, 0.04, 0.04, mMouth, 0, 0.11, 0.248, rig.head);

    function createHumanArm(prefix, isLeft) {
      const dir = isLeft ? 1 : -1;
      const shoulder = hJoint(`${prefix}_Shoulder`, dir * 0.38, 0.62, 0, rig.torso);
      hBox(0.24, 0.24, 0.24, mShirtD, 0, -0.08, 0, shoulder);
      hBox(0.20, 0.24, 0.20, mSkin, 0, -0.24, 0, shoulder);
      const elbow = hJoint(`${prefix}_Elbow`, 0, -0.36, 0, shoulder);
      hBox(0.19, 0.32, 0.19, mSkin, 0, -0.16, 0, elbow);
      const hand = hJoint(`${prefix}_Hand`, 0, -0.32, 0, elbow);
      hBox(0.20, 0.12, 0.20, mSkin, 0, -0.04, 0, hand);
      return { shoulder, elbow, hand };
    }
    rig.armL = createHumanArm('Arm_L', true);
    rig.armR = createHumanArm('Arm_R', false);

    function createHumanLeg(prefix, isLeft) {
      const dir = isLeft ? 1 : -1;
      const hip = hJoint(`${prefix}_Hip`, dir * 0.14, -0.04, 0, rig.pelvis);
      hBox(0.23, 0.44, 0.24, mPants, 0, -0.22, 0, hip);
      const knee = hJoint(`${prefix}_Knee`, 0, -0.44, 0, hip);
      hBox(0.21, 0.38, 0.22, mPants, 0, -0.19, 0, knee);
      const ankle = hJoint(`${prefix}_Ankle`, 0, -0.38, 0, knee);
      hBox(0.23, 0.12, 0.30, mShoe, 0, -0.05, 0.03, ankle);
      hBox(0.24, 0.04, 0.31, mSole, 0, -0.10, 0.03, ankle);
      return { hip, knee, ankle };
    }
    rig.legL = createHumanLeg('Leg_L', true);
    rig.legR = createHumanLeg('Leg_R', false);

    // 머리 위 물건 마운트 (알을 여기에 붙임)
    rig.carryMount = hJoint('Carry_Mount', 0, 1.54, 0.06, rig.torso);
    rig.carryMount.visible = false;

    character = humanHolder;  // 이동/회전은 holder에 적용
    document.getElementById("loading").style.display = "none";

    // 애니메이션 상태
    let humanAnimTime = 0;
    let isCarrying = false;
    function updateHumanAnim(dt, isMoving) {
      humanAnimTime += dt * (isMoving ? 1.0 : 1.0);
      // 달릴 때는 보간을 빠르게(느리면 빠른 다리·팔 동작이 뭉개져서 거의 안 움직이는 것처럼 보임)
      const s = isMoving ? 40 : 12;
      if (isMoving) {
        const t = humanAnimTime * 18.0;  // 달리기 모션 속도(원래 11)
        const stride = Math.sin(t), bounce = Math.abs(Math.cos(t));
        const runBaseY = isCarrying ? 0.907 : 0.870;  // 달릴 때 가장 낮은 발이 바닥에 닿는 값(계산)
        rig.root.position.y = damp(rig.root.position.y, runBaseY + bounce * (isCarrying ? 0.11 : 0.15), s, dt);
        rig.root.position.x = damp(rig.root.position.x, stride * 0.03, s, dt);
        rig.root.rotation.z = damp(rig.root.rotation.z, stride * 0.05, s, dt);
        const lean = isCarrying ? 0.10 : 0.24, twist = isCarrying ? 0.08 : 0.18;
        rig.torso.rotation.x = damp(rig.torso.rotation.x, lean, s, dt);
        rig.torso.rotation.y = damp(rig.torso.rotation.y, -stride * twist, s, dt);
        rig.head.rotation.x = damp(rig.head.rotation.x, -lean * 0.7, s, dt);
        rig.head.rotation.y = damp(rig.head.rotation.y, stride * twist * 0.8, s, dt);
        const legSwing = isCarrying ? 0.82 : 0.98;
        rig.legL.hip.rotation.x = damp(rig.legL.hip.rotation.x, Math.sin(t) * legSwing, s, dt);
        rig.legL.knee.rotation.x = damp(rig.legL.knee.rotation.x, Math.max(0, -Math.cos(t) * 1.35 + 0.25), s, dt);
        rig.legL.ankle.rotation.x = damp(rig.legL.ankle.rotation.x, Math.sin(t - 0.5) * 0.35, s, dt);
        rig.legR.hip.rotation.x = damp(rig.legR.hip.rotation.x, Math.sin(t + Math.PI) * legSwing, s, dt);
        rig.legR.knee.rotation.x = damp(rig.legR.knee.rotation.x, Math.max(0, -Math.cos(t + Math.PI) * 1.35 + 0.25), s, dt);
        rig.legR.ankle.rotation.x = damp(rig.legR.ankle.rotation.x, Math.sin(t + Math.PI - 0.5) * 0.35, s, dt);
        if (!isCarrying) {
          rig.armL.shoulder.rotation.x = damp(rig.armL.shoulder.rotation.x, Math.sin(t + Math.PI) * 0.95, s, dt);
          rig.armL.shoulder.rotation.z = damp(rig.armL.shoulder.rotation.z, 0.10, s, dt);
          rig.armL.elbow.rotation.x = damp(rig.armL.elbow.rotation.x, -0.85, s, dt);
          rig.armR.shoulder.rotation.x = damp(rig.armR.shoulder.rotation.x, Math.sin(t) * 0.95, s, dt);
          rig.armR.shoulder.rotation.z = damp(rig.armR.shoulder.rotation.z, -0.10, s, dt);
          rig.armR.elbow.rotation.x = damp(rig.armR.elbow.rotation.x, -0.85, s, dt);
        } else {
          const cb = Math.sin(t * 2 - 0.4);
          rig.armL.shoulder.rotation.x = damp(rig.armL.shoulder.rotation.x, -2.68 + cb * 0.08, s, dt);
          rig.armL.shoulder.rotation.z = damp(rig.armL.shoulder.rotation.z, -0.16, s, dt);
          rig.armL.elbow.rotation.x = damp(rig.armL.elbow.rotation.x, -0.42, s, dt);
          rig.armL.hand.rotation.x = damp(rig.armL.hand.rotation.x, 0.48, s, dt);
          rig.armR.shoulder.rotation.x = damp(rig.armR.shoulder.rotation.x, -2.68 + cb * 0.08, s, dt);
          rig.armR.shoulder.rotation.z = damp(rig.armR.shoulder.rotation.z, 0.16, s, dt);
          rig.armR.elbow.rotation.x = damp(rig.armR.elbow.rotation.x, -0.42, s, dt);
          rig.armR.hand.rotation.x = damp(rig.armR.hand.rotation.x, 0.48, s, dt);
          rig.carryMount.position.y = damp(rig.carryMount.position.y, 1.54 + cb * 0.02, s, dt);
        }
      } else {
        const t = humanAnimTime * 2.4;
        const breath = Math.sin(t), sway = Math.cos(t * 0.5);
        const baseH = isCarrying ? 0.992 : 0.995;  // 서 있을 때 발이 바닥에 닿는 값(계산)
        rig.root.position.y = damp(rig.root.position.y, baseH + breath * 0.015, s, dt);
        rig.root.position.x = damp(rig.root.position.x, sway * 0.015, s, dt);
        rig.root.rotation.z = damp(rig.root.rotation.z, sway * 0.015, s, dt);
        rig.torso.rotation.x = damp(rig.torso.rotation.x, isCarrying ? -0.05 : 0.02, s, dt);
        rig.torso.rotation.y = damp(rig.torso.rotation.y, sway * 0.04, s, dt);
        rig.head.rotation.x = damp(rig.head.rotation.x, isCarrying ? -0.10 : breath * 0.04, s, dt);
        rig.head.rotation.y = damp(rig.head.rotation.y, sway * (isCarrying ? 0.05 : 0.12), s, dt);
        rig.head.rotation.z = damp(rig.head.rotation.z, 0, s, dt);
        const kb = isCarrying ? 0.18 : 0.04, hb = isCarrying ? -0.09 : -0.02;
        rig.legL.hip.rotation.x = damp(rig.legL.hip.rotation.x, hb, s, dt);
        rig.legL.knee.rotation.x = damp(rig.legL.knee.rotation.x, kb, s, dt);
        rig.legL.ankle.rotation.x = damp(rig.legL.ankle.rotation.x, -kb * 0.5, s, dt);
        rig.legR.hip.rotation.x = damp(rig.legR.hip.rotation.x, hb, s, dt);
        rig.legR.knee.rotation.x = damp(rig.legR.knee.rotation.x, kb, s, dt);
        rig.legR.ankle.rotation.x = damp(rig.legR.ankle.rotation.x, -kb * 0.5, s, dt);
        if (!isCarrying) {
          rig.armL.shoulder.rotation.x = damp(rig.armL.shoulder.rotation.x, Math.sin(t) * 0.05, s, dt);
          rig.armL.shoulder.rotation.z = damp(rig.armL.shoulder.rotation.z, 0.06, s, dt);
          rig.armL.elbow.rotation.x = damp(rig.armL.elbow.rotation.x, -0.15, s, dt);
          rig.armR.shoulder.rotation.x = damp(rig.armR.shoulder.rotation.x, -Math.sin(t) * 0.05, s, dt);
          rig.armR.shoulder.rotation.z = damp(rig.armR.shoulder.rotation.z, -0.06, s, dt);
          rig.armR.elbow.rotation.x = damp(rig.armR.elbow.rotation.x, -0.15, s, dt);
        } else {
          rig.armL.shoulder.rotation.x = damp(rig.armL.shoulder.rotation.x, -2.75 + breath * 0.03, s, dt);
          rig.armL.shoulder.rotation.z = damp(rig.armL.shoulder.rotation.z, -0.16, s, dt);
          rig.armL.elbow.rotation.x = damp(rig.armL.elbow.rotation.x, -0.38, s, dt);
          rig.armL.hand.rotation.x = damp(rig.armL.hand.rotation.x, 0.45, s, dt);
          rig.armR.shoulder.rotation.x = damp(rig.armR.shoulder.rotation.x, -2.75 + breath * 0.03, s, dt);
          rig.armR.shoulder.rotation.z = damp(rig.armR.shoulder.rotation.z, 0.16, s, dt);
          rig.armR.elbow.rotation.x = damp(rig.armR.elbow.rotation.x, -0.38, s, dt);
          rig.armR.hand.rotation.x = damp(rig.armR.hand.rotation.x, 0.45, s, dt);
          rig.carryMount.position.y = damp(rig.carryMount.position.y, 1.54 + breath * 0.015, s, dt);
          rig.carryMount.rotation.z = damp(rig.carryMount.rotation.z, sway * 0.02, s, dt);
        }
      }
    }

    function stripRootMotionXZ(clip) {
      const track = clip.tracks.find(t => /Hips\.position$/.test(t.name));
      if (!track || !track.values || track.values.length < 3) return;
      const v = track.values;
      const x0 = v[0], z0 = v[2];
      for (let i = 0; i < v.length; i += 3) {
        v[i] = x0;
        v[i + 2] = z0;
      }
    }

    // 일부 환경에서 skinIndex/skinWeight 속성이 getComponent가 없는 형태로 들어올 때가 있어서,
    // 그럴 때도 안 죽고 값을 읽을 수 있게 안전하게 감싼 함수 (얼굴이 안 뜨던 원인)
    function getComp(attr, i, j) {
      if (typeof attr.getComponent === "function") return attr.getComponent(i, j);
      if (attr.isInterleavedBufferAttribute) return attr.data.array[attr.offset + i * attr.data.stride + j];
      return attr.array[i * attr.itemSize + j];
    }

    function paintMesh(mesh) {
      const geo = mesh.geometry;
      const pos = geo.attributes.position, si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
      const bones = mesh.skeleton.bones;
      const colors = new Float32Array(pos.count * 3);
      const v = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3();
      const hipsBone = bones.find(x => /Hips$/.test(x.name));
      const hipsY = hipsBone ? hipsBone.getWorldPosition(new THREE.Vector3()).y : 1.0;
      function along(bone, p) {
        bone.getWorldPosition(a);
        if (!bone.children[0]) return 0;
        bone.children[0].getWorldPosition(b);
        const ab = b.clone().sub(a);
        return p.clone().sub(a).dot(ab) / ab.lengthSq();
      }
      const col = c => new THREE.Color(c);
      for (let i = 0; i < pos.count; i++) {
        let best = 0, bw = -1;
        for (let j = 0; j < 4; j++) { const w = getComp(sw, i, j); if (w > bw) { bw = w; best = getComp(si, i, j); } }
        const bone = bones[best]; const n = bone ? bone.name : "";
        v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        let c = C.shirt;
        if (/Head|Neck|Eye/.test(n)) c = C.skin;
        else if (/Hand/.test(n)) c = C.skin;
        else if (/ForeArm/.test(n)) c = C.skin;
        else if (/Arm/.test(n)) c = along(bone, v) < 0.42 ? C.shirt : C.skin;
        else if (/Shoulder|Spine/.test(n)) c = C.shirt;
        else if (/UpLeg/.test(n)) c = along(bone, v) < 0.5 ? C.shorts : C.skin;
        else if (/Hips/.test(n)) c = v.y > hipsY + 0.06 ? C.shirt : C.shorts;
        else if (/Leg/.test(n)) c = C.skin;
        else if (/Foot|Toe/.test(n)) c = v.y < 0.035 ? C.sole : C.shoe;
        const cc = col(c);
        colors[i * 3] = cc.r; colors[i * 3 + 1] = cc.g; colors[i * 3 + 2] = cc.b;
      }
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      mesh.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0, skinning: true });
      mesh.castShadow = true;
    }

    function addFace(meshes) {
      const headBone = meshes[0].skeleton.bones.find(x => /Head$/.test(x.name));
      if (!headBone) return;
      const box = new THREE.Box3(); const v = new THREE.Vector3();
      for (const mesh of meshes) {
        const geo = mesh.geometry;
        const pos = geo.attributes.position, si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
        const bones = mesh.skeleton.bones;
        for (let i = 0; i < pos.count; i++) {
          let best = 0, bw = -1;
          for (let j = 0; j < 4; j++) { const w = getComp(sw, i, j); if (w > bw) { bw = w; best = getComp(si, i, j); } }
          if (bones[best] && /Head/.test(bones[best].name)) box.expandByPoint(v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld));
        }
      }
      if (box.isEmpty()) return;
      const c = box.getCenter(new THREE.Vector3()), h = box.getSize(new THREE.Vector3()).multiplyScalar(0.5);
      const parts = []; const solid = col => new THREE.MeshStandardMaterial({ color: col, roughness: 0.9 });
      const hair = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28, 0, Math.PI * 2, 0, 1.75), solid(C.hair));
      hair.scale.set(h.x * 1.09, h.y * 1.06, h.z * 1.09);
      hair.position.set(c.x, c.y + h.y * 0.06, c.z - h.z * 0.03);
      hair.rotation.x = -0.6; parts.push(hair);
      const fringe = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 16), solid(C.hair));
      fringe.scale.set(h.x * 0.95, h.y * 0.28, h.z * 0.5);
      fringe.position.set(c.x, c.y + h.y * 0.62, c.z + h.z * 0.55);
      parts.push(fringe);
      const onFace = (fx, fy, inset) => {
        const r = Math.max(0, 1 - fx * fx - fy * fy);
        return new THREE.Vector3(c.x + fx * h.x, c.y + fy * h.y, c.z + h.z * Math.sqrt(r) - inset);
      };
      for (const side of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), solid(0x1a1a1a));
        eye.scale.set(h.x * 0.1, h.y * 0.13, h.z * 0.06);
        eye.position.copy(onFace(side * 0.36, 0.05, h.z * 0.02)); parts.push(eye);
        const shine = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        shine.scale.setScalar(h.x * 0.03);
        shine.position.copy(onFace(side * 0.36 + 0.03, 0.1, -h.z * 0.035)); parts.push(shine);
        const brow = new THREE.Mesh(new THREE.BoxGeometry(h.x * 0.24, h.y * 0.04, h.z * 0.05), solid(C.hair));
        brow.position.copy(onFace(side * 0.36, 0.26, h.z * 0.01)); parts.push(brow);
        const ear = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), solid(C.skin));
        ear.scale.set(h.x * 0.1, h.y * 0.2, h.z * 0.16);
        ear.position.set(c.x + side * h.x * 0.98, c.y + h.y * 0.0, c.z - h.z * 0.05); parts.push(ear);
      }
      const mouth = new THREE.Mesh(new THREE.TorusGeometry(h.x * 0.15, h.x * 0.025, 8, 16, Math.PI), solid(0x8a3b2a));
      mouth.rotation.z = Math.PI; mouth.position.copy(onFace(0, -0.4, h.z * 0.01)); parts.push(mouth);
      for (const p of parts) { p.castShadow = true; scene.add(p); p.updateMatrixWorld(); headBone.attach(p); }
    }

    const standZ = (bg.safeZone.minZ + bg.safeZone.maxZ) / 2;
    // 캐릭터는 이미 위에서 블록형으로 생성 완료 (rig.root = character)

    // ================= 조작 & 구역 순간이동 지원 =================
    const charPos = new THREE.Vector3(0, 0, standZ);
    let charYaw = Math.PI;
    let speed = 0, targetSpeed = 0;
    const CHAR_RADIUS = 0.25;

    // 점프 상태
    let velY = 0;          // 수직 속도
    let isOnGround = true; // 땅에 닿아 있는지
    const GRAVITY = -22;
    const JUMP_FORCE = 7.5;
    const GROUND_Y = 0;   // 바닥 높이(holder 기준, 발바닥이 여기 닿음)

    const keys = {};

    // 알 운반 상태
    let carriedEgg = null;       // 현재 들고 있는 알 { c: 생물, e: 알 }
    const PICKUP_GAP = 0.8;      // 알 '표면'에서 이 거리 안으로 가까이 가야 집을 수 있음

    const pickupPrompt  = document.getElementById('pickup-prompt');
    const dropPrompt    = document.getElementById('drop-prompt');
    const carryingHud   = document.getElementById('carrying-hud');
    const _tmpV = new THREE.Vector3();

    // 가장 가까운(표면 기준) 알 찾기 — 높이는 무시하고 바닥 평면 거리로 비교(점프 중에도 집을 수 있게)
    function findNearestEgg() {
      let best = null, bestGap = PICKUP_GAP;
      bg.creatures.forEach(c => c.eggs.forEach(e => {
        e.group.getWorldPosition(_tmpV);
        const gap = Math.hypot(charPos.x - _tmpV.x, charPos.z - _tmpV.z) - e.radius;
        if (gap < bestGap) { bestGap = gap; best = { c, e }; }
      }));
      return best;
    }

    function pickupEgg(target) {
      if (carriedEgg) return;
      const { c, e } = target;
      carriedEgg = target;
      // 알을 두 손 위(머리 위)에 얹음. 크기는 '원래 알 크기 그대로' 유지:
      // 캐릭터 그룹이 HOLDER_SCALE배로 줄어 있으니 그만큼 키워서 월드 크기를 맞춤.
      // 순운동학 계산: 들기 자세에서 두 손 중심 = 몸통 기준 x ±0.27, y 1.30, z 0.16 (손 위쪽 면 y≈1.41)
      // → 알 바닥을 몸통 기준 y=1.40(손 위)에 두면 두 손이 알 바닥면을 받치는 모양
      c.root.remove(e.group);
      rig.carryMount.add(e.group);
      const ls = e.scale / HOLDER_SCALE;
      e.group.scale.setScalar(ls);
      e.group.position.set(0, (1.40 - 1.54) - ls * e.baseY, 0.16 - 0.06);   // carryMount(y 1.54, z 0.06) 기준으로 환산
      e.group.rotation.set(0, 0, 0);
      rig.carryMount.visible = true;
      isCarrying = true;
      carryingHud.style.display = 'block';
      const zoneDef = BIOME_ZONES.find(z => z.id === c.id);
      carryingHud.textContent = `🥚 ${zoneDef ? zoneDef.name.split(' ')[0] : ''} 알 운반 중`;
    }

    function dropEgg() {
      if (!carriedEgg) return;
      const { c, e } = carriedEgg;
      carriedEgg = null;
      isCarrying = false;
      rig.carryMount.visible = false;
      // 원래 있던 자리·크기·방향으로 복귀
      rig.carryMount.remove(e.group);
      c.root.add(e.group);
      e.group.scale.setScalar(e.scale);
      e.group.position.copy(e.home.pos);
      e.group.rotation.copy(e.home.rot);
      carryingHud.style.display = 'none';
    }

    addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === " ") {
        e.preventDefault();
        if (isOnGround) { velY = JUMP_FORCE; isOnGround = false; }
      }
      if (e.key.toLowerCase() === "f" && !e.repeat) {
        if (carriedEgg) {
          // 들고 있으면 내려놓기
          dropEgg();
        } else {
          // 가장 가까운 알 집기
          const target = findNearestEgg();
          if (target) pickupEgg(target);
        }
      }
    });
    addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

    let _boxHelper = null, _highlightedGroup = null;   // 알 하이라이트(흰 테두리)

    let camYaw = Math.PI, camPitch = 0.22, dist = 4.2;

    renderer.domElement.addEventListener("wheel", e => {
      e.preventDefault();
      if (e.ctrlKey) {
        dist = Math.max(1.2, Math.min(12, dist + e.deltaY * 0.04));
      } else {
        camYaw -= e.deltaX * 0.003;
        camPitch = Math.max(-0.9, Math.min(1.1, camPitch + e.deltaY * 0.002));
      }
    }, { passive: false });

    // 마우스 드래그 회전 지원 추가
    let isDragging = false, prevX = 0, prevY = 0;
    renderer.domElement.addEventListener("mousedown", e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
    addEventListener("mousemove", e => {
      if (!isDragging) return;
      camYaw -= (e.clientX - prevX) * 0.006;
      camPitch = Math.max(-0.9, Math.min(1.1, camPitch + (e.clientY - prevY) * 0.005));
      prevX = e.clientX; prevY = e.clientY;
    });
    addEventListener("mouseup", () => { isDragging = false; });

    let twoFingerActive = false, lastMidX = 0, lastMidY = 0, lastPinchDist = 0;
    function touchMid(t0, t1) { return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 }; }
    function touchDist(t0, t1) { return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY); }

    renderer.domElement.addEventListener("touchstart", e => {
      if (e.touches.length === 2) {
        twoFingerActive = true;
        const m = touchMid(e.touches[0], e.touches[1]);
        lastMidX = m.x; lastMidY = m.y;
        lastPinchDist = touchDist(e.touches[0], e.touches[1]);
      } else {
        twoFingerActive = false;
      }
      e.preventDefault();
    }, { passive: false });

    renderer.domElement.addEventListener("touchmove", e => {
      if (twoFingerActive && e.touches.length === 2) {
        const m = touchMid(e.touches[0], e.touches[1]);
        camYaw -= (m.x - lastMidX) * 0.008;
        camPitch = Math.max(-0.9, Math.min(1.1, camPitch + (m.y - lastMidY) * 0.006));
        lastMidX = m.x; lastMidY = m.y;

        const d = touchDist(e.touches[0], e.touches[1]);
        dist = Math.max(1.2, Math.min(12, dist - (d - lastPinchDist) * 0.05));
        lastPinchDist = d;
      }
      e.preventDefault();
    }, { passive: false });

    renderer.domElement.addEventListener("touchend", e => {
      if (e.touches.length < 2) twoFingerActive = false;
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const WALK_SPEED = 1.6, RUN_SPEED = 6.5;
    let last = performance.now();
    const zoneBanner = document.getElementById("zone-banner");
    const currentSkyColor = new THREE.Color(0x9fd8ef);
    const targetSkyColor = new THREE.Color(0x9fd8ef);

    function frame(now) {
      try {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;

      const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw);
      const rightX = -fwdZ, rightZ = fwdX;

      let mx = 0, mz = 0;
      if (keys["w"]) { mx += fwdX; mz += fwdZ; }
      if (keys["s"]) { mx -= fwdX; mz -= fwdZ; }
      if (keys["d"]) { mx += rightX; mz += rightZ; }
      if (keys["a"]) { mx -= rightX; mz -= rightZ; }

      const sprintBoost = 2.4; // 항상 최고 속도

      const mLen = Math.hypot(mx, mz);
      if (mLen > 0.001) {
        mx /= mLen; mz /= mLen;
        targetSpeed = 4.2 * sprintBoost;
        const wantYaw = Math.atan2(mx, mz);
        let d = ((wantYaw - charYaw + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
        charYaw += d * Math.min(1, dt * 14);
      } else {
        targetSpeed = 0;
      }
      speed += (targetSpeed - speed) * Math.min(1, dt * 20);

      const absSpeed = Math.abs(speed);
      const wIdle = Math.max(0, 1 - absSpeed);
      const wRun  = Math.max(0, Math.min(1, absSpeed - 1));
      const wWalk = Math.max(0, 1 - wIdle - wRun);
      const timeScale = absSpeed > 2 ? 1 + (absSpeed - 2) * 0.35 : 1;
      let groundSpeed = 0;

      // 블록형 사람 캐릭터 애니메이션 업데이트
      const isMoving = Math.abs(mx) > 0.01 || Math.abs(mz) > 0.01;
      updateHumanAnim(dt, isMoving);
      groundSpeed = isMoving ? Math.abs(targetSpeed) * 2.5 : 0;

      let nx = charPos.x + mx * groundSpeed * dt;
      let nz = charPos.z + mz * groundSpeed * dt;

      const widthT = Math.max(0, Math.min(1, (charPos.z - bg.safeZone.minZ) / bg.wallThick));
      const roomSpan = bg.pathWidth + (bg.roomWidth - bg.pathWidth) * widthT;
      const halfW = roomSpan / 2 - CHAR_RADIUS;
      nx = Math.max(-halfW, Math.min(halfW, nx));
      nz = Math.max(bg.startZ + CHAR_RADIUS, Math.min(bg.endZ - CHAR_RADIUS, nz));

      charPos.x = nx; charPos.z = nz;

      // 수직(점프/중력) 처리
      velY += GRAVITY * dt;
      charPos.y += velY * dt;
      if (charPos.y <= GROUND_Y) { charPos.y = GROUND_Y; velY = 0; isOnGround = true; }

      if (character) {
        character.position.set(charPos.x, charPos.y, charPos.z);
        character.rotation.y = charYaw;
      }

      // 알은 rig.carryMount에 붙어 있어서 캐릭터 애니메이션이 알아서 처리

      // F 프롬프트: 가까운 알이 있을 때만 표시
      // 가장 가까운 알 찾기 + 하이라이트(흰 테두리) 업데이트
      const nearTarget = !carriedEgg ? findNearestEgg() : null;
      const nearEggGroup = nearTarget ? nearTarget.e.group : null;
      if (nearEggGroup !== _highlightedGroup) {
        if (_boxHelper) { scene.remove(_boxHelper); _boxHelper = null; }
        _highlightedGroup = nearEggGroup;
        if (nearEggGroup) {
          _boxHelper = new THREE.BoxHelper(nearEggGroup, 0xffffff);
          _boxHelper.material.linewidth = 2;
          scene.add(_boxHelper);
        }
      }
      if (_boxHelper) _boxHelper.update();
      pickupPrompt.style.display = nearTarget ? 'block' : 'none';
      dropPrompt.style.display = carriedEgg ? 'block' : 'none';

      // 현재 플레이어가 위치한 생물 바이옴 구역 확인 및 하늘/안개 색상 부드럽게 전환
      const activeZone = BIOME_ZONES.find(z => charPos.z >= z.zMin && charPos.z < z.zMax);
      if (activeZone) {
        targetSkyColor.setHex(activeZone.skyColor);
        zoneBanner.textContent = `${activeZone.name} · 생물이 잠들어 있고 앞에 알이 놓여 있습니다 (중심 Z: ${activeZone.zCenter})`;
      } else {
        targetSkyColor.setHex(0x9fd8ef);
        zoneBanner.textContent = `🏡 안전구역 (출발점 Z: ${Math.round(charPos.z)}) — 북쪽(-Z)으로 달리거나 하단 버튼으로 각 생물 구역에 이동하세요`;
      }
      currentSkyColor.lerp(targetSkyColor, Math.min(1, dt * 3.5));
      scene.background.copy(currentSkyColor);
      scene.fog.color.copy(currentSkyColor);

      const camTarget = new THREE.Vector3(charPos.x, charPos.y + 0.65, charPos.z);
      let camX = camTarget.x + Math.sin(camYaw) * Math.cos(camPitch) * dist;
      let camZ = camTarget.z + Math.cos(camYaw) * Math.cos(camPitch) * dist;
      const camY = Math.max(0.35, camTarget.y + Math.sin(camPitch) * dist);

      camX = Math.max(-halfW, Math.min(halfW, camX));
      camZ = Math.min(camZ, bg.endZ - 0.1);

      camera.position.set(camX, camY, camZ);
      camera.lookAt(camTarget);

      bg.update(dt, charPos);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
      } catch(e) {
        // 오류 발생 시 화면에 직접 표시
        document.body.style.background = '#fff';
        document.body.innerHTML = '<pre style="color:red;padding:20px;font-size:14px">오류: ' + e.message + '\n\n' + e.stack + '</pre>';
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
