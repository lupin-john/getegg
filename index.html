// ============================================================================
// 2. 생물 + 알 생성 및 수면(Sleep) 애니메이션 팩토리
// - 각 생물은 벽 안쪽에 큼직하게 자리잡아 숨을 쉬며 잠들어 있고(Sleep),
//   그 바로 앞(길 안쪽 방향)에 각 생물 특성에 맞는 디테일한 리깅 알(Egg)이 놓여 있음
// ============================================================================
// ============================================================================
// 원본 동물 뷰어(8종)의 '재료·리그 빌더·동작(수면/달리기·날기) 코드' 구간을 그대로 가져온 공장 함수들
//  - makeXxx(scene) → { rig, setAction('sleep'|'run'|'fly'), getAction(), update(dt) }
//  - 원본의 디버그 로그, 바닥 마법진/파티클 등 '뷰어 장면용 효과'는 장면에 붙지 않게 했고, 조명은 가짜 조명으로 대체함
// ============================================================================
class FakeLight extends THREE.Group {
  constructor(c, i, d) { super(); this.intensity = i || 0; this.distance = d || 0; this.color = { set() {}, setHex() {} }; }
}
// 어떤 값이든 받아주는 빈 껍데기(뷰어 장면용 객체 자리 채우기)
function makeDummy() {
  const store = {};
  return new Proxy(function () {}, {
    get(t, k) { if (k === Symbol.toPrimitive) return () => 0; if (typeof k === 'symbol') return undefined; if (!(k in store)) store[k] = makeDummy(); return store[k]; },
    set(t, k, v) { store[k] = v; return true; },
    apply() { return makeDummy(); }
  });
}
const CREATURE_FACTORIES = {
  // ---------- chicken ----------
  chicken: function (scene) {
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        const materials = {
          feathers: new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.65, flatShading: true }),
          wingFeather: new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.65, flatShading: true }),
          comb: new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5, flatShading: true }), // 벼슬 & 고기수염
          beak: new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.45, flatShading: true }), // 부리
          leg: new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.5, flatShading: true }),  // 다리/발가락
          eye: new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, flatShading: true }),
          jointMarker: new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, depthTest: false })
        };

        const jointSpheres = [];

        function createJoint(name, x, y, z, parent) {
          const group = new THREE.Group();
          group.name = name;
          group.position.set(x, y, z);
          if (parent) parent.add(group);

          const marker = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), materials.jointMarker);
          marker.renderOrder = 999;
          marker.visible = false;
          group.add(marker);
          jointSpheres.push(marker);

          return group;
        }

        function addBox(w, h, d, mat, x, y, z, parent) {
          const geo = new THREE.BoxGeometry(w, h, d);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(x, y, z);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          if (parent) parent.add(mesh);
          return mesh;
        }

        // --- 4. 닭(Chicken) 계층형 본(Bone) 리깅 & 블록 메쉬 생성 ---
        const rig = {};

        // 루트 및 몸통 피벗
        rig.root = createJoint('Root', 0, 0.85, 0, scene);
        rig.body = createJoint('Body', 0, 0, 0, rig.root);

        // 통통한 박스형 몸통과 가슴/엉덩이 단차
        addBox(0.68, 0.58, 0.84, materials.feathers, 0, 0.08, 0, rig.body);
        addBox(0.60, 0.46, 0.22, materials.feathers, 0, 0.08, 0.46, rig.body); // 앞가슴 돌출

        // 목(Neck) & 머리(Head)
        rig.neck = createJoint('Neck', 0, 0.28, 0.34, rig.body);
        addBox(0.36, 0.36, 0.34, materials.feathers, 0, 0.14, 0.02, rig.neck);

        rig.head = createJoint('Head', 0, 0.30, 0.04, rig.neck);
        addBox(0.42, 0.44, 0.44, materials.feathers, 0, 0.18, 0.02, rig.head);

        // 빨간 벼슬 (Comb - 3단 블록)
        rig.comb = createJoint('Comb', 0, 0.40, 0.02, rig.head);
        addBox(0.10, 0.16, 0.38, materials.comb, 0, 0.07, 0.02, rig.comb);
        addBox(0.10, 0.10, 0.24, materials.comb, 0, 0.16, -0.01, rig.comb);
        addBox(0.10, 0.08, 0.12, materials.comb, 0, 0.22, -0.03, rig.comb);

        // 노란 부리 (윗부리 + 아랫부리 리깅)
        addBox(0.24, 0.11, 0.26, materials.beak, 0, 0.19, 0.34, rig.head);
        rig.lowerBeak = createJoint('LowerBeak', 0, 0.13, 0.22, rig.head);
        addBox(0.20, 0.07, 0.22, materials.beak, 0, -0.02, 0.10, rig.lowerBeak);

        // 빨간 고기수염 (Wattle - 턱 밑에 흔들리는 부위)
        rig.wattle = createJoint('Wattle', 0, 0.10, 0.27, rig.head);
        addBox(0.12, 0.18, 0.14, materials.comb, 0, -0.08, 0.0, rig.wattle);

        // 눈 (열린 눈 / 감은 눈)
        rig.eyesOpen = new THREE.Group();
        rig.head.add(rig.eyesOpen);
        addBox(0.05, 0.09, 0.09, materials.eye, 0.215, 0.25, 0.10, rig.eyesOpen);
        addBox(0.05, 0.09, 0.09, materials.eye, -0.215, 0.25, 0.10, rig.eyesOpen);

        rig.eyesClosed = new THREE.Group();
        rig.eyesClosed.visible = false;
        rig.head.add(rig.eyesClosed);
        addBox(0.05, 0.03, 0.11, materials.eye, 0.215, 0.24, 0.10, rig.eyesClosed);
        addBox(0.05, 0.03, 0.11, materials.eye, -0.215, 0.24, 0.10, rig.eyesClosed);

        // 양쪽 날개 (Wings - 어깨 피벗을 기준으로 파닥거림)
        rig.wingL = createJoint('Wing_L', 0.35, 0.28, 0.05, rig.body);
        addBox(0.11, 0.38, 0.56, materials.wingFeather, 0.05, -0.16, -0.06, rig.wingL);
        addBox(0.09, 0.24, 0.20, materials.wingFeather, 0.05, -0.14, -0.38, rig.wingL);

        rig.wingR = createJoint('Wing_R', -0.35, 0.28, 0.05, rig.body);
        addBox(0.11, 0.38, 0.56, materials.wingFeather, -0.05, -0.16, -0.06, rig.wingR);
        addBox(0.09, 0.24, 0.20, materials.wingFeather, -0.05, -0.14, -0.38, rig.wingR);

        // 꼬리 깃털 (Tail - 3단 부채꼴 블록)
        rig.tail = createJoint('Tail', 0, 0.24, -0.40, rig.body);
        const tailMid = addBox(0.18, 0.42, 0.22, materials.feathers, 0, 0.16, -0.10, rig.tail);
        tailMid.rotation.x = -0.45;
        const tailTip = addBox(0.14, 0.34, 0.18, materials.wingFeather, 0, 0.26, -0.24, rig.tail);
        tailTip.rotation.x = -0.85;
        const tailSideL = addBox(0.12, 0.30, 0.18, materials.wingFeather, 0.11, 0.12, -0.12, rig.tail);
        tailSideL.rotation.set(-0.5, 0.2, 0.15);
        const tailSideR = addBox(0.12, 0.30, 0.18, materials.wingFeather, -0.11, 0.12, -0.12, rig.tail);
        tailSideR.rotation.set(-0.5, -0.2, -0.15);

        // 두 다리 (Hip -> Ankle -> Foot 3단 관절 리깅)
        function createChickenLeg(prefix, xOffset) {
          const hip = createJoint(`${prefix}_Hip`, xOffset, -0.18, 0.02, rig.body);
          // 넓적다리 깃털
          addBox(0.18, 0.22, 0.20, materials.feathers, 0, -0.08, 0, hip);
          // 노란 정강이
          addBox(0.08, 0.36, 0.08, materials.leg, 0, -0.32, 0, hip);

          const ankle = createJoint(`${prefix}_Ankle`, 0, -0.52, 0, hip);
          // 발목 아래 마디
          addBox(0.07, 0.18, 0.07, materials.leg, 0, -0.08, 0, ankle);

            rig.frontR.knee.rotation.x = damp(rig.frontR.knee.rotation.x, Math.max(0, -Math.cos(frPhase)) * 1.15, s, dt);
            rig.frontR.paw.rotation.x = damp(rig.frontR.paw.rotation.x, Math.sin(frPhase - 0.5) * 0.4, s, dt);

            // 뒷다리 갤럽 (앞다리와 반대 위상으로 지면 박차기)
            const blPhase = t + Math.PI;
            const brPhase = t + Math.PI + 0.4;
            rig.backL.hip.rotation.x = damp(rig.backL.hip.rotation.x, Math.sin(blPhase) * 0.9, s, dt);
            rig.backL.knee.rotation.x = damp(rig.backL.knee.rotation.x, -Math.max(0, Math.cos(blPhase)) * 1.1, s, dt);
            rig.backL.paw.rotation.x = damp(rig.backL.paw.rotation.x, Math.cos(blPhase) * 0.45, s, dt);

            rig.backR.hip.rotation.x = damp(rig.backR.hip.rotation.x, Math.sin(brPhase) * 0.9, s, dt);
            rig.backR.knee.rotation.x = damp(rig.backR.knee.rotation.x, -Math.max(0, Math.cos(brPhase)) * 1.1, s, dt);
            rig.backR.paw.rotation.x = damp(rig.backR.paw.rotation.x, Math.cos(brPhase) * 0.45, s, dt);

            // 다리 좌우 회전 초기화
            [rig.frontL, rig.frontR, rig.backL, rig.backR].forEach(leg => {
              leg.hip.rotation.z = damp(leg.hip.rotation.z, 0, s, dt);
            });

            // 꼬리 역동적 파동
            rig.tail1.rotation.x = damp(rig.tail1.rotation.x, -0.25 + Math.sin(t - 0.5) * 0.25, s, dt);
            rig.tail2.rotation.x = damp(rig.tail2.rotation.x, 0.2 + Math.sin(t - 1.2) * 0.3, s, dt);
            rig.tail3.rotation.x = damp(rig.tail3.rotation.x, 0.15 + Math.sin(t - 1.8) * 0.35, s, dt);

            rig.head.rotation.x = damp(rig.head.rotation.x, 0.18 + breath * 0.04, s, dt);

            rig.frontL.hip.rotation.x = damp(rig.frontL.hip.rotation.x, -1.25, s, dt);
            rig.frontL.knee.rotation.x = damp(rig.frontL.knee.rotation.x, 1.85, s, dt);
            rig.frontL.paw.rotation.x = damp(rig.frontL.paw.rotation.x, -0.5, s, dt);
            rig.frontL.hip.rotation.z = damp(rig.frontL.hip.rotation.z, -0.2, s, dt);

            rig.tail1.rotation.y = damp(rig.tail1.rotation.y, 0.65, s, dt);
            rig.tail2.rotation.x = damp(rig.tail2.rotation.x, 0.05, s, dt);
            rig.tail2.rotation.y = damp(rig.tail2.rotation.y, 0.75, s, dt);
            rig.tail3.rotation.x = damp(rig.tail3.rotation.x, Math.sin(animTime * 2.2) * 0.15, s, dt);

            // 머리 위 Zzz 텍스트 위치 계산
            const headWorldPos = new THREE.Vector3();
            rig.head.getWorldPosition(headWorldPos);
            headWorldPos.y += 0.65 + ((animTime * 0.5) % 0.6);
            headWorldPos.project(camera);
            const x = (headWorldPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(headWorldPos.y * 0.5) + 0.5) * window.innerHeight;
            zzzEl.style.left = `${x}px`;
            zzzEl.style.top = `${y}px`;
            zzzEl.style.opacity = String(0.6 + breath * 0.4);

          } else {
            // --- 3) 대기 동작 (Idle Breathing & Look Around) ---
            rig.eyesOpen.visible = true;
            rig.eyesClosed.visible = false;

            rig.chest.scale.set(1, 1, 1);

            rig.chest.rotation.y = damp(rig.chest.rotation.y, 0, s, dt);

            rig.head.rotation.x = damp(rig.head.rotation.x, 0, s, dt);

            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.03, s, dt);

              leg.hip.rotation.z = damp(leg.hip.rotation.z, 0, s, dt);

              leg.paw.rotation.x = damp(leg.paw.rotation.x, 0, s, dt);
            });

            rig.tail1.rotation.x = damp(rig.tail1.rotation.x, -0.35, s, dt);
            rig.tail1.rotation.y = damp(rig.tail1.rotation.y, Math.sin(t) * 0.2, s, dt);
            rig.tail2.rotation.x = damp(rig.tail2.rotation.x, 0.25, s, dt);
            rig.tail2.rotation.y = damp(rig.tail2.rotation.y, Math.sin(t - 0.6) * 0.28, s, dt);
            rig.tail3.rotation.x = damp(rig.tail3.rotation.x, 0.2, s, dt);
          }

  // ---------- dragon ----------
  dragon: function (scene) {

        const jointSpheres = [];
        function createJoint(name, parent, x, y, z) {
          const group = new THREE.Group();
          group.name = name;
          group.position.set(x, y, z);

          const marker = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), materials.jointMarker);
          marker.renderOrder = 999;
          marker.visible = false;
          group.add(marker);
          jointSpheres.push(marker);

          mesh.position.set(x, y, z);
          mesh.rotation.set(rx, ry, rz);
          mesh.castShadow = true;
          mesh.receiveShadow = true;

        // --- 4. 블록형 드래곤(Dragon) 리깅 계층 구조 생성 ---

        function createDragonWing(side) {

        rig.hindLegL = createDragonLeg('HindL', rig.abdomen, 0.44, -0.18, -0.68, true);
        rig.hindLegR = createDragonLeg('HindR', rig.abdomen, -0.44, -0.18, -0.68, true);

        // --- 5. 비행 바람 파티클 / 이펙트 라인 (날아오는 느낌 강조) ---
        const windLinesGroup = new THREE.Group();

        const windLines = [];
        const windMat = new THREE.MeshBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.35 });
        for (let i = 0; i < 18; i++) {
          const lineMesh = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 1.8 + Math.random() * 1.5), windMat);
          lineMesh.position.set(
            (Math.random() - 0.5) * 9,
            1.0 + Math.random() * 3.8,
            (Math.random() - 0.5) * 12
          );
          windLinesGroup.add(lineMesh);
          windLines.push({ mesh: lineMesh, speed: 14 + Math.random() * 10 });
        }

        // --- 6. 애니메이션 상태 및 보간 로직 ---
        let currentAction = 'fly'; // 'fly' | 'sleep'
        let animSpeed = 1.0;
        let animTime = 0;
        const clock = new THREE.Clock();

        function damp(current, target, lambda, dt) {
          return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
        }

        function updateAnimation(dt) {
          animTime += dt * animSpeed;
          const s = 7.5; // 부드러운 트랜지션 보간 계수

          if (currentAction === 'fly') {
            // ==========================================
            // 1) 날아오기 동작 (Flying In / Soaring Approach)
            // ==========================================
            rig.eyesOpen.visible = true;
            rig.eyesClosed.visible = false;
            windLinesGroup.visible = true;

            // 맞바람 스트림 파티클 이동 (앞에서 뒤로 빠르게 흐르며 용이 날아오는 속도감 연출)
            windLines.forEach(w => {
              w.mesh.position.z -= w.speed * dt * animSpeed;
              if (w.mesh.position.z < -7) {
                w.mesh.position.z = 7;
                w.mesh.position.x = (Math.random() - 0.5) * 9;
                w.mesh.position.y = 1.0 + Math.random() * 3.8;
              }
            });

            const t = animTime * 4.2; // 날개짓 주기
            const flap = Math.sin(t);
            const flapDelayed = Math.sin(t - 1.1);

            // 날아오며 상하 부양 + 전진/선회 파동
            const hoverY = 2.45 - Math.sin(t - 0.5) * 0.42;
            const approachZ = Math.sin(animTime * 1.4) * 0.85; // 앞뒤로 치고 나오는 역동감
            const swayX = Math.cos(animTime * 1.1) * 0.45;

            rig.root.position.x = damp(rig.root.position.x, swayX, s, dt);
            rig.root.position.y = damp(rig.root.position.y, hoverY, s, dt);
            rig.root.position.z = damp(rig.root.position.z, approachZ, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, - Math.sin(animTime * 1.1) * 0.12, s, dt);

            // 흉통 & 복부 피칭 파동
            rig.chest.rotation.x = damp(rig.chest.rotation.x, 0.08 + Math.cos(t) * 0.14, s, dt);
            rig.chest.rotation.y = damp(rig.chest.rotation.y, 0, s, dt);
            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, -0.08 + Math.sin(t - 0.6) * 0.16, s, dt);
            rig.abdomen.rotation.y = damp(rig.abdomen.rotation.y, 0, s, dt);

            // 거대한 2단 날개 퍼덕임 (안쪽 날개와 바깥쪽 날개의 위상차로 채찍처럼 꺾임)
            const innerAngle = flap * 0.72 + 0.10;
            const outerAngle = flapDelayed * 0.65 - 0.15;

            rig.wingL.inner.rotation.z = damp(rig.wingL.inner.rotation.z, innerAngle, s * 1.5, dt);
            rig.wingL.inner.rotation.x = damp(rig.wingL.inner.rotation.x, 0.08, s, dt);
            rig.wingL.inner.rotation.y = damp(rig.wingL.inner.rotation.y, 0, s, dt);
            rig.wingL.outer.rotation.z = damp(rig.wingL.outer.rotation.z, outerAngle, s * 1.5, dt);

            rig.wingR.inner.rotation.z = damp(rig.wingR.inner.rotation.z, -innerAngle, s * 1.5, dt);
            rig.wingR.inner.rotation.x = damp(rig.wingR.inner.rotation.x, 0.08, s, dt);
            rig.wingR.inner.rotation.y = damp(rig.wingR.inner.rotation.y, 0, s, dt);
            rig.wingR.outer.rotation.z = damp(rig.wingR.outer.rotation.z, -outerAngle, s * 1.5, dt);

            // 목과 머리: 전방을 응시하며 비행 반동 흡수
            rig.neck1.rotation.x = damp(rig.neck1.rotation.x, 0.15 - Math.cos(t) * 0.12, s, dt);
            rig.neck1.rotation.y = damp(rig.neck1.rotation.y, 0, s, dt);
            rig.neck2.rotation.x = damp(rig.neck2.rotation.x, 0.10 - Math.cos(t - 0.4) * 0.12, s, dt);
            rig.neck2.rotation.y = damp(rig.neck2.rotation.y, 0, s, dt);
            rig.head.rotation.x = damp(rig.head.rotation.x, -0.18 + Math.cos(t - 0.8) * 0.10, s, dt);
            rig.head.rotation.y = damp(rig.head.rotation.y, 0, s, dt);
            rig.head.rotation.z = damp(rig.head.rotation.z, 0, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.18 + Math.max(0, Math.sin(t)) * 0.15, s, dt);

            // 4단 꼬리: 사인파 물결 파동 (Traveling Sine Wave)
            rig.tail1.rotation.x = damp(rig.tail1.rotation.x, Math.sin(t - 1.0) * 0.22, s, dt);
            rig.tail2.rotation.x = damp(rig.tail2.rotation.x, Math.sin(t - 1.7) * 0.26, s, dt);
            rig.tail3.rotation.x = damp(rig.tail3.rotation.x, Math.sin(t - 2.4) * 0.30, s, dt);
            rig.tail4.rotation.x = damp(rig.tail4.rotation.x, Math.sin(t - 3.1) * 0.34, s, dt);

            rig.tail1.rotation.y = damp(rig.tail1.rotation.y, Math.cos(animTime * 2.1) * 0.08, s, dt);
            rig.tail2.rotation.y = damp(rig.tail2.rotation.y, Math.cos(animTime * 2.1 - 0.5) * 0.10, s, dt);
            rig.tail3.rotation.y = damp(rig.tail3.rotation.y, Math.cos(animTime * 2.1 - 1.0) * 0.12, s, dt);
            rig.tail4.rotation.y = damp(rig.tail4.rotation.y, Math.cos(animTime * 2.1 - 1.5) * 0.15, s, dt);

            // 비행 중 뒤로 가지런히 접은 네 다리 (공기역학 포즈)
            const legBob = Math.sin(t - 0.6) * 0.08;
            [rig.frontLegL, rig.frontLegR].forEach(leg => {
              leg.hip.rotation.x = damp(leg.hip.rotation.x, 0.68 + legBob, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 0.75, s, dt);
              leg.paw.rotation.x = damp(leg.paw.rotation.x, 0.45, s, dt);
            });
            [rig.hindLegL, rig.hindLegR].forEach(leg => {
              leg.hip.rotation.x = damp(leg.hip.rotation.x, 0.85 + legBob, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 0.65, s, dt);
              leg.paw.rotation.x = damp(leg.paw.rotation.x, 0.50, s, dt);
            });

          } else if (currentAction === 'sleep') {
            // ==========================================
            // 2) 수면 동작 (Sleeping / Curled Resting)
            // ==========================================
            rig.eyesOpen.visible = false;
            rig.eyesClosed.visible = true;
            windLinesGroup.visible = false;

            const breath = Math.sin(animTime * 1.8); // 느리고 깊은 드래곤 호흡

            // 지면에 낮게 엎드려 몸을 둥글게 만 자세
            rig.root.position.x = damp(rig.root.position.x, 0, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 0.54 + breath * 0.025, s, dt);
            rig.root.position.z = damp(rig.root.position.z, 0, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, 0.06, s, dt);

            // 호흡에 따른 흉통 들썩임 및 몸통 말기
            rig.chest.rotation.x = damp(rig.chest.rotation.x, 0.06 + breath * 0.03, s, dt);
            rig.chest.rotation.y = damp(rig.chest.rotation.y, 0.18, s, dt);
            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, -0.08, s, dt);
            rig.abdomen.rotation.y = damp(rig.abdomen.rotation.y, 0.28, s, dt);

            // 양 날개를 등 옆으로 포근하게 접어 덮은 형태
            rig.wingL.inner.rotation.z = damp(rig.wingL.inner.rotation.z, 0.42 + breath * 0.03, s, dt);
            rig.wingL.inner.rotation.x = damp(rig.wingL.inner.rotation.x, -0.25, s, dt);
            rig.wingL.inner.rotation.y = damp(rig.wingL.inner.rotation.y, -0.35, s, dt);
            rig.wingL.outer.rotation.z = damp(rig.wingL.outer.rotation.z, -1.65, s, dt);

            rig.wingR.inner.rotation.z = damp(rig.wingR.inner.rotation.z, -0.42 - breath * 0.03, s, dt);
            rig.wingR.inner.rotation.x = damp(rig.wingR.inner.rotation.x, -0.25, s, dt);
            rig.wingR.inner.rotation.y = damp(rig.wingR.inner.rotation.y, 0.35, s, dt);
            rig.wingR.outer.rotation.z = damp(rig.wingR.outer.rotation.z, 1.65, s, dt);

            // 목을 낮게 내려 바닥/앞발 쪽으로 둥글게 얹음
            rig.neck1.rotation.x = damp(rig.neck1.rotation.x, 0.42, s, dt);
            rig.neck1.rotation.y = damp(rig.neck1.rotation.y, 0.25, s, dt);
            rig.neck2.rotation.x = damp(rig.neck2.rotation.x, 0.22, s, dt);
            rig.neck2.rotation.y = damp(rig.neck2.rotation.y, 0.30, s, dt);

            rig.head.rotation.x = damp(rig.head.rotation.x, -0.45 + breath * 0.03, s, dt);
            rig.head.rotation.y = damp(rig.head.rotation.y, 0.25, s, dt);
            rig.head.rotation.z = damp(rig.head.rotation.z, -0.12, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.04 + Math.max(0, breath) * 0.05, s, dt);

            // 꼬리를 몸통 옆으로 둥글게 감싸고 끝만 살짝 까딱임
            rig.tail1.rotation.x = damp(rig.tail1.rotation.x, -0.05, s, dt);
            rig.tail2.rotation.x = damp(rig.tail2.rotation.x, 0.02, s, dt);
            rig.tail3.rotation.x = damp(rig.tail3.rotation.x, 0.05, s, dt);
            rig.tail4.rotation.x = damp(rig.tail4.rotation.x, 0.08 + Math.sin(animTime * 2.2) * 0.06, s, dt);

            rig.tail1.rotation.y = damp(rig.tail1.rotation.y, 0.42, s, dt);
            rig.tail2.rotation.y = damp(rig.tail2.rotation.y, 0.48, s, dt);
            rig.tail3.rotation.y = damp(rig.tail3.rotation.y, 0.52, s, dt);
            rig.tail4.rotation.y = damp(rig.tail4.rotation.y, 0.45 + Math.cos(animTime * 1.5) * 0.08, s, dt);

            // 다리를 몸 아래/앞으로 편안하게 접음
            [rig.frontLegL, rig.frontLegR].forEach(leg => {
              leg.hip.rotation.x = damp(leg.hip.rotation.x, -1.15, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 0.30, s, dt);
              leg.paw.rotation.x = damp(leg.paw.rotation.x, 0.85, s, dt);
            });
            [rig.hindLegL, rig.hindLegR].forEach(leg => {
              leg.hip.rotation.x = damp(leg.hip.rotation.x, -0.95, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 1.45, s, dt);
              leg.paw.rotation.x = damp(leg.paw.rotation.x, -0.50, s, dt);
            });
          }
        }
    return { rig, setAction(a) { currentAction = a; }, getAction() { return currentAction; }, update(dt) { updateAnimation(dt); } };
  },
  // ---------- eastern ----------
  eastern: function (scene) {
    
        const materials = {
          jadeScale: new THREE.MeshStandardMaterial({ color: 0x0d9488, roughness: 0.55, flatShading: true }),     // 청록색 옥 비늘
          jadeDark: new THREE.MeshStandardMaterial({ color: 0x115e59, roughness: 0.65, flatShading: true }),      // 진한 청록 등 비늘
          goldBelly: new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.45, flatShading: true }),     // 황금빛 배 갑피
          antlerHorn: new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4, flatShading: true }),     // 사슴 뿔(녹각) & 발톱
          crimsonMane: new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.6, flatShading: true }),    // 붉은 불꽃 갈기 & 꼬리털
          whiskerMat: new THREE.MeshStandardMaterial({ color: 0xfef9c3, roughness: 0.4, flatShading: true }),     // 긴 용수염
          eyeGlow: new THREE.MeshStandardMaterial({
            color: 0xfef08a,
            emissive: 0xf59e0b,
            emissiveIntensity: 0.9,
            roughness: 0.2,
            flatShading: true
          }),
          eyeClosed: new THREE.MeshStandardMaterial({ color: 0x062c28, roughness: 0.8, flatShading: true }),
          pearlGlow: new THREE.MeshStandardMaterial({
            color: 0x67e8f9,
            emissive: 0x06b6d4,
            emissiveIntensity: 0.85,
            roughness: 0.15,
            flatShading: true
          }),
          cloudMat: new THREE.MeshStandardMaterial({
            color: 0xe0f2fe,
            transparent: true,
            opacity: 0.75,
            roughness: 0.8,
            flatShading: true
          }),
          jointMarker: new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, depthTest: false })
        };

        const jointSpheres = [];
        function createJoint(name, parent, x, y, z) {
          const group = new THREE.Group();
          group.name = name;
          group.position.set(x, y, z);
          parent.add(group);

          const marker = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 8), materials.jointMarker);
          marker.renderOrder = 999;
          marker.visible = false;
          group.add(marker);
          jointSpheres.push(marker);

          return group;
        }

        function addBlock(parent, w, h, d, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
          const geo = new THREE.BoxGeometry(w, h, d);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(x, y, z);
          mesh.rotation.set(rx, ry, rz);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        // --- 4. 동양 용(청룡) 계층형 본(Rig) 및 블록 지오메트리 생성 ---
        // 구조: Root(S0) -> 앞으로 Neck1 -> Neck2 -> Head -> Jaw / Whiskers
        //       Root(S0) -> 뒤로 Spine1 ~ Spine8 (8단 뱀형 몸통 + 꼬리)
        //       앞다리 한 쌍(Spine1에 부착), 뒷다리 한 쌍(Spine5에 부착)
        const rig = {};
        rig.root = createJoint('Root_Spine0', scene, 0, 2.5, 1.5);

        // 몸통 마디 생성 헬퍼 (옥빛 비늘 + 황금 배 + 등 갈기/돌기)
        function buildSegmentMesh(joint, w, h, len, zOffset = 0, hasMane = true) {
          // 메인 비늘 몸통
          addBlock(joint, w, h, len, materials.jadeScale, 0, 0, zOffset);
          // 등 상단 진한 갑피
          addBlock(joint, w * 0.82, h * 0.18, len * 0.96, materials.jadeDark, 0, h * 0.52, zOffset);
          // 황금빛 배 갑피
          addBlock(joint, w * 0.78, h * 0.22, len * 0.95, materials.goldBelly, 0, -h * 0.52, zOffset);
          // 붉은 등 갈기 & 황금 돌기
          if (hasMane) {
            addBlock(joint, w * 0.18, h * 0.45, len * 0.42, materials.crimsonMane, 0, h * 0.72, zOffset - len * 0.12, -0.25, 0, 0);
            addBlock(joint, w * 0.14, h * 0.30, len * 0.30, materials.antlerHorn, 0, h * 0.65, zOffset + len * 0.22, -0.2, 0, 0);
          }
        }

        // 4-1. 기준 마디 (Root / 가슴 앞쪽 S0)
        buildSegmentMesh(rig.root, 0.76, 0.72, 0.95, 0, true);

        // 4-2. 목 관절 (앞쪽 +Z 방향으로 2단 연결)
        rig.neck1 = createJoint('Neck_1', rig.root, 0, 0.08, 0.45);
        buildSegmentMesh(rig.neck1, 0.68, 0.66, 0.82, 0.35, true);

        rig.neck2 = createJoint('Neck_2', rig.neck1, 0, 0.12, 0.72);
        buildSegmentMesh(rig.neck2, 0.62, 0.60, 0.75, 0.32, true);

        // 4-3. 용 머리 (Head) - 사슴 뿔(녹각), 갈기, 부리형 주둥이, 긴 용수염
        rig.head = createJoint('Head', rig.neck2, 0, 0.10, 0.66);
        // 두개골
        addBlock(rig.head, 0.78, 0.66, 0.78, materials.jadeScale, 0, 0.05, 0.32);
        addBlock(rig.head, 0.84, 0.22, 0.42, materials.jadeDark, 0, 0.32, 0.38); // 강렬한 눈썹뼈
        // 윗주둥이 (동양 용 특유의 넓고 각진 주둥이 + 콧등 마루)
        addBlock(rig.head, 0.62, 0.36, 0.75, materials.jadeScale, 0, -0.02, 0.98);
        addBlock(rig.head, 0.42, 0.14, 0.70, materials.jadeDark, 0, 0.20, 0.96);
        // 들창코 콧구멍
        addBlock(rig.head, 0.14, 0.14, 0.14, materials.jadeDark, 0.20, 0.18, 1.25);
        addBlock(rig.head, 0.14, 0.14, 0.14, materials.jadeDark, -0.20, 0.18, 1.25);
        // 윗니 송곳니
        addBlock(rig.head, 0.09, 0.18, 0.09, materials.antlerHorn, 0.23, -0.24, 1.20);
        addBlock(rig.head, 0.09, 0.18, 0.09, materials.antlerHorn, -0.23, -0.24, 1.20);

        // 풍성한 붉은 구레나룻 & 뒷머리 갈기
        for (let side of [-1, 1]) {
          addBlock(rig.head, 0.18, 0.58, 0.45, materials.crimsonMane, side * 0.44, 0.02, 0.15, 0, side * 0.25, 0);
          addBlock(rig.head, 0.14, 0.24, 0.48, materials.jadeScale, side * 0.42, 0.25, 0.08, 0.2, side * 0.3, 0); // 귀
        }
        addBlock(rig.head, 0.56, 0.35, 0.45, materials.crimsonMane, 0, 0.42, 0.02, -0.35, 0, 0);

        // 동양 용의 상징: 가지 달린 사슴 뿔 (Antlers)
        for (let side of [-1, 1]) {
          // 메인 뿔 기둥 (뒤쪽 상단으로 뻗음)
          addBlock(rig.head, 0.12, 0.12, 0.85, materials.antlerHorn, side * 0.26, 0.55, -0.08, 0.45, -side * 0.22, 0);
          // 뿔 첫 번째 가지
          addBlock(rig.head, 0.09, 0.36, 0.09, materials.antlerHorn, side * 0.32, 0.78, -0.05, -0.2, 0, -side * 0.25);
          // 뿔 두 번째 끝 가지
          addBlock(rig.head, 0.09, 0.42, 0.09, materials.antlerHorn, side * 0.38, 0.88, -0.35, 0.3, 0, -side * 0.15);
        }

        // 다관절 롱 용수염 (Whiskers - 좌/우 2단 관절로 바람에 휘날림)
        function createWhisker(side) {
          const wBase = createJoint(`WhiskerBase_${side}`, rig.head, side * 0.28, -0.02, 1.15);
          addBlock(wBase, 0.07, 0.07, 0.65, materials.whiskerMat, side * 0.12, -0.10, -0.25, -0.25, side * 0.35, 0);
          const wTip = createJoint(`WhiskerTip_${side}`, wBase, side * 0.22, -0.20, -0.52);
          addBlock(wTip, 0.06, 0.06, 0.65, materials.whiskerMat, side * 0.08, -0.08, -0.28, -0.15, side * 0.2, 0);
          return { base: wBase, tip: wTip };
        }
        rig.whiskerL = createWhisker(1);
        rig.whiskerR = createWhisker(-1);

        // 눈 (열린 발광 눈 / 감은 눈)
        rig.eyesOpen = new THREE.Group();
        addBlock(rig.eyesOpen, 0.10, 0.16, 0.24, materials.eyeGlow, 0.38, 0.15, 0.48);
        addBlock(rig.eyesOpen, 0.10, 0.16, 0.24, materials.eyeGlow, -0.38, 0.15, 0.48);
        rig.head.add(rig.eyesOpen);

        rig.eyesClosed = new THREE.Group();
        addBlock(rig.eyesClosed, 0.11, 0.05, 0.26, materials.eyeClosed, 0.38, 0.12, 0.48);
        addBlock(rig.eyesClosed, 0.11, 0.05, 0.26, materials.eyeClosed, -0.38, 0.12, 0.48);
        rig.eyesClosed.visible = false;
        rig.head.add(rig.eyesClosed);

        // 아래턱 (Jaw) & 턱수염
        rig.jaw = createJoint('Jaw', rig.head, 0, -0.18, 0.55);
        addBlock(rig.jaw, 0.50, 0.18, 0.68, materials.goldBelly, 0, -0.06, 0.34);
        addBlock(rig.jaw, 0.34, 0.26, 0.28, materials.crimsonMane, 0, -0.22, 0.55, 0.3, 0, 0); // 턱수염

        // 4-4. 8단 뱀형 척추 & 꼬리 마디 (Spine 1 ~ Spine 8, 뒤쪽 -Z 방향으로 길게 이어짐)
        rig.spines = [];
        const spineSpecs = [
          { w: 0.76, h: 0.72, len: 0.95, dist: -0.88 }, // Spine 1 (앞다리 마디)
          { w: 0.72, h: 0.68, len: 0.95, dist: -0.88 }, // Spine 2
          { w: 0.68, h: 0.65, len: 0.95, dist: -0.88 }, // Spine 3
          { w: 0.64, h: 0.62, len: 0.95, dist: -0.88 }, // Spine 4 (뒷다리 마디)
          { w: 0.56, h: 0.55, len: 0.90, dist: -0.85 }, // Spine 5 (꼬리 시작)
          { w: 0.48, h: 0.46, len: 0.85, dist: -0.80 }, // Spine 6
          { w: 0.38, h: 0.38, len: 0.80, dist: -0.75 }, // Spine 7
          { w: 0.28, h: 0.28, len: 0.75, dist: -0.70 }  // Spine 8 (꼬리 끝)
        ];

        let parentJoint = rig.root;
        spineSpecs.forEach((spec, idx) => {
          const joint = createJoint(`Spine_${idx + 1}`, parentJoint, 0, 0, spec.dist);
          buildSegmentMesh(joint, spec.w, spec.h, spec.len, -spec.len * 0.42, true);
          rig.spines.push(joint);
          parentJoint = joint;

        // 꼬리 끝 풍성한 붓/불꽃 모양 갈기 장식 (Spine 8 끝에 부착)

          addBlock(hip, 0.32, 0.56, 0.36, materials.jadeDark, 0, -0.22, 0, 0.25, 0, 0);
          addBlock(hip, 0.16, 0.32, 0.28, materials.crimsonMane, 0, -0.20, -0.22, -0.3, 0, 0);

          const knee = createJoint(`${name}_Knee`, hip, 0, -0.46, 0.08);
          addBlock(knee, 0.25, 0.48, 0.28, materials.jadeScale, 0, -0.20, -0.04, -0.2, 0, 0);

          const paw = createJoint(`${name}_Paw`, knee, 0, -0.42, -0.05);
          addBlock(paw, 0.34, 0.16, 0.42, materials.jadeDark, 0, -0.05, 0.10);
          // 날카로운 황금 발톱 3개 + 뒤꿈치 발톱
          for (let c = -1; c <= 1; c++) {
            addBlock(paw, 0.07, 0.10, 0.24, materials.antlerHorn, c * 0.11, -0.07, 0.34, 0.25, 0, 0);
          }
          addBlock(paw, 0.07, 0.09, 0.18, materials.antlerHorn, 0, -0.06, -0.14, -0.2, 0, 0);

        }

        rig.frontLegL = createDragonClawLeg('FrontLegL', rig.spines[0], 0.48, -0.35);
        rig.frontLegR = createDragonClawLeg('FrontLegR', rig.spines[0], -0.48, -0.35);
        rig.hindLegL = createDragonClawLeg('HindLegL', rig.spines[3], 0.42, -0.35);
        rig.hindLegR = createDragonClawLeg('HindLegR', rig.spines[3], -0.42, -0.35);

        // --- 5. 여의주(Cintamani Pearl) 및 신비로운 구름/바람 이펙트 ---
        const pearlGroup = new THREE.Group();

        // 여의주 코어 블록 & 회전 오라 링
        const pearlCore = addBlock(pearlGroup, 0.42, 0.42, 0.42, materials.pearlGlow, 0, 0, 0, Math.PI / 4, Math.PI / 4, 0);
        const pearlRing = addBlock(pearlGroup, 0.56, 0.56, 0.56, materials.jointMarker, 0, 0, 0);
        const pearlLight = new FakeLight(0x22d3ee, 2.2, 5);
        pearlGroup.add(pearlLight);

        // 흘러가는 상서로운 구름 & 바람 파티클 (날아오기 전용)
        const skyEffectsGroup = new THREE.Group();

        const windParticles = [];
        for (let i = 0; i < 20; i++) {

          mesh.position.set(

        // --- 6. 애니메이션 상태 및 루프 ---
        let currentAction = 'fly'; // 'fly' | 'sleep'

        const clock = new THREE.Clock();

        function damp(current, target, lambda, dt) {
          return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
        }

        function updateAnimation(dt) {
          animTime += dt * animSpeed;
          const s = 10;

          // 여의주 자체 회전
          pearlCore.rotation.y += dt * 2.2;
          pearlCore.rotation.x += dt * 1.5;

            // ==========================================
            rig.eyesOpen.visible = true;
            rig.eyesClosed.visible = false;
            skyEffectsGroup.visible = true;

            const w = animTime * 4.2; // 파동 주기

            // 여의주가 용 머리 앞쪽 공중에서 빛나며 유도
            pearlGroup.position.set(
              damp(pearlGroup.position.x, Math.sin(w * 0.5) * 0.45, s, dt),
              damp(pearlGroup.position.y, 2.85 + Math.cos(w) * 0.28, s, dt),
              damp(pearlGroup.position.z, 4.45, s, dt)
            );

            // 구름과 맞바람이 뒤로 빠르게 흐르며 날아오는 속도감 연출
            windParticles.forEach(p => {
              p.mesh.position.z -= p.speed * animSpeed * dt;
              if (p.mesh.position.z < -8) {
                p.mesh.position.z = 8;
                p.mesh.position.x = (Math.random() - 0.5) * 9;
                p.mesh.position.y = 0.6 + Math.random() * 4.2;
              }
            });

            // Root 위치: 공중에서 상하(Y) 및 좌우(X)로 유영하는 사인파 비행
            rig.root.position.x = damp(rig.root.position.x, Math.sin(w * 0.5) * 0.45, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 2.55 + Math.sin(w) * 0.38, s, dt);
            rig.root.position.z = damp(rig.root.position.z, 1.3 + Math.cos(w * 0.5) * 0.25, s, dt);

            rig.root.rotation.x = damp(rig.root.rotation.x, -Math.cos(w) * 0.22, s, dt);
            rig.root.rotation.y = damp(rig.root.rotation.y, Math.cos(w * 0.5) * 0.18, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, -Math.cos(w * 0.5) * 0.12, s, dt);

            // 목과 머리: 전방의 여의주를 향해 시선을 유지하며 파동 흡수
            rig.neck1.rotation.x = damp(rig.neck1.rotation.x, Math.cos(w + 0.5) * 0.18, s, dt);
            rig.neck1.rotation.y = damp(rig.neck1.rotation.y, -Math.cos(w * 0.5 + 0.3) * 0.12, s, dt);
            rig.neck2.rotation.x = damp(rig.neck2.rotation.x, Math.cos(w + 0.9) * 0.18, s, dt);
            rig.neck2.rotation.y = damp(rig.neck2.rotation.y, -Math.cos(w * 0.5 + 0.6) * 0.12, s, dt);

            rig.head.rotation.x = damp(rig.head.rotation.x, -Math.cos(w + 1.2) * 0.16, s, dt);
            rig.head.rotation.y = damp(rig.head.rotation.y, 0, s, dt);
            rig.head.rotation.z = damp(rig.head.rotation.z, 0, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.20 + Math.sin(w) * 0.12, s, dt);

            // 긴 용수염이 맞바람에 뒤로 물결침
            [rig.whiskerL, rig.whiskerR].forEach((wh, i) => {
              const dir = i === 0 ? 1 : -1;
              wh.base.rotation.x = damp(wh.base.rotation.x, Math.sin(w * 1.5) * 0.22, s, dt);
              wh.base.rotation.y = damp(wh.base.rotation.y, dir * 0.15 + Math.cos(w) * 0.15, s, dt);
              wh.tip.rotation.x = damp(wh.tip.rotation.x, Math.sin(w * 1.5 - 0.8) * 0.30, s, dt);
            });

            // 8단 척추 & 꼬리: 동양 용 특유의 화려한 3차원 S자 파동 (Traveling Sine Wave)
            rig.spines.forEach((joint, idx) => {
              const phase = w - (idx + 1) * 0.62;
              const latPhase = w * 0.5 - (idx + 1) * 0.48;
              const ampX = 0.24 + idx * 0.025;
              const ampY = 0.16 + idx * 0.022;

              joint.rotation.x = damp(joint.rotation.x, Math.sin(phase) * ampX, s * 1.2, dt);
              joint.rotation.y = damp(joint.rotation.y, Math.sin(latPhase) * ampY, s * 1.2, dt);
              joint.rotation.z = damp(joint.rotation.z, 0, s, dt);
            });

            // 비행 중 구름을 움켜쥐듯 뒤로 살짝 접은 네 다리
            [rig.frontLegL, rig.frontLegR, rig.hindLegL, rig.hindLegR].forEach((leg, i) => {
              const wave = Math.sin(w - i * 0.5) * 0.10;
              leg.hip.rotation.x = damp(leg.hip.rotation.x, 0.72 + wave, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 0.65, s, dt);
              leg.paw.rotation.x = damp(leg.paw.rotation.x, 0.45, s, dt);
            });

          } else if (currentAction === 'sleep') {
            // ==========================================
            // 2) 수면 동작 (Coiled Dragon Sleeping)
            // ==========================================
            rig.eyesOpen.visible = false;
            rig.eyesClosed.visible = true;
            skyEffectsGroup.visible = false;

            const breath = Math.sin(animTime * 1.8); // 깊고 느린 신룡의 호흡

            // 동양 용이 긴 몸통을 둥글게 또아리(Coil) 틀어 여의주를 품고 잠든 자세
            rig.root.position.x = damp(rig.root.position.x, -0.85, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 0.46 + breath * 0.02, s, dt);
            rig.root.position.z = damp(rig.root.position.z, 0.55, s, dt);

            rig.root.rotation.x = damp(rig.root.rotation.x, 0.03 * breath, s, dt);
            rig.root.rotation.y = damp(rig.root.rotation.y, 0.55, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, 0.05, s, dt);

            // 목을 안쪽으로 부드럽게 감아 여의주 옆에 턱을 괴고 잠듦
            rig.neck1.rotation.x = damp(rig.neck1.rotation.x, 0.08, s, dt);
            rig.neck1.rotation.y = damp(rig.neck1.rotation.y, 0.42, s, dt);
            rig.neck2.rotation.x = damp(rig.neck2.rotation.x, 0.12, s, dt);
            rig.neck2.rotation.y = damp(rig.neck2.rotation.y, 0.45, s, dt);

            rig.head.rotation.x = damp(rig.head.rotation.x, -0.18 + breath * 0.03, s, dt);
            rig.head.rotation.y = damp(rig.head.rotation.y, 0.35, s, dt);
            rig.head.rotation.z = damp(rig.head.rotation.z, -0.10, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.04 + Math.max(0, breath) * 0.05, s, dt);

            // 수면 중 바닥에 편안히 늘어진 용수염
            [rig.whiskerL, rig.whiskerR].forEach(wh => {
              wh.base.rotation.x = damp(wh.base.rotation.x, -0.25 + breath * 0.04, s, dt);
              wh.base.rotation.y = damp(wh.base.rotation.y, 0, s, dt);
              wh.tip.rotation.x = damp(wh.tip.rotation.x, 0.20, s, dt);
            });

            // 8단 척추 마디가 한 바퀴 원형 또아리(Coil)를 그리며 몸을 감쌈
            const coilAnglesY = [-0.46, -0.50, -0.52, -0.52, -0.50, -0.48, -0.45, -0.40];
            rig.spines.forEach((joint, idx) => {
              const tailWag = idx >= 6 ? Math.sin(animTime * 2.0 + idx) * 0.07 : 0;
              joint.rotation.x = damp(joint.rotation.x, idx === 7 ? 0.12 + tailWag : 0.01 * breath, s, dt);
              joint.rotation.y = damp(joint.rotation.y, coilAnglesY[idx] + tailWag, s, dt);
              joint.rotation.z = damp(joint.rotation.z, 0, s, dt);
            });

            // 또아리 중심부에 은은하게 떠 있는 여의주
            pearlGroup.position.set(
              damp(pearlGroup.position.x, 0.15, s, dt),
              damp(pearlGroup.position.y, 0.42 + breath * 0.05, s, dt),
              damp(pearlGroup.position.z, 0.25, s, dt)
            );

            // 네 다리를 몸통 옆으로 나란히 접어 휴식
            [rig.frontLegL, rig.frontLegR, rig.hindLegL, rig.hindLegR].forEach(leg => {
              leg.hip.rotation.x = damp(leg.hip.rotation.x, -1.05, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 1.35, s, dt);
              leg.paw.rotation.x = damp(leg.paw.rotation.x, -0.30, s, dt);
            });
          }
        }
    return { rig, setAction(a) { currentAction = a; }, getAction() { return currentAction; }, update(dt) { updateAnimation(dt); } };
  },
  // ---------- lion ----------

        // 5-2. 복부/허리(Abdomen) - 날렵한 고양잇과 허리 라인
        rig.abdomen = createJoint('Abdomen', rig.chest, 0, 0.02, -0.72);
        addBlock(rig.abdomen, 1.04, 0.98, 1.38, 0, 0, -0.58, materials.voidBody);
        addBlock(rig.abdomen, 0.92, 0.35, 1.25, 0, -0.42, -0.55, materials.nebulaFur);
        addStarCrystal(rig.abdomen, 0.11, 0.54, 0.24, -0.45, false);
        addStarCrystal(rig.abdomen, 0.11, -0.54, 0.24, -0.45, false);
        addStarCrystal(rig.abdomen, 0.12, 0, 0.55, -0.65, true);
        addStarCrystal(rig.abdomen, 0.10, 0.52, 0.05, -0.95, true);
        addStarCrystal(rig.abdomen, 0.10, -0.52, 0.05, -0.95, true);

        // 5-3. 목(Neck) & 다중 관절로 바람에 흩날리는 360도 성운 갈기 (Flowing Nebula Mane)
        rig.neck = createJoint('Neck', rig.chest, 0, 0.35, 0.65);
        addBlock(rig.neck, 0.92, 0.92, 0.75, 0, 0.10, 0.25, materials.maneDeep);

        // 갈기 왕관 베이스 피벗
        rig.maneCrown = createJoint('ManeCrown', rig.neck, 0, 0.15, 0.35);

        // 12방향 방사형 3겹 성운 갈기 가닥(Strand Pivot) 생성 -> 각 가닥이 바람에 개별적으로 흩날림!
        const maneAngles = 12;
        for (let i = 0; i < maneAngles; i++) {
          const angle = (i / maneAngles) * Math.PI * 2;
          const cx = Math.cos(angle);
          const cy = Math.sin(angle);

          // 각 갈기 가닥의 회전 피벗(Root)
          const strandPivot = new THREE.Group();
          strandPivot.position.set(cx * 0.52, cy * 0.52, 0);
          rig.maneCrown.add(strandPivot);

          // 바깥쪽 긴 연보라 갈기 깃 (뒤로 길게 뻗어 흩날림)
          addBlock(
            strandPivot,
            0.48, 0.44, 0.98,
            cx * 0.28, cy * 0.30, -0.28,
            materials.maneDeep,
            -cy * 0.32, cx * 0.32, angle * 0.2
          );

          // 중간 핑크-마젠타 성운 갈기 깃
          addBlock(
            strandPivot,
            0.40, 0.36, 0.78,
            cx * 0.20, cy * 0.22, -0.05,
            materials.maneMagenta,
            -cy * 0.24, cx * 0.24, 0
          );

          // 안쪽 스타라이트 크림-라일락 갈기 깃
          addBlock(
            strandPivot,
            0.30, 0.28, 0.54,
            cx * 0.12, cy * 0.14, 0.16,
            materials.maneStarlight,
            -cy * 0.16, cx * 0.16, 0
          );

          // 갈기 끝단에 매달려 함께 흔들리는 별빛 결정
          addStarCrystal(strandPivot, i % 2 === 0 ? 0.11 : 0.09, cx * 0.44, cy * 0.46, -0.58, i % 2 === 0);

          maneStrandPivots.push({
            pivot: strandPivot,
            angle,
            cx,
            cy,
            phase: i * 0.65,
            baseRotX: -cy * 0.15,
            baseRotY: cx * 0.15
          });
        }

        // 등/어깨 뒤쪽으로 길게 흘러내려 출렁이는 상단·측면 장식 갈기 스트리머 (Mane Streamers)
        for (let s = -1; s <= 1; s++) {
          const streamerPivot = new THREE.Group();
          streamerPivot.position.set(s * 0.42, 0.58, -0.15);
          rig.maneCrown.add(streamerPivot);

          addBlock(streamerPivot, 0.36, 0.28, 1.15, 0, 0.08, -0.48, s === 0 ? materials.maneStarlight : materials.maneMagenta, 0.22, 0, 0);
          addStarCrystal(streamerPivot, 0.11, 0, 0.14, -1.02, s !== 0);

          maneStrandPivots.push({
            pivot: streamerPivot,
            angle: Math.PI * 0.5 + s * 0.4,
            cx: s * 0.5,
            cy: 1.0,
            phase: (s + 2) * 1.1,
            baseRotX: 0.12,
            baseRotY: s * 0.08,
            isStreamer: true
          });
        }

        // 앞가슴 아래로 길게 늘어져 흔들리는 성운 가슴 갈기 피벗
        const chestManePivot = new THREE.Group();
        chestManePivot.position.set(0, -0.45, 0.25);
        rig.neck.add(chestManePivot);
        addBlock(chestManePivot, 0.92, 0.72, 0.78, 0, -0.18, 0, materials.maneDeep, 0.25, 0, 0);
        addBlock(chestManePivot, 0.68, 0.58, 0.64, 0, -0.32, 0.16, materials.maneMagenta, 0.35, 0, 0);
        addStarCrystal(chestManePivot, 0.12, 0, -0.55, 0.32, false);
        maneStrandPivots.push({
          pivot: chestManePivot,
          angle: -Math.PI * 0.5,
          cx: 0,
          cy: -1.0,
          phase: 2.5,
          baseRotX: 0.1,
          baseRotY: 0,
          isStreamer: true
        });

        // 5-4. 머리(Head) & 강렬하게 빛나는 초신성 눈빛(Blazing Supernova Eyes)
        rig.head = createJoint('Head', rig.neck, 0, 0.22, 0.62);
        // 두개골
        addBlock(rig.head, 0.86, 0.78, 0.76, 0, 0.04, 0.22, materials.voidBody);
        // 양볼 성운 수염 털
        addBlock(rig.head, 1.04, 0.46, 0.48, 0, -0.06, 0.18, materials.maneMagenta);
        // 이마의 강렬한 다이아몬드 스타 엠블럼
        addStarCrystal(rig.head, 0.16, 0, 0.28, 0.62, true);

        // 윗주둥이(Snout) & 코
        addBlock(rig.head, 0.54, 0.36, 0.52, 0, -0.08, 0.72, materials.nebulaFur);
        addBlock(rig.head, 0.24, 0.16, 0.14, 0, 0.04, 0.98, materials.noseStar);

        // 윗송곳니 (빛나는 별빛 어금니)
        addBlock(rig.head, 0.08, 0.18, 0.08, 0.18, -0.28, 0.86, materials.starGold);
        addBlock(rig.head, 0.08, 0.18, 0.08, -0.18, -0.28, 0.86, materials.starGold);

        // 아래턱(Jaw)
        rig.jaw = createJoint('Jaw', rig.head, 0, -0.24, 0.45);
        addBlock(rig.jaw, 0.44, 0.18, 0.48, 0, -0.04, 0.24, materials.voidBody);
        addBlock(rig.jaw, 0.32, 0.20, 0.35, 0, -0.14, 0.26, materials.maneStarlight); // 턱수염

        // 귀 (양쪽 둥근 사자 귀 + 별빛 귀걸이 결정)
        addBlock(rig.head, 0.24, 0.28, 0.16, 0.38, 0.48, 0.08, materials.voidBody, 0, 0, -0.2);
        addBlock(rig.head, 0.14, 0.18, 0.08, 0.38, 0.48, 0.15, materials.maneStarlight, 0, 0, -0.2);
        addBlock(rig.head, 0.24, 0.28, 0.16, -0.38, 0.48, 0.08, materials.voidBody, 0, 0, 0.2);
        addBlock(rig.head, 0.14, 0.18, 0.08, -0.38, 0.48, 0.15, materials.maneStarlight, 0, 0, 0.2);

        // 눈 (열린 눈: 초고휘도 코어 + 이글거리는 십자 안광 + 안광 트레일 + 전용 PointLight / 감은 눈)
        rig.eyesOpen = new THREE.Group();
        rig.head.add(rig.eyesOpen);

        rig.eyeGlowParts = [];
        [-1, 1].forEach((side) => {
          const ex = side * 0.27;
          const ey = 0.13;
          const ez = 0.60;

          // 1) 눈 코어 (순백색 초고휘도 블록)
          addBlock(rig.eyesOpen, 0.19, 0.13, 0.10, ex, ey, ez, materials.eyeSupernova, 0, 0, side * -0.15);
          // 2) 눈 주변 시안 블루 발광 후광
          const halo = addBlock(rig.eyesOpen, 0.28, 0.22, 0.08, ex, ey, ez - 0.01, materials.eyeAura, 0, 0, side * -0.15);
          // 3) 눈에서 뿜어져 나오는 십자 레이저 플레어 (Starburst Eye Glint)
          const flareH = addBlock(rig.eyesOpen, 0.56, 0.045, 0.04, ex, ey, ez + 0.04, materials.starFlare, 0, 0, side * -0.12);
          const flareV = addBlock(rig.eyesOpen, 0.045, 0.42, 0.04, ex, ey, ez + 0.04, materials.starFlare);
          // 4) 눈꼬리 뒤로 길게 뻗어나가는 신성 안광 에너지 트레일 (Eye Light Trail)
          const trail = addBlock(
            rig.eyesOpen,
            0.09, 0.11, 0.68,
            ex + side * 0.14, ey + 0.10, ez - 0.28,
            materials.eyeAura,
            0.28, side * 0.32, 0
          );

          rig.eyeGlowParts.push({ halo, flareH, flareV, trail, side });
        });

        // 눈에서 직접 뿜어져 나와 얼굴과 갈기를 비추는 강렬한 시안 안광 라이트
        const eyeBeamLight = new FakeLight(0x38bdf8, 3.6, 5.5);
        eyeBeamLight.position.set(0, 0.15, 0.85);
        rig.eyesOpen.add(eyeBeamLight);

        rig.eyesClosed = new THREE.Group();
        rig.head.add(rig.eyesClosed);
        addBlock(rig.eyesClosed, 0.19, 0.04, 0.10, 0.27, 0.11, 0.60, materials.eyeClosed);
        addBlock(rig.eyesClosed, 0.19, 0.04, 0.10, -0.27, 0.11, 0.60, materials.eyeClosed);
        rig.eyesClosed.visible = false;

        // 5-5. 4다리 리깅 (앞다리 2, 뒷다리 2 - 각 3단 관절 + 별빛 발톱 & 다리 별자리)
        function createLionLeg(namePrefix, parent, x, y, z, isFront) {
          const hip = createJoint(`${namePrefix}_Hip`, parent, x, y, z);
          // 허벅지/상완
          const upperLen = isFront ? 0.78 : 0.86;
          const upperW = isFront ? 0.38 : 0.42;
          addBlock(hip, upperW, upperLen, 0.44, 0, -upperLen / 2 + 0.08, 0, materials.voidBody);
          // 어깨/허벅지에 박힌 별빛 결정
          addStarCrystal(hip, 0.11, x > 0 ? upperW * 0.54 : -upperW * 0.54, -0.22, 0.08, isFront);

          // 무릎/팔꿈치
          const knee = createJoint(`${namePrefix}_Knee`, hip, 0, -upperLen + 0.12, 0);
          const lowerLen = 0.72;
          addBlock(knee, 0.30, lowerLen, 0.32, 0, -lowerLen / 2, 0, materials.nebulaFur);
          // 종아리 뒤쪽 흐드러지는 성운 깃털 장식
          addBlock(knee, 0.18, 0.46, 0.24, 0, -0.28, -0.20, materials.maneMagenta, 0.18, 0, 0);
          addStarCrystal(knee, 0.085, x > 0 ? 0.17 : -0.17, -0.35, 0.05, !isFront);

          // 발목/앞발(Paw)
          const paw = createJoint(`${namePrefix}_Paw`, knee, 0, -lowerLen + 0.05, 0);
          addBlock(paw, 0.38, 0.22, 0.46, 0, -0.08, 0.08, materials.voidBody);
          // 빛나는 별빛 발톱 3개
          addBlock(paw, 0.07, 0.10, 0.14, -0.11, -0.13, 0.33, materials.starCyan);
          addBlock(paw, 0.07, 0.10, 0.14, 0.0, -0.13, 0.35, materials.starGold);
          addBlock(paw, 0.07, 0.10, 0.14, 0.11, -0.13, 0.33, materials.starCyan);

          return { hip, knee, paw };
        }

        rig.legFL = createLionLeg('LegFL', rig.chest, 0.52, -0.22, 0.36, true);
        rig.legFR = createLionLeg('LegFR', rig.chest, -0.52, -0.22, 0.36, true);
        rig.legBL = createLionLeg('LegBL', rig.abdomen, 0.46, -0.15, -0.95, false);
        rig.legBR = createLionLeg('LegBR', rig.abdomen, -0.46, -0.15, -0.95, false);

        // 5-6. 4단 관절 혜성 꼬리 (Comet Nebula Tail)
        rig.tail = [];
        let tailParent = rig.abdomen;
        for (let i = 0; i < 4; i++) {
          const tz = i === 0 ? -1.22 : -0.52;
          const ty = i === 0 ? 0.20 : 0;
          const tJoint = createJoint(`Tail_${i + 1}`, tailParent, 0, ty, tz);
          const thick = 0.20 - i * 0.025;
          addBlock(tJoint, thick, thick, 0.56, 0, 0, -0.25, i < 2 ? materials.voidBody : materials.nebulaFur);

          if (i === 3) {
            // 꼬리 끝 풍성한 성운 혜성 붓털(Comet Tuft) + 대형 별 코어
            addBlock(tJoint, 0.42, 0.42, 0.62, 0, 0, -0.62, materials.maneMagenta, 0, 0, Math.PI / 4);
            addBlock(tJoint, 0.28, 0.28, 0.52, 0, 0, -0.82, materials.maneStarlight);
            addStarCrystal(tJoint, 0.16, 0, 0, -1.12, true);
          }
          rig.tail.push(tJoint);
          tailParent = tJoint;
        }

        // 5-7. 우주 별먼지 & 반짝이는 성운 파티클 (Cosmic Starfield Particles)
        const starParticles = [];
        const starParticleGeo = new THREE.OctahedronGeometry(0.085, 0);
        for (let i = 0; i < 60; i++) {
          const mat = i % 3 === 0 ? materials.starGold : (i % 3 === 1 ? materials.starCyan : materials.maneMagenta);
          const p = new THREE.Mesh(starParticleGeo, mat);
          p.position.set(
            (Math.random() - 0.5) * 14,
            0.3 + Math.random() * 5.2,
            (Math.random() - 0.5) * 16
          );

          starParticles.push({
            mesh: p,
            speed: 8 + Math.random() * 10,
            orbitAngle: Math.random() * Math.PI * 2,
            orbitRadius: 1.8 + Math.random() * 4.5,
            baseY: p.position.y
          });
        }

        // --- 6. 애니메이션 상태 및 루프 (은하 질주 / 성운 수면) ---
        let currentAction = 'run';
        let animSpeed = 1.0;
        let animTime = 0;
        const clock = new THREE.Clock();

        function damp(current, target, lambda, dt) {
          return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
        }

        function updateAnimation(dt) {
          animTime += dt * animSpeed;
          const s = 11;

          // 바닥 성운 마법진 회전
          outerRing.rotation.z = animTime * 0.28;
          innerRing.rotation.z = -animTime * 0.45;

          // 몸통과 갈기 곳곳에 박힌 별빛 결정(Star Crystals)의 강렬한 트윙클(Twinkle) 반짝임
          bodyStarMeshes.forEach((star) => {
            const fastTwinkle = Math.pow(0.5 + 0.5 * Math.sin(animTime * 7.5 + star.phase), 2);
            const pulse = star.baseScale * (0.85 + 0.55 * fastTwinkle);
            star.core.scale.setScalar(pulse);
            star.mesh.rotation.y = animTime * 2.4 + star.phase;
            star.mesh.rotation.z = Math.sin(animTime * 3.0 + star.phase) * 0.35;

            // 십자 스타버스트 광채가 반짝반짝 늘었다 줄어듦
            const flareScale = 0.6 + 1.15 * fastTwinkle;
            star.spikes[0].scale.set(flareScale, 1, 1);
            star.spikes[1].scale.set(1, flareScale, 1);
            star.spikes[2].scale.set(1, 1, flareScale);
          });

          // 눈빛(Eye Glow & Cross Flare) 강렬한 맥동
          rig.eyeGlowParts.forEach((eg, idx) => {
            const eyePulse = 1.0 + 0.45 * Math.sin(animTime * 9.0 + idx);
            eg.flareH.scale.x = eyePulse * 1.25;
            eg.flareV.scale.y = eyePulse * 1.25;
            eg.halo.scale.setScalar(0.95 + 0.22 * Math.sin(animTime * 6.0));
            eg.trail.scale.z = currentAction === 'run' ? 1.15 + 0.35 * Math.sin(animTime * 12.0 + idx) : 0.4;
          });

          if (currentAction === 'run') {
            // ==========================================
            // 1) 은하 질주 동작 (Astral Gallop)
            // ==========================================
            rig.eyesOpen.visible = true;
            rig.eyesClosed.visible = false;

            const freq = 9.2;
            const t = animTime * freq;

            // 질주 시 강렬한 성운 광원 및 눈빛 라이트 맥동
            nebulaLight.intensity = 4.6 + Math.sin(t) * 1.4;
            eyeBeamLight.intensity = 4.2 + Math.sin(t * 1.5) * 1.2;

            // 별빛 입자들이 질주하는 사자 뒤로 유성우처럼 빠르게 흐르고 반짝임
            starParticles.forEach((p, idx) => {
              p.mesh.position.z -= p.speed * animSpeed * dt;
              p.mesh.rotation.x += dt * 5;
              p.mesh.rotation.y += dt * 6;
              p.mesh.scale.setScalar(0.75 + 0.65 * Math.abs(Math.sin(animTime * 8 + idx)));
              if (p.mesh.position.z < -8) {
                p.mesh.position.z = 8;
                p.mesh.position.x = (Math.random() - 0.5) * 12;
                p.mesh.position.y = 0.3 + Math.random() * 4.5;
              }
            });

            // 루트 상하 도약(Suspension) 및 앞뒤 추진 반동
            const bounce = Math.sin(t - 0.4) * 0.24;
            const pitch = Math.cos(t - 0.4) * 0.14;
            rig.root.position.x = damp(rig.root.position.x, 0, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 1.88 + bounce, s, dt);
            rig.root.position.z = damp(rig.root.position.z, Math.sin(t) * 0.12, s, dt);

            rig.root.rotation.x = damp(rig.root.rotation.x, pitch, s, dt);
            rig.root.rotation.y = damp(rig.root.rotation.y, 0, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, Math.sin(t * 0.5) * 0.03, s, dt);

            // 고양잇과 특유의 유연한 척추 수축(Gather) & 이완(Extension)
            rig.chest.rotation.x = damp(rig.chest.rotation.x, Math.sin(t) * 0.16, s, dt);
            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, -Math.sin(t - 0.6) * 0.26, s, dt);
            rig.abdomen.rotation.y = damp(rig.abdomen.rotation.y, 0, s, dt);

            // 목과 머리는 질주 중 시선을 정면에 고정하며 카리스마 있게 안정화
            rig.neck.rotation.x = damp(rig.neck.rotation.x, -0.15 - Math.cos(t) * 0.12, s, dt);
            rig.neck.rotation.y = damp(rig.neck.rotation.y, 0, s, dt);
            rig.head.rotation.x = damp(rig.head.rotation.x, 0.12 + Math.cos(t) * 0.08, s, dt);
            rig.head.rotation.z = damp(rig.head.rotation.z, 0, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.18 + Math.max(0, Math.sin(t)) * 0.22, s, dt);

            // ★ 성운 갈기 흩날림 (Billowing Mane Strands): 각 갈기 가닥이 맞바람과 질주 반동에 맞춰 역동적으로 물결침!
            rig.maneCrown.rotation.z = Math.sin(t * 0.5) * 0.08;
            rig.maneCrown.rotation.x = Math.sin(t - 0.8) * 0.10;
            maneStrandPivots.forEach((ms) => {
              const windWave = Math.sin(t * 1.35 - ms.phase);
              const flutter = Math.cos(t * 2.2 - ms.phase * 1.3) * 0.14;
              if (ms.isStreamer) {
                ms.pivot.rotation.x = ms.baseRotX + 0.25 + windWave * 0.32 + flutter;
                ms.pivot.rotation.z = Math.sin(t - ms.phase) * 0.18;
              } else {
                // 방사형 갈기 가닥들이 바깥쪽·뒤쪽으로 확 펼쳐지며 물결치듯 흩날림
                const flareFactor = 0.22 + 0.26 * (0.5 + 0.5 * windWave);
                ms.pivot.rotation.x = ms.baseRotX - ms.cy * flareFactor + flutter * 0.5;
                ms.pivot.rotation.y = ms.baseRotY + ms.cx * flareFactor;
                ms.pivot.rotation.z = Math.sin(t * 1.2 + ms.phase) * 0.12;
              }
            });

            // 비대칭 갤럽(Rotary Gallop) 4다리 리깅 함수
            const animateGallopLeg = (leg, phaseOffset, isFront) => {
              const p = t + phaseOffset;
              const sw = Math.sin(p);
              const lift = Math.max(0, Math.cos(p));

              const hipTarget = sw * (isFront ? 0.68 : 0.72) + (isFront ? -0.05 : 0.10);
              const kneeTarget = isFront
                ? -lift * 0.95 - 0.15
                : lift * 1.05 + 0.22;
              const pawTarget = isFront
                ? lift * 0.65 - sw * 0.25
                : -lift * 0.75 - sw * 0.25;

              leg.hip.rotation.x = damp(leg.hip.rotation.x, hipTarget, s, dt);
              leg.hip.rotation.z = damp(leg.hip.rotation.z, 0, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, kneeTarget, s, dt);
              leg.paw.rotation.x = damp(leg.paw.rotation.x, pawTarget, s, dt);
            };

            animateGallopLeg(rig.legFL, 0.0, true);
            animateGallopLeg(rig.legFR, 0.48, true);
            animateGallopLeg(rig.legBL, Math.PI + 0.15, false);
            animateGallopLeg(rig.legBR, Math.PI + 0.62, false);
