          const outer = createJoint(`${prefix}_Outer`, side * 1.42, 0.06, 0.15, inner);
          addBlock(outer, side * 1.65, 0.18, 0.34, side * 0.82, 0.02, 0.12, materials.obsidianFeather);
          // 날개 꺾임 부위의 흑금 발톱 장식
          addBlock(outer, 0.14, 0.14, 0.45, side * 0.12, 0.08, 0.42, materials.hellGold, -0.25, side * 0.2, 0);

          // 바깥쪽 칼날 장깃 (Primary Flight Feathers - 8가닥 부채꼴 배열)
          for (let j = 0; j < 8; j++) {
            const ratio = j / 7;
            const px = side * (0.22 + j * 0.22);
            const pLen = 1.65 - Math.abs(j - 4) * 0.12;
            const yaw = side * (0.12 + ratio * 0.38);
            addBlock(outer, 0.22, 0.09, pLen, px, -0.02, -0.25 - pLen * 0.32, materials.obsidianFeather, -0.04, yaw, 0);
            addBlock(outer, 0.19, 0.08, pLen * 0.55, px + side * ratio * 0.15, -0.03, -0.35 - pLen * 0.65, materials.abyssPlume, -0.04, yaw, 0);
            const fTip = addBlock(outer, 0.15, 0.07, 0.52, px + side * ratio * 0.25, -0.03, -0.45 - pLen * 0.88, j % 2 === 0 ? materials.crimsonFlame : materials.shadowEdge, -0.04, yaw, 0);
            if (j % 2 === 0) flameTipMeshes.push(fTip);
          }

          return { inner, outer };
        }

        rig.wingL = createDarkWing('Wing_L', 1);
        rig.wingR = createDarkWing('Wing_R', -1);

        // 5-6. 삼족오의 핵심 상징: 세 개의 다리 (Three Taloned Legs: 좌측 다리, 정중앙 제3의 다리, 우측 다리)
        function createCrowLeg(prefix, x, y, z, isCenter = false) {
          const hip = createJoint(`${prefix}_Hip`, x, y, z, rig.abdomen);
          // 허벅지 검은 깃털 바지
          addBlock(hip, 0.34, 0.58, 0.38, 0, -0.22, 0.04, isCenter ? materials.abyssPlume : materials.obsidianFeather, 0.25, 0, 0);
          addBlock(hip, 0.26, 0.24, 0.28, 0, -0.42, -0.05, materials.crimsonFlame, 0.2, 0, 0);

          // 무릎/발목 역관절 (Knee)
          const knee = createJoint(`${prefix}_Knee`, 0, -0.48, 0.10, hip);
          addBlock(knee, 0.16, 0.56, 0.18, 0, -0.26, -0.06, materials.darkBeakTalon, -0.28, 0, 0);
          // 정강이 앞쪽 황금/진홍 비늘 장식
          addBlock(knee, 0.18, 0.38, 0.08, 0, -0.24, 0.04, materials.hellGold, -0.28, 0, 0);

          // 발톱 관절 (Talon - 앞발가락 3개 + 뒷발가락 1개의 맹금류 발톱)
          const talon = createJoint(`${prefix}_Talon`, 0, -0.52, -0.14, knee);
          addBlock(talon, 0.22, 0.12, 0.24, 0, -0.04, 0.04, materials.darkBeakTalon);

          [-0.10, 0, 0.10].forEach((tx, idx) => {
            const yaw = (idx - 1) * -0.25;
            addBlock(talon, 0.07, 0.08, 0.32, tx, -0.06, 0.22, materials.darkBeakTalon, 0.15, yaw, 0);
            // 날카롭게 구부러진 흑금·진홍 발톱 끝
            addBlock(talon, 0.06, 0.12, 0.18, tx * 1.35, -0.11, 0.38, isCenter ? materials.crimsonFlame : materials.hellGold, 0.55, yaw, 0);
          });
          // 뒤쪽 며느리발톱
          addBlock(talon, 0.07, 0.08, 0.24, 0, -0.06, -0.14, materials.darkBeakTalon, -0.2, 0, 0);
          addBlock(talon, 0.06, 0.10, 0.15, 0, -0.10, -0.26, materials.hellGold, -0.55, 0, 0);

          return { hip, knee, talon };
        }

        // 좌측 다리(Leg_L), 정중앙 상징 다리(Leg_Center), 우측 다리(Leg_R) 배치
        rig.legL = createCrowLeg('Leg_L', 0.44, -0.28, -0.18, false);
        rig.legCenter = createCrowLeg('Leg_Center', 0.0, -0.32, 0.12, true); // 삼족오의 정중앙 제3의 다리
        rig.legR = createCrowLeg('Leg_R', -0.44, -0.28, -0.18, false);

        // 5-7. 5가닥 장식 암흑 봉황형 꼬리깃 (5-Plume Abyssal Tail)
        rig.tailBase = createJoint('Tail_Base', 0, 0.05, -0.82, rig.abdomen);
        addBlock(rig.tailBase, 0.68, 0.32, 0.55, 0, 0, -0.22, materials.obsidianFeather, -0.1, 0, 0);

        for (let t = -2; t <= 2; t++) {
          const tPivot = createJoint(`TailPlume_${t + 2}`, t * 0.18, 0.02, -0.38, rig.tailBase);
          const isCenterPlume = t === 0;
          const pLen = isCenterPlume ? 2.35 : (Math.abs(t) === 1 ? 1.95 : 1.55);
          const baseYaw = t * -0.18;
          tPivot.rotation.y = baseYaw;

          addBlock(tPivot, 0.24, 0.08, pLen * 0.65, 0, 0, -pLen * 0.32, materials.obsidianFeather);
          addBlock(tPivot, 0.28, 0.09, pLen * 0.55, 0, 0.01, -pLen * 0.68, materials.abyssPlume);
          // 꼬리 끝의 흑일식 눈 모양 불꽃 문양
          const plumeTip = addBlock(tPivot, 0.34, 0.10, 0.58, 0, 0.02, -pLen * 0.96, materials.crimsonFlame);
          addBlock(tPivot, 0.18, 0.12, 0.28, 0, 0.02, -pLen * 0.96, isCenterPlume ? materials.voidSunCore : materials.hellGold);
          flameTipMeshes.push(plumeTip);

          tailFeatherPivots.push({ pivot: tPivot, baseYaw, index: t });
        }

        // 5-8. 주변을 맴도는 암흑 깃털 & 진홍빛 흑염 불티 파티클 (Dark Embers & Eclipse Feathers)
        const emberParticles = [];
        for (let i = 0; i < 42; i++) {
          const isGold = i % 5 === 0;
          const pMesh = new THREE.Mesh(
            new THREE.OctahedronGeometry(isGold ? 0.09 : 0.075, 0),
            isGold ? materials.hellGold : materials.crimsonFlame
          );
          const angle = (i / 42) * Math.PI * 2;
          const radius = 1.6 + (i % 5) * 0.65;
          pMesh.position.set(
            Math.cos(angle) * radius,
            0.5 + (i % 7) * 0.55,
            (Math.random() - 0.5) * 9
          );

          emberParticles.push({
            mesh: pMesh,
            speed: 8.5 + Math.random() * 6.5,
            orbitAngle: angle,
            orbitRadius: radius,
            baseY: pMesh.position.y
          });
        }

        // --- 6. 애니메이션 상태 및 프레임 업데이트 ---
        let currentAction = 'fly';
        let animSpeed = 1.0;
        let animTime = 0;
        const clock = new THREE.Clock();

        function damp(current, target, lambda, dt) {
          return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
        }

        function updateAnimation(dt) {
          animTime += dt * animSpeed;
          const s = 11.0;

          // 바닥 마법진 & 등 뒤의 흑일식 코로나 링 회전
          sigilGroup.rotation.y += dt * 0.35 * animSpeed;
          rig.coronaRing.rotation.z -= dt * 0.85 * animSpeed;

          // 불꽃 깃털 끝단 맥동
          flameTipMeshes.forEach((m, idx) => {
            const pulse = 0.88 + 0.25 * Math.sin(animTime * 7.5 + idx * 0.9);
            m.scale.set(pulse, 1, pulse);
          });

          // 3개의 마안 십자 안광 회전 및 번쩍임
          eyeGlintGroups.forEach((g, idx) => {
            const eyePulse = 0.85 + 0.45 * Math.abs(Math.sin(animTime * 9.0 + idx));
            g.scale.setScalar(eyePulse);
            g.rotation.z = Math.sin(animTime * 4.0 + idx) * 0.25;
          });

          if (currentAction === 'fly') {
            // ==========================================
            // 1) 암흑 비상 동작 (Abyssal Eclipse Flight)
            // ==========================================
            rig.eyesOpen.visible = true;
            rig.eyesClosed.visible = false;

            const w = 6.2; // 장엄하고 묵직한 날개짓 주기
            const t = animTime * w;

            // 흑염 파티클이 뒤로 맹렬히 흩날림
            emberParticles.forEach((p, idx) => {
              p.mesh.position.z -= p.speed * animSpeed * dt;
              p.mesh.position.y = p.baseY + Math.sin(animTime * 4.5 + idx) * 0.25;
              p.mesh.rotation.x += dt * 5;
              p.mesh.rotation.y += dt * 4;
              if (p.mesh.position.z < -6.5) p.mesh.position.z = 6.5;
            });

            // 날개짓 반동에 따른 몸통 상하 부양 및 피칭
            const lift = Math.sin(t - 0.5) * 0.36;
            const pitch = Math.cos(t - 0.5) * 0.14;

            rig.root.position.x = damp(rig.root.position.x, 0, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 2.75 + lift, s, dt);
            rig.root.position.z = damp(rig.root.position.z, 0, s, dt);
            rig.root.rotation.set(
              damp(rig.root.rotation.x, 0.12 + pitch, s, dt),
              damp(rig.root.rotation.y, 0, s, dt),
              damp(rig.root.rotation.z, 0, s, dt)
            );

            eclipseLight.intensity = 5.2 + Math.sin(t * 2) * 1.4;

            rig.chest.rotation.x = damp(rig.chest.rotation.x, pitch * 0.5, s, dt);
            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, -0.08 - pitch * 0.6, s, dt);

            // 목과 머리: 전방을 응시하며 포효하듯 부리를 살짝 벌림
            rig.neck.rotation.x = damp(rig.neck.rotation.x, 0.15 - pitch * 0.6, s, dt);
            rig.neck.rotation.y = damp(rig.neck.rotation.y, 0, s, dt);
            rig.head.rotation.x = damp(rig.head.rotation.x, -0.10 - pitch * 0.4, s, dt);
            rig.head.rotation.z = damp(rig.head.rotation.z, 0, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.22 + Math.max(0, Math.sin(t * 0.5)) * 0.20, s, dt);

            // 목 갈기 & 머리 볏이 맞바람에 격렬히 물결침
            ruffPivots.forEach((rp) => {
              const flutter = Math.sin(t * 2.2 - rp.phase) * 0.16;
              rp.pivot.rotation.x = damp(rp.pivot.rotation.x, rp.baseRotX - 0.18 + flutter, s, dt);
              rp.pivot.rotation.y = damp(rp.pivot.rotation.y, rp.baseRotY * (1.1 + flutter * 0.3), s, dt);
            });

            // 초대형 2단 칠흑 날개의 위상차 퍼덕임 (Inner -> Outer 지연 꺾임)
            const innerFlap = Math.sin(t) * 0.68 + 0.10;
            const outerFlap = Math.sin(t - 0.65) * 0.78;
            const sweep = Math.cos(t) * 0.16;

            rig.wingL.inner.rotation.z = damp(rig.wingL.inner.rotation.z, innerFlap, s, dt);
            rig.wingL.inner.rotation.y = damp(rig.wingL.inner.rotation.y, sweep, s, dt);
            rig.wingL.inner.rotation.x = damp(rig.wingL.inner.rotation.x, 0.08, s, dt);
            rig.wingL.outer.rotation.z = damp(rig.wingL.outer.rotation.z, outerFlap, s, dt);

            rig.wingR.inner.rotation.z = damp(rig.wingR.inner.rotation.z, -innerFlap, s, dt);
            rig.wingR.inner.rotation.y = damp(rig.wingR.inner.rotation.y, -sweep, s, dt);
            rig.wingR.inner.rotation.x = damp(rig.wingR.inner.rotation.x, 0.08, s, dt);
            rig.wingR.outer.rotation.z = damp(rig.wingR.outer.rotation.z, -outerFlap, s, dt);

            // 삼족(세 개의 다리): 비행 중 매처럼 발톱을 모아 쥐되, 정중앙 다리(Leg_Center)는 앞쪽으로 위엄 있게 내밀어 삼족오 실루엣을 강조
            const legBob = Math.sin(t - 0.8) * 0.14;
            // 좌·우 다리
            [rig.legL, rig.legR].forEach((leg, i) => {
              const sideSign = i === 0 ? 1 : -1;
              leg.hip.rotation.x = damp(leg.hip.rotation.x, -0.55 + legBob, s, dt);
              leg.hip.rotation.z = damp(leg.hip.rotation.z, sideSign * 0.16, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 0.95 + legBob * 0.5, s, dt);
              leg.talon.rotation.x = damp(leg.talon.rotation.x, 0.45, s, dt);
            });
            // 정중앙 제3의 다리 (더욱 뚜렷하게 보이도록 앞·아래로 발톱을 세움)
            rig.legCenter.hip.rotation.x = damp(rig.legCenter.hip.rotation.x, 0.18 + legBob * 1.2, s, dt);
            rig.legCenter.hip.rotation.z = damp(rig.legCenter.hip.rotation.z, 0, s, dt);
            rig.legCenter.knee.rotation.x = damp(rig.legCenter.knee.rotation.x, 0.55 - legBob * 0.6, s, dt);
            rig.legCenter.talon.rotation.x = damp(rig.legCenter.talon.rotation.x, 0.25 + Math.sin(t) * 0.18, s, dt);

            // 5가닥 꼬리깃: 부채꼴로 활짝 펴져 사인파 파동을 그림
            rig.tailBase.rotation.x = damp(rig.tailBase.rotation.x, -0.06 + Math.sin(t - 1.1) * 0.22, s, dt);
            tailFeatherPivots.forEach((tp) => {
              const wave = Math.sin(t - 1.4 - Math.abs(tp.index) * 0.35) * 0.18;
              tp.pivot.rotation.x = damp(tp.pivot.rotation.x, wave, s, dt);
              tp.pivot.rotation.y = damp(tp.pivot.rotation.y, tp.baseYaw * 1.25, s, dt);
            });

          } else if (currentAction === 'sleep') {
            // ==========================================
            // 2) 흑일식 수면 동작 (Dark Eclipse Slumber)
            // ==========================================
            rig.eyesOpen.visible = false;
            rig.eyesClosed.visible = true;

            const breath = Math.sin(animTime * 1.8);
            eclipseLight.intensity = 2.6 + breath * 0.7;

            // 수면 중에는 흑염 입자들이 삼족오 주위를 고요히 공전하며 피어오름
            emberParticles.forEach((p, idx) => {
              const angle = p.orbitAngle + animTime * 0.32 * (idx % 2 === 0 ? 1 : -1);
              p.mesh.position.x = Math.cos(angle) * p.orbitRadius;
              p.mesh.position.z = Math.sin(angle) * p.orbitRadius;
              p.mesh.position.y = 0.3 + ((p.baseY + animTime * 0.3) % 3.2);
              p.mesh.rotation.y += dt * 1.5;
            });

            // 바닥의 흑일식 마법진 위에 낮게 내려앉아 몸을 웅크림
            rig.root.position.x = damp(rig.root.position.x, 0, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 1.05 + breath * 0.035, s, dt);
            rig.root.position.z = damp(rig.root.position.z, 0, s, dt);
            rig.root.rotation.set(
              damp(rig.root.rotation.x, -0.08, s, dt),
              damp(rig.root.rotation.y, 0, s, dt),
              damp(rig.root.rotation.z, 0, s, dt)
            );

            rig.chest.rotation.x = damp(rig.chest.rotation.x, 0.12 + breath * 0.04, s, dt);
            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, -0.18, s, dt);

            // 목을 안쪽으로 깊게 숙여 가슴 깃털에 부리를 묻고 잠듦
            rig.neck.rotation.x = damp(rig.neck.rotation.x, 0.45 + breath * 0.03, s, dt);
            rig.neck.rotation.y = damp(rig.neck.rotation.y, 0.12, s, dt);
            rig.head.rotation.x = damp(rig.head.rotation.x, 0.42 + breath * 0.03, s, dt);
            rig.head.rotation.z = damp(rig.head.rotation.z, -0.10, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.02, s, dt);

            // 갈기 깃털도 차분히 가라앉아 호흡에 맞춰 미세하게 흔들림
            ruffPivots.forEach((rp) => {
              const gentle = Math.sin(animTime * 2.0 - rp.phase) * 0.05;
              rp.pivot.rotation.x = damp(rp.pivot.rotation.x, rp.baseRotX + gentle, s, dt);
              rp.pivot.rotation.y = damp(rp.pivot.rotation.y, rp.baseRotY, s, dt);
            });

            // 양쪽 거대한 칠흑 날개를 몸통 옆과 앞쪽으로 망토처럼 포근히 감싸 접음
            rig.wingL.inner.rotation.z = damp(rig.wingL.inner.rotation.z, -0.52, s, dt);
            rig.wingL.inner.rotation.y = damp(rig.wingL.inner.rotation.y, -0.82, s, dt);
            rig.wingL.inner.rotation.x = damp(rig.wingL.inner.rotation.x, 0.35 + breath * 0.03, s, dt);
            rig.wingL.outer.rotation.z = damp(rig.wingL.outer.rotation.z, -1.15, s, dt);

            rig.wingR.inner.rotation.z = damp(rig.wingR.inner.rotation.z, 0.52, s, dt);
            rig.wingR.inner.rotation.y = damp(rig.wingR.inner.rotation.y, 0.82, s, dt);
            rig.wingR.inner.rotation.x = damp(rig.wingR.inner.rotation.x, 0.35 + breath * 0.03, s, dt);
            rig.wingR.outer.rotation.z = damp(rig.wingR.outer.rotation.z, 1.15, s, dt);

            // 세 다리(삼족)를 접어 마법진 바닥을 디디고 앉음
            [rig.legL, rig.legCenter, rig.legR].forEach((leg, idx) => {
              const isMid = idx === 1;
              leg.hip.rotation.x = damp(leg.hip.rotation.x, isMid ? 0.55 : 0.42, s, dt);
              leg.hip.rotation.z = damp(leg.hip.rotation.z, 0, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, -0.95, s, dt);
              leg.talon.rotation.x = damp(leg.talon.rotation.x, 0.48, s, dt);
            });

            // 5가닥 꼬리깃을 차분하게 모아 바닥에 내려놓음
            rig.tailBase.rotation.x = damp(rig.tailBase.rotation.x, -0.22 + breath * 0.02, s, dt);
            tailFeatherPivots.forEach((tp) => {
              tp.pivot.rotation.x = damp(tp.pivot.rotation.x, 0.08, s, dt);
              tp.pivot.rotation.y = damp(tp.pivot.rotation.y, tp.baseYaw * 0.55, s, dt);
            });
          }

          // 주기적 애니메이션/리깅 상태 디버그 로그 (약 2초 간격)
          if (!updateAnimation._lastLogTime || animTime - updateAnimation._lastLogTime >= 2.0) {
            updateAnimation._lastLogTime = animTime;
        
          }
        }
    return { rig, setAction(a) { currentAction = a; }, getAction() { return currentAction; }, update(dt) { updateAnimation(dt); } };
  },
  // ---------- demon ----------
  demon: function (scene) {
    const lavaLight = makeDummy();
        const materials = {
          crimsonSkin: new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.6, flatShading: true }),     // 붉은 악마 피부
          darkSkin: new THREE.MeshStandardMaterial({ color: 0x450a0a, roughness: 0.7, flatShading: true }),        // 어두운 근육/날개막 외피
          obsidianArmor: new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.35, metalness: 0.4, flatShading: true }), // 흑요석 갑주/뿔
          boneHorn: new THREE.MeshStandardMaterial({ color: 0x27272a, roughness: 0.45, flatShading: true }),       // 거대 뿔 & 발톱
          wingMembrane: new THREE.MeshStandardMaterial({ color: 0x2e0711, roughness: 0.75, flatShading: true }),   // 박쥐형 악마 날개막
          magmaCore: new THREE.MeshStandardMaterial({
            color: 0xffedd5,
            emissive: 0xea580c,
            emissiveIntensity: 1.2,
            roughness: 0.2,
            flatShading: true
          }),
          hellfireBlade: new THREE.MeshStandardMaterial({
            color: 0xfef08a,
            emissive: 0xdc2626,
            emissiveIntensity: 1.0,
            roughness: 0.2,
            flatShading: true
          }),
          eyeGlow: new THREE.MeshStandardMaterial({
            color: 0xfef08a,
            emissive: 0xf59e0b,
            emissiveIntensity: 1.4,
            roughness: 0.1,
            flatShading: true
          }),
          eyeClosed: new THREE.MeshStandardMaterial({ color: 0x180408, roughness: 0.8, flatShading: true }),
          jointMarker: new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, depthTest: false })
        };

        const jointSpheres = [];
        function createJoint(name, parent, x, y, z) {
          const group = new THREE.Group();
          group.name = name;
          group.position.set(x, y, z);
          parent.add(group);

          const marker = new THREE.Mesh(new THREE.SphereGeometry(0.10, 8, 8), materials.jointMarker);
          marker.renderOrder = 999;
          marker.visible = false;
          group.add(marker);
          jointSpheres.push(marker);

          return group;
        }

        function addBox(parent, w, h, d, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
          const geo = new THREE.BoxGeometry(w, h, d);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(x, y, z);
          mesh.rotation.set(rx, ry, rz);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        // --- 4. 블록형 대악마(Demon Lord) 리깅 모델 생성 ---
        function buildBlockyDemonLord() {
          const root = createJoint('Root', scene, 0, 2.8, 0);

          // 골반 (Pelvis)
          const pelvis = createJoint('Pelvis', root, 0, 0, 0);
          addBox(pelvis, 0.95, 0.45, 0.62, materials.obsidianArmor, 0, 0, 0);
          // 골반 벨트 마그마 해골 장식
          addBox(pelvis, 0.30, 0.32, 0.68, materials.magmaCore, 0, 0.02, 0);
          addBox(pelvis, 0.42, 0.55, 0.12, materials.obsidianArmor, 0, -0.35, 0.30); // 전면 허리 갑주(Loincloth)

          // 복부 (Abdomen - 역삼각형 허리)
          const abdomen = createJoint('Abdomen', pelvis, 0, 0.25, 0);
          addBox(abdomen, 1.05, 0.62, 0.66, materials.crimsonSkin, 0, 0.30, 0);
          // 복근 마그마 균열
          addBox(abdomen, 0.65, 0.10, 0.70, materials.magmaCore, 0, 0.22, 0);
          addBox(abdomen, 0.55, 0.10, 0.70, materials.magmaCore, 0, 0.42, 0);
          // 척추 가시
          addBox(abdomen, 0.16, 0.26, 0.24, materials.boneHorn, 0, 0.32, -0.40, -0.3, 0, 0);

          // 흉부 (Chest - 거대한 역삼각형 상체 근육 & 마그마 코어)
          const chest = createJoint('Chest', abdomen, 0, 0.60, 0);
          addBox(chest, 1.55, 0.90, 0.88, materials.crimsonSkin, 0, 0.45, 0);
          // 가슴 흑요석 갑주 플레이트 & 중앙 마그마 코어
          addBox(chest, 1.62, 0.45, 0.92, materials.obsidianArmor, 0, 0.62, 0);
          addBox(chest, 0.50, 0.50, 0.96, materials.magmaCore, 0, 0.50, 0);
          addBox(chest, 0.22, 0.75, 0.95, materials.magmaCore, 0, 0.46, 0);
          // 등 뒤 솟아오른 악마 척추 가시들
          addBox(chest, 0.20, 0.35, 0.30, materials.boneHorn, 0, 0.35, -0.52, -0.35, 0, 0);
          addBox(chest, 0.22, 0.42, 0.32, materials.boneHorn, 0, 0.72, -0.54, -0.45, 0, 0);

          // 목 (Neck) & 머리 (Head)
          const neck = createJoint('Neck', chest, 0, 0.90, 0.08);
          addBox(neck, 0.52, 0.34, 0.50, materials.darkSkin, 0, 0.12, 0);

          const head = createJoint('Head', neck, 0, 0.26, 0.06);
          // 두개골 본체
          addBox(head, 0.68, 0.62, 0.72, materials.crimsonSkin, 0, 0.28, 0);
          // 이마 흑요석 크라운 & 마그마 문양
          addBox(head, 0.72, 0.22, 0.75, materials.obsidianArmor, 0, 0.48, 0.02);
          addBox(head, 0.16, 0.28, 0.78, materials.magmaCore, 0, 0.42, 0.03);
          // 찌푸린 눈썹 뼈
          addBox(head, 0.74, 0.12, 0.20, materials.obsidianArmor, 0, 0.34, 0.34, 0.15, 0, 0);

          // 눈 (열린 불타는 눈 / 감은 눈)
          const eyesOpen = new THREE.Group();
          addBox(eyesOpen, 0.18, 0.10, 0.08, materials.eyeGlow, 0.18, 0.26, 0.36, 0, 0, -0.18);
          addBox(eyesOpen, 0.18, 0.10, 0.08, materials.eyeGlow, -0.18, 0.26, 0.36, 0, 0, 0.18);
          head.add(eyesOpen);

          const eyesClosed = new THREE.Group();
          addBox(eyesClosed, 0.20, 0.04, 0.08, materials.eyeClosed, 0.18, 0.24, 0.36, 0, 0, -0.12);
          addBox(eyesClosed, 0.20, 0.04, 0.08, materials.eyeClosed, -0.18, 0.24, 0.36, 0, 0, 0.12);
          eyesClosed.visible = false;
          head.add(eyesClosed);

          // 아래턱 (Jaw) & 송곳니
          const jaw = createJoint('Jaw', head, 0, 0.06, 0.10);
          addBox(jaw, 0.56, 0.22, 0.56, materials.darkSkin, 0, -0.06, 0.10);
          addBox(jaw, 0.32, 0.16, 0.18, materials.obsidianArmor, 0, -0.14, 0.36); // 턱수염 갑주
          // 날카로운 아래 송곳니 한 쌍
          addBox(jaw, 0.08, 0.16, 0.08, materials.hellfireBlade, 0.18, 0.08, 0.32);
          addBox(jaw, 0.08, 0.16, 0.08, materials.hellfireBlade, -0.18, 0.08, 0.32);

          // 거대한 3단 곡선 대악마 뿔 ( 좌/우 )
          [-1, 1].forEach(side => {
            // 1단: 옆·뒤로 뻗어나감
            addBox(head, 0.26, 0.26, 0.55, materials.obsidianArmor, side * 0.42, 0.48, -0.10, 0.35, side * -0.45, 0);
            // 2단: 위로 휘어짐
            addBox(head, 0.20, 0.58, 0.22, materials.boneHorn, side * 0.65, 0.76, -0.35, 0.25, 0, side * -0.25);
            // 3단: 불타는 마그마 뿔 끝
            addBox(head, 0.14, 0.45, 0.14, materials.magmaCore, side * 0.76, 1.18, -0.25, 0.40, 0, side * -0.10);
          });

          // --- 거대 2단 관절 악마 날개 (Left / Right) ---
          function buildDemonWing(isLeft) {
            const side = isLeft ? 1 : -1;
            const tag = isLeft ? 'L' : 'R';

            const wingInner = createJoint(`WingInner_${tag}`, chest, side * 0.55, 0.72, -0.38);
            // 안쪽 날개 뼈대 (위로 솟구치는 어깨 날개 암)
            addBox(wingInner, side * 1.45, 0.22, 0.24, materials.obsidianArmor, side * 0.72, 0.32, 0, 0, 0, side * 0.42);
            // 날개 꺾임 마디의 거대한 갈고리 발톱
            addBox(wingInner, 0.14, 0.42, 0.14, materials.magmaCore, side * 1.35, 0.72, 0.10, 0.3, 0, side * -0.2);
            // 안쪽 날개막
            addBox(wingInner, side * 1.40, 0.06, 1.35, materials.wingMembrane, side * 0.72, 0.12, -0.58, 0.15, 0, side * 0.35);

            // 바깥쪽 날개 (WingOuter)
            const wingOuter = createJoint(`WingOuter_${tag}`, wingInner, side * 1.38, 0.60, 0);
            // 바깥쪽 주 날개 뼈대
            addBox(wingOuter, side * 2.10, 0.18, 0.18, materials.obsidianArmor, side * 1.05, 0.10, 0, 0, 0, side * 0.10);
            // 날개 끝 마그마 가시
            addBox(wingOuter, 0.35, 0.14, 0.14, materials.magmaCore, side * 2.15, 0.20, 0, 0, 0, side * 0.10);
            // 박쥐 날개 살(Fingers) 3줄
            addBox(wingOuter, 0.10, 0.10, 1.75, materials.boneHorn, side * 0.55, 0.04, -0.82, 0, side * 0.22, 0);
            addBox(wingOuter, 0.10, 0.10, 1.65, materials.boneHorn, side * 1.25, 0.08, -0.78, 0, side * 0.35, 0);
            addBox(wingOuter, 0.08, 0.08, 1.40, materials.boneHorn, side * 1.85, 0.12, -0.62, 0, side * 0.48, 0);
            // 바깥쪽 거대 날개막
            addBox(wingOuter, side * 2.15, 0.05, 1.70, materials.wingMembrane, side * 1.05, 0.04, -0.80, 0, 0, side * 0.08);

            return { inner: wingInner, outer: wingOuter };
          }

          const wingL = buildDemonWing(true);
          const wingR = buildDemonWing(false);

          // --- 양팔 (3단 관절 + 가시 견갑 + 오른손 지옥불 대검) ---
          function buildDemonArm(isLeft) {
            const side = isLeft ? 1 : -1;
            const tag = isLeft ? 'L' : 'R';

            const shoulder = createJoint(`Shoulder_${tag}`, chest, side * 0.92, 0.72, 0);
            // 거대한 흑요석 가시 어깨 갑주 (Pauldron)
            addBox(shoulder, 0.58, 0.46, 0.62, materials.obsidianArmor, side * 0.12, 0.08, 0, 0, 0, side * -0.2);
            addBox(shoulder, 0.16, 0.45, 0.16, materials.magmaCore, side * 0.28, 0.38, 0, 0, 0, side * -0.45);
            // 상완 근육
            addBox(shoulder, 0.42, 0.72, 0.44, materials.crimsonSkin, side * 0.10, -0.36, 0);

            const elbow = createJoint(`Elbow_${tag}`, shoulder, side * 0.12, -0.72, 0);
            // 전완 건틀릿 & 팔꿈치 가시
            addBox(elbow, 0.38, 0.68, 0.40, materials.obsidianArmor, 0, -0.32, 0);
            addBox(elbow, 0.12, 0.32, 0.18, materials.boneHorn, 0, -0.05, -0.26, -0.5, 0, 0);
            addBox(elbow, 0.42, 0.14, 0.44, materials.magmaCore, 0, -0.52, 0);

            const hand = createJoint(`Hand_${tag}`, elbow, 0, -0.68, 0);
            addBox(hand, 0.34, 0.32, 0.36, materials.darkSkin, 0, -0.14, 0);
            // 악마 손톱
            for (let c = -1; c <= 1; c++) {
              addBox(hand, 0.07, 0.18, 0.08, materials.boneHorn, c * 0.09, -0.32, 0.12, 0.3, 0, 0);
            }

            // 오른손(isLeft === false)에 초대형 지옥불 대검(Hellfire Greatsword) 장착
            let sword = null;
            if (!isLeft) {
              sword = createJoint('Hellfire_Sword', hand, 0, -0.18, 0.15);
              // 대검 손잡이(Hilt) & 폼멜
              addBox(sword, 0.12, 0.12, 0.75, materials.obsidianArmor, 0, 0, -0.15);
              addBox(sword, 0.22, 0.22, 0.22, materials.magmaCore, 0, 0, -0.58);
              // 대검 크로스 가드 (뿔 모양)
              addBox(sword, 0.95, 0.24, 0.22, materials.obsidianArmor, 0, 0, 0.25);
              addBox(sword, 0.22, 0.30, 0.26, materials.magmaCore, 0, 0, 0.25);
              // 거대한 흑요석 검신 + 중앙 용암 룬 코어
              addBox(sword, 0.36, 0.10, 2.35, materials.obsidianArmor, 0, 0, 1.48);
              addBox(sword, 0.50, 0.06, 2.20, materials.hellfireBlade, 0, 0, 1.45);
              // 검 끝 포인트 및 톱니 가시
              addBox(sword, 0.32, 0.08, 0.45, materials.hellfireBlade, 0, 0, 2.72);
              addBox(sword, 0.68, 0.07, 0.28, materials.hellfireBlade, 0, 0, 0.75);
              addBox(sword, 0.62, 0.07, 0.28, materials.hellfireBlade, 0, 0, 1.45);
            }

            return { shoulder, elbow, hand, sword };
          }

          const armL = buildDemonArm(true);
          const armR = buildDemonArm(false);

          // --- 역관절(Digitigrade) 악마 다리 (Left / Right) ---
          function buildDemonLeg(isLeft) {
            const side = isLeft ? 1 : -1;
            const tag = isLeft ? 'L' : 'R';

            const hip = createJoint(`Hip_${tag}`, pelvis, side * 0.42, -0.12, 0);
            // 굵은 허벅지 갑주 & 근육
            addBox(hip, 0.48, 0.82, 0.52, materials.obsidianArmor, 0, -0.38, 0.05, -0.2, 0, 0);
            addBox(hip, 0.20, 0.30, 0.18, materials.magmaCore, 0, -0.68, 0.32); // 무릎 마그마 보호대

            const knee = createJoint(`Knee_${tag}`, hip, 0, -0.76, 0.14);
            // 역관절 종아리 (뒤로 꺾이는 구조)
            addBox(knee, 0.36, 0.75, 0.38, materials.crimsonSkin, 0, -0.34, -0.14, 0.42, 0, 0);

            const ankle = createJoint(`Ankle_${tag}`, knee, 0, -0.66, -0.26);
            // 거대한 악마 발굽(Cloven Hoof) & 발톱
            addBox(ankle, 0.42, 0.28, 0.62, materials.obsidianArmor, 0, -0.12, 0.20);
            addBox(ankle, 0.16, 0.22, 0.22, materials.magmaCore, 0.12, -0.15, 0.52);
            addBox(ankle, 0.16, 0.22, 0.22, materials.magmaCore, -0.12, -0.15, 0.52);

            return { hip, knee, ankle };
          }

          const legL = buildDemonLeg(true);
          const legR = buildDemonLeg(false);

          // --- 4단 관절 악마 꼬리 (Spade Tail) ---
          const tails = [];
          let parentTail = pelvis;
          const tailLen = [0.65, 0.65, 0.60, 0.55];
          const tailThick = [0.22, 0.18, 0.15, 0.12];

          for (let i = 0; i < 4; i++) {
            const tz = i === 0 ? -0.28 : -tailLen[i - 1];
            const ty = i === 0 ? -0.05 : 0;
            const tJoint = createJoint(`Tail_${i + 1}`, parentTail, 0, ty, tz);
            const len = tailLen[i];
            const th = tailThick[i];

            addBox(tJoint, th, th, len, materials.crimsonSkin, 0, 0, -len / 2);

            if (i === 3) {
              // 꼬리 끝 삼지창/화살촉(Spade) 마그마 블레이드
              addBox(tJoint, 0.48, 0.08, 0.46, materials.hellfireBlade, 0, 0, -len - 0.16);
              addBox(tJoint, 0.22, 0.10, 0.30, materials.obsidianArmor, 0, 0, -len - 0.32);
            }
            tails.push(tJoint);
            parentTail = tJoint;
          }

          return {
            root, pelvis, abdomen, chest, neck, head, jaw,
            eyesOpen, eyesClosed,
            wingL, wingR,
            armL, armR,
            legL, legR,
            tails
          };
        }

        const rig = buildBlockyDemonLord();

        // --- 5. 지옥불 불티(Ember) & 암흑 맞바람 파티클 및 마법진 연출 ---
        const hellEffectsGroup = new THREE.Group();


        // 바닥 마그마 마법진 링
        const magicRingGeo = new THREE.RingGeometry(2.2, 2.55, 32);
        const magicRing = new THREE.Mesh(magicRingGeo, materials.hellfireBlade);
        magicRing.rotation.x = -Math.PI / 2;
        magicRing.position.y = 0.02;


        const emberParticles = [];
        for (let i = 0; i < 28; i++) {
          const isFlame = i % 2 === 0;
          const mat = isFlame ? materials.hellfireBlade : materials.obsidianArmor;
          const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(isFlame ? 0.14 : 0.20, isFlame ? 0.14 : 0.12, isFlame ? 0.95 : 1.4),
            mat
          );
          mesh.position.set(
            (Math.random() - 0.5) * 10,
            0.5 + Math.random() * 5.2,
            (Math.random() - 0.5) * 15
          );
          hellEffectsGroup.add(mesh);
          emberParticles.push({ mesh, speed: 9 + Math.random() * 8 });
        }

        // --- 6. 애니메이션 상태 및 보간 루프 ---
        let currentAction = 'fly'; // 'fly' | 'sleep'
        let animSpeed = 1.0;
        let animTime = 0;
        const clock = new THREE.Clock();

        function damp(curr, target, lambda, dt) {
          return THREE.MathUtils.lerp(curr, target, 1 - Math.exp(-lambda * dt));
        }

        function updateAnimation(dt) {
          animTime += dt * animSpeed;
          const s = 10.0;

          // 마법진 회전 및 마그마 광원 맥동
          magicRing.rotation.z += dt * 0.6 * animSpeed;
          const pulse = 1.0 + Math.sin(animTime * 4.5) * 0.35;
          materials.magmaCore.emissiveIntensity = pulse;
          materials.hellfireBlade.emissiveIntensity = pulse * 0.95;

          if (currentAction === 'fly') {
            // ==========================================
            // 1) 날아오기 동작 (Hellfire Descent Flight)
            // ==========================================
            rig.eyesOpen.visible = true;
            rig.eyesClosed.visible = false;
            hellEffectsGroup.visible = true;
            lavaLight.intensity = 3.8 + Math.sin(animTime * 6) * 0.8;

            const w = animTime * 5.2; // 거대 날개짓 주기
            const flap = Math.sin(w);
            const flapDelayed = Math.sin(w - 0.65);

            // 지옥불 불티와 암흑 바람이 뒤로 빠르게 스쳐 지나감
            emberParticles.forEach(p => {
              p.mesh.position.z -= p.speed * animSpeed * dt;
              if (p.mesh.position.z < -8) {
                p.mesh.position.z = 8;
                p.mesh.position.x = (Math.random() - 0.5) * 10;
                p.mesh.position.y = 0.5 + Math.random() * 5.2;
              }
            });

            // Root 위치: 날개짓 반동으로 공중에서 묵직하게 부양하며 전진 비행
            rig.root.position.x = damp(rig.root.position.x, Math.sin(w * 0.5) * 0.25, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 2.85 - flap * 0.42, s, dt);
            rig.root.position.z = damp(rig.root.position.z, Math.cos(w * 0.5) * 0.25, s, dt);

            // 상체를 앞으로 살짝 기울여 강림하며 날아오는 포즈
            rig.root.rotation.x = damp(rig.root.rotation.x, 0.32 + Math.cos(w) * 0.12, s, dt);
            rig.root.rotation.y = damp(rig.root.rotation.y, Math.sin(w * 0.5) * 0.08, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, 0, s, dt);

            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, 0.10 + flap * 0.08, s, dt);
            rig.chest.rotation.x = damp(rig.chest.rotation.x, 0.12 - flap * 0.10, s, dt);
            rig.chest.rotation.y = damp(rig.chest.rotation.y, 0, s, dt);

            // 고개는 정면(카메라)을 노려보며 포효하듯 입을 벌림
            rig.neck.rotation.x = damp(rig.neck.rotation.x, -0.22, s, dt);
            rig.head.rotation.x = damp(rig.head.rotation.x, -0.18 - Math.cos(w) * 0.10, s, dt);
            rig.head.rotation.y = damp(rig.head.rotation.y, 0, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.28 + Math.sin(w) * 0.14, s, dt);

            // 거대 2단 악마 날개: 힘찬 상하 날개짓
            rig.wingL.inner.rotation.z = damp(rig.wingL.inner.rotation.z, flap * 0.62, s * 1.4, dt);
            rig.wingL.inner.rotation.y = damp(rig.wingL.inner.rotation.y, -0.15 + flap * 0.18, s * 1.4, dt);
            rig.wingL.outer.rotation.z = damp(rig.wingL.outer.rotation.z, flapDelayed * 0.55, s * 1.4, dt);

            rig.wingR.inner.rotation.z = damp(rig.wingR.inner.rotation.z, -flap * 0.62, s * 1.4, dt);
            rig.wingR.inner.rotation.y = damp(rig.wingR.inner.rotation.y, 0.15 - flap * 0.18, s * 1.4, dt);
            rig.wingR.outer.rotation.z = damp(rig.wingR.outer.rotation.z, -flapDelayed * 0.55, s * 1.4, dt);

            // 양팔: 왼팔은 전투 준비 자세, 오른팔은 지옥불 대검을 옆으로 치켜들고 비행
            rig.armL.shoulder.rotation.x = damp(rig.armL.shoulder.rotation.x, -0.35 + flap * 0.15, s, dt);
            rig.armL.shoulder.rotation.z = damp(rig.armL.shoulder.rotation.z, 0.35, s, dt);
            rig.armL.elbow.rotation.x = damp(rig.armL.elbow.rotation.x, -0.85, s, dt);

            rig.armR.shoulder.rotation.x = damp(rig.armR.shoulder.rotation.x, -0.25 - flap * 0.15, s, dt);
            rig.armR.shoulder.rotation.z = damp(rig.armR.shoulder.rotation.z, -0.42, s, dt);
            rig.armR.elbow.rotation.x = damp(rig.armR.elbow.rotation.x, -0.65, s, dt);
            if (rig.armR.sword) {
              rig.armR.sword.rotation.x = damp(rig.armR.sword.rotation.x, 0.25, s, dt);
              rig.armR.sword.rotation.y = damp(rig.armR.sword.rotation.y, 0, s, dt);
            }

            // 역관절 두 다리: 공중 체공 자세로 무릎을 살짝 굽혀 뒤로 둠
            [rig.legL, rig.legR].forEach((leg, i) => {
              const offset = i === 0 ? 0.12 : -0.12;
              leg.hip.rotation.x = damp(leg.hip.rotation.x, 0.35 + offset + flap * 0.10, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 0.55, s, dt);
              leg.ankle.rotation.x = damp(leg.ankle.rotation.x, 0.35, s, dt);
            });

            // 4단 악마 꼬리: 비행 파동에 맞춘 S자 웨이브
            rig.tails.forEach((t, idx) => {
              const wave = Math.sin(w - (idx + 1) * 0.65);
              t.rotation.x = damp(t.rotation.x, wave * 0.24, s * 1.2, dt);
              t.rotation.y = damp(t.rotation.y, Math.cos(w * 0.5 - idx * 0.5) * 0.18, s * 1.2, dt);
            });

          } else if (currentAction === 'sleep') {
            // ==========================================
            // 2) 수면 동작 (Gargoyle / Demon Lord Slumber)
            // ==========================================
            rig.eyesOpen.visible = false;
            rig.eyesClosed.visible = true;
            hellEffectsGroup.visible = false;

            const breath = Math.sin(animTime * 1.8); // 깊고 묵직한 마왕의 수면 호흡
            lavaLight.intensity = 1.6 + breath * 0.5;

            // 바닥 마법진 위에 무릎을 꿇고 앉아 거대 날개로 몸을 망토처럼 감싼 동면 자세
            rig.root.position.x = damp(rig.root.position.x, 0, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 1.05 + breath * 0.03, s, dt);
            rig.root.position.z = damp(rig.root.position.z, 0, s, dt);

            rig.root.rotation.x = damp(rig.root.rotation.x, 0.18, s, dt);
            rig.root.rotation.y = damp(rig.root.rotation.y, 0, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, 0, s, dt);

            // 상체와 고개를 깊게 숙이고 숨을 쉼
            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, 0.22 + breath * 0.04, s, dt);
            rig.chest.rotation.x = damp(rig.chest.rotation.x, 0.28 + breath * 0.05, s, dt);
            rig.chest.rotation.y = damp(rig.chest.rotation.y, 0, s, dt);

            rig.neck.rotation.x = damp(rig.neck.rotation.x, 0.25, s, dt);
            rig.head.rotation.x = damp(rig.head.rotation.x, 0.35 + breath * 0.04, s, dt);
            rig.head.rotation.y = damp(rig.head.rotation.y, 0, s, dt);
            rig.jaw.rotation.x = damp(rig.jaw.rotation.x, 0.05 + Math.max(0, breath) * 0.06, s, dt);

            // 양쪽 거대 날개를 앞으로 접어 가고일처럼 몸통을 포근하게 감쌈
            rig.wingL.inner.rotation.z = damp(rig.wingL.inner.rotation.z, -0.35, s, dt);
            rig.wingL.inner.rotation.y = damp(rig.wingL.inner.rotation.y, 1.15 + breath * 0.03, s, dt);
            rig.wingL.outer.rotation.z = damp(rig.wingL.outer.rotation.z, -0.85, s, dt);

            rig.wingR.inner.rotation.z = damp(rig.wingR.inner.rotation.z, 0.35, s, dt);
            rig.wingR.inner.rotation.y = damp(rig.wingR.inner.rotation.y, -1.15 - breath * 0.03, s, dt);
            rig.wingR.outer.rotation.z = damp(rig.wingR.outer.rotation.z, 0.85, s, dt);

            // 양팔을 무릎/앞쪽으로 내리고 대검을 바닥에 비스듬히 세워 거치
            rig.armL.shoulder.rotation.x = damp(rig.armL.shoulder.rotation.x, -0.55, s, dt);
            rig.armL.shoulder.rotation.z = damp(rig.armL.shoulder.rotation.z, -0.15, s, dt);
            rig.armL.elbow.rotation.x = damp(rig.armL.elbow.rotation.x, -0.75, s, dt);

            rig.armR.shoulder.rotation.x = damp(rig.armR.shoulder.rotation.x, -0.50, s, dt);
            rig.armR.shoulder.rotation.z = damp(rig.armR.shoulder.rotation.z, 0.15, s, dt);
            rig.armR.elbow.rotation.x = damp(rig.armR.elbow.rotation.x, -0.55, s, dt);
            if (rig.armR.sword) {
              rig.armR.sword.rotation.x = damp(rig.armR.sword.rotation.x, 0.65, s, dt);
              rig.armR.sword.rotation.y = damp(rig.armR.sword.rotation.y, -0.25, s, dt);
            }

            // 두 다리를 접어 바닥에 무릎 꿇고 휴식
            [rig.legL, rig.legR].forEach(leg => {
              leg.hip.rotation.x = damp(leg.hip.rotation.x, -1.25, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 1.85, s, dt);
              leg.ankle.rotation.x = damp(leg.ankle.rotation.x, -0.60, s, dt);
            });

            // 꼬리는 바닥을 따라 몸 옆으로 둥글게 말아 내려놓음
            rig.tails.forEach((t, idx) => {
              const tailWag = idx === 3 ? Math.sin(animTime * 2.0) * 0.08 : 0;
              t.rotation.x = damp(t.rotation.x, idx === 0 ? -0.35 : 0.08, s, dt);
              t.rotation.y = damp(t.rotation.y, 0.42 + tailWag, s, dt);
            });
          }
        }
    return { rig, setAction(a) { currentAction = a; }, getAction() { return currentAction; }, update(dt) { updateAnimation(dt); } };
  },
  // ---------- archangel ----------
  archangel: function (scene) {
    const holyLight = makeDummy();
        const materials = {

          featherLight: new THREE.MeshStandardMaterial({

          }),

            flatShading: true
          }),
          haloGlow: new THREE.MeshStandardMaterial({
            color: 0xfef08a,
            emissive: 0xf59e0b,
            emissiveIntensity: 1.5,

          }),

        };

        const jointSpheres = [];
        function createJoint(name, parent, x, y, z) {
          const group = new THREE.Group();
          group.name = name;
          group.position.set(x, y, z);
          parent.add(group);

          const marker = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), materials.jointMarker);
          marker.renderOrder = 999;
          marker.visible = false;
          group.add(marker);
          jointSpheres.push(marker);

          return group;
        }

        function addBlock(parent, w, h, d, x, y, z, mat, rx = 0, ry = 0, rz = 0) {
          const geo = new THREE.BoxGeometry(w, h, d);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(x, y, z);
          mesh.rotation.set(rx, ry, rz);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        // --- 4. 블록형 로우폴리 대천사(Archangel / Seraphim) 리깅 모델 생성 ---
        function buildBlockyArchangel() {
          const rig = {};

          // Root (전신 위치 및 비행 피벗)
          rig.root = createJoint('Root', scene, 0, 2.9, 0);

          // 골반 (Pelvis) & 허리 성기사 벨트

          addBlock(rig.pelvis, 0.86, 0.34, 0.56, 0, 0, 0, materials.whiteArmor);
          addBlock(rig.pelvis, 0.92, 0.14, 0.62, 0, 0.10, 0, materials.royalGold); // 황금 성기사 벨트
          addBlock(rig.pelvis, 0.24, 0.24, 0.10, 0, 0.10, 0.30, materials.holyCore); // 벨트 중앙 신성 보석

          // 골반 좌우 보호 갑주 (Tassets)
          addBlock(rig.pelvis, 0.20, 0.44, 0.58, 0.48, -0.14, 0, materials.whiteArmor, 0, 0, -0.18);
          addBlock(rig.pelvis, 0.22, 0.10, 0.60, 0.50, -0.32, 0, materials.royalGold, 0, 0, -0.18);
          addBlock(rig.pelvis, 0.20, 0.44, 0.58, -0.48, -0.14, 0, materials.whiteArmor, 0, 0, 0.18);
          addBlock(rig.pelvis, 0.22, 0.10, 0.60, -0.50, -0.32, 0, materials.royalGold, 0, 0, 0.18);

          // 전면/후면 성기사 휘장 (Tabard - 비행 시 바람에 나부낌)
          rig.tabardFront = createJoint('Tabard_Front', rig.pelvis, 0, -0.08, 0.28);
          addBlock(rig.tabardFront, 0.38, 0.85, 0.05, 0, -0.42, 0, materials.royalCloth);

          rig.tabardBack = createJoint('Tabard_Back', rig.pelvis, 0, -0.05, -0.28);
          addBlock(rig.tabardBack, 0.76, 1.15, 0.06, 0, -0.55, 0, materials.royalCloth);

          rig.abdomen = createJoint('Abdomen', rig.pelvis, 0, 0.20, 0);
          addBlock(rig.abdomen, 0.80, 0.48, 0.52, 0, 0.24, 0, materials.silverArmor);
          addBlock(rig.abdomen, 0.62, 0.42, 0.56, 0, 0.24, 0.02, materials.whiteArmor);
          addBlock(rig.abdomen, 0.16, 0.40, 0.58, 0, 0.24, 0.03, materials.royalGold);

          // 흉곽 (Chest - 백금 흉갑 & 천상의 빛 코어)
          rig.chest = createJoint('Chest', rig.abdomen, 0, 0.46, 0);
          addBlock(rig.chest, 1.24, 0.82, 0.72, 0, 0.40, 0, materials.whiteArmor);
          // 황금 성십자가 흉갑 문양 & 빛의 코어
          addBlock(rig.chest, 0.96, 0.16, 0.76, 0, 0.46, 0.02, materials.royalGold);
          addBlock(rig.chest, 0.20, 0.72, 0.76, 0, 0.40, 0.02, materials.royalGold);
          addBlock(rig.chest, 0.30, 0.30, 0.78, 0, 0.46, 0.04, materials.holyCore);
          // 등 뒤 날개 마운트 갑주
          addBlock(rig.chest, 0.72, 0.68, 0.22, 0, 0.42, -0.38, materials.royalGold);

          // 목 (Neck) & 머리 (Head - 성기사 황금 왕관 투구 & 신비로운 후드)
          rig.neck = createJoint('Neck', rig.chest, 0, 0.82, 0.02);
          addBlock(rig.neck, 0.42, 0.24, 0.42, 0, 0.10, 0, materials.silverArmor);

          rig.head = createJoint('Head', rig.neck, 0, 0.20, 0);
          // 후드 외피 (로열 블루 & 순백 & 황금 테두리)
          addBlock(rig.head, 0.68, 0.66, 0.68, 0, 0.32, -0.02, materials.whiteArmor);
          addBlock(rig.head, 0.72, 0.42, 0.64, 0, 0.46, -0.04, materials.royalCloth);
          // 후드 내부 어둠 & 황금 발키리/아크엔젤 마스크
          addBlock(rig.head, 0.54, 0.54, 0.56, 0, 0.30, 0.06, materials.shadowHood);
          addBlock(rig.head, 0.58, 0.22, 0.12, 0, 0.16, 0.32, materials.whiteArmor); // 하관 마스크
          addBlock(rig.head, 0.12, 0.46, 0.14, 0, 0.32, 0.34, materials.royalGold);  // 코 브릿지 황금 장식

          // 대천사 황금 날개형 왕관 (Crown Crest)
          addBlock(rig.head, 0.66, 0.14, 0.66, 0, 0.58, 0.02, materials.royalGold);
          addBlock(rig.head, 0.14, 0.38, 0.12, 0, 0.74, 0.32, materials.royalGold);
          addBlock(rig.head, 0.10, 0.28, 0.10, 0.24, 0.68, 0.28, materials.royalGold, 0, 0, -0.22);
          addBlock(rig.head, 0.10, 0.28, 0.10, -0.24, 0.68, 0.28, materials.royalGold, 0, 0, 0.22);
          // 투구 양옆 작은 날개 장식
          addBlock(rig.head, 0.10, 0.42, 0.28, 0.38, 0.48, -0.06, materials.royalGold, 0.35, 0.15, -0.25);
          addBlock(rig.head, 0.10, 0.42, 0.28, -0.38, 0.48, -0.06, materials.royalGold, 0.35, -0.15, 0.25);

          // 빛나는 천상의 눈 (비행 시 푸른 광채 / 수면 시 감은 눈)
          rig.eyesOpen = new THREE.Group();

          // 광륜 중심 십자 코어
          addBlock(rig.halo, 0.22, 0.08, 0.22, 0, 0, 0, materials.holyCore, 0, Math.PI / 4, 0);

          // --- 세라핌 6장의 거대 천사 날개 (3쌍: 상단 대익 / 중단 익 / 하단 소익) ---
          function buildSeraphWingPair(pairName, yPos, zPos, scale) {
            const pair = {};
            [-1, 1].forEach(side => {
              const s = side;
              const key = s === 1 ? 'L' : 'R';
              // 안쪽 날개 관절 (WingInner)
              const inner = createJoint(`Wing_${pairName}_Inner_${key}`, rig.chest, s * 0.38, yPos, zPos);

              for (let f = 0; f < 5; f++) {
                const fx = s * (0.28 + f * 0.24) * scale;
                const fy = (0.10 + f * 0.08 - 0.35) * scale;

            addBlock(elbow, 0.42, 0.16, 0.42, 0, -0.48, 0, materials.royalGold);

            addBlock(hand, 0.30, 0.28, 0.32, 0, -0.10, 0, materials.royalGold);

            // 오른손(s === -1): 태양의 성검 (Celestial Sunblade) 장착
            let sword = null;
            if (s === -1) {

              // 손잡이 & 포멜

              addBlock(sword, 0.20, 0.20, 0.20, 0, 0, -0.56, materials.royalGold);
              // 천사 날개 모양 크로스 가드 (Winged Crossguard)
              addBlock(sword, 0.96, 0.18, 0.22, 0, 0, 0.32, materials.royalGold);
              addBlock(sword, 0.40, 0.16, 0.32, 0.52, 0, 0.44, materials.royalGold, 0, -0.35, 0);
              addBlock(sword, 0.40, 0.16, 0.32, -0.52, 0, 0.44, materials.royalGold, 0, 0.35, 0);
              addBlock(sword, 0.24, 0.24, 0.24, 0, 0, 0.34, materials.holyCore);
              // 황금 및 빛의 성검 검신 (Blazing Holy Blade)
              addBlock(sword, 0.10, 0.34, 2.30, 0, 0, 1.55, materials.holyBlade);
              addBlock(sword, 0.14, 0.14, 2.10, 0, 0, 1.45, materials.royalGold);
              addBlock(sword, 0.08, 0.22, 0.42, 0, 0, 2.85, materials.holyBlade); // 검 끝
            }

            // 왼손(s === 1): 천상의 이지스 성방패 (Aegis Shield) 장착
            let shield = null;
            if (s === 1) {
              shield = createJoint('Aegis_Shield', hand, 0.22, 0.12, 0.12);
              addBlock(shield, 0.12, 1.25, 0.86, 0, 0, 0, materials.whiteArmor);
              addBlock(shield, 0.15, 1.32, 0.14, 0.02, 0, 0, materials.royalGold); // 방패 수직 십자
              addBlock(shield, 0.15, 0.16, 0.92, 0.02, 0.16, 0, materials.royalGold); // 방패 수평 십자
              addBlock(shield, 0.18, 0.32, 0.32, 0.04, 0.16, 0, materials.holyCore); // 방패 중앙 코어
            }

            return { shoulder, elbow, hand, sword, shield };
          }

          rig.armL = buildArm(1);
          rig.armR = buildArm(-1);

          // --- 두 다리 (백금 각반 Greaves & 황금 무릎 보호대) ---
          function buildLeg(side) {
            const s = side;
            const hip = createJoint(s === 1 ? 'Hip_L' : 'Hip_R', rig.pelvis, s * 0.30, -0.14, 0);
            // 허벅지 판금 갑주
            addBlock(hip, 0.40, 0.78, 0.44, 0, -0.36, 0, materials.silverArmor);
            addBlock(hip, 0.36, 0.68, 0.46, 0, -0.36, 0.03, materials.whiteArmor);

            // 무릎 & 날개형 황금 무릎 보호대
            const knee = createJoint(s === 1 ? 'Knee_L' : 'Knee_R', hip, 0, -0.76, 0);
            addBlock(knee, 0.38, 0.28, 0.20, 0, 0.04, 0.22, materials.royalGold);
            addBlock(knee, 0.36, 0.78, 0.38, 0, -0.38, 0, materials.whiteArmor);
            addBlock(knee, 0.12, 0.70, 0.42, 0, -0.38, 0.03, materials.royalGold);

            // 발목 & 성기사 철제 부츠 (Sabatons)
            const ankle = createJoint(s === 1 ? 'Ankle_L' : 'Ankle_R', knee, 0, -0.76, 0);
            addBlock(ankle, 0.38, 0.22, 0.62, 0, -0.10, 0.12, materials.whiteArmor);
            addBlock(ankle, 0.40, 0.10, 0.66, 0, -0.16, 0.12, materials.royalGold);

            return { hip, knee, ankle };
          }

          rig.legL = buildLeg(1);
          rig.legR = buildLeg(-1);

          return rig;
        }

        const rig = buildBlockyArchangel();

        // --- 5. 신성한 빛의 깃털 파티클 & 성소 마법진 이펙트 ---
        const celestialEffectsGroup = new THREE.Group();

        const holyParticles = [];
        for (let i = 0; i < 32; i++) {
          const isFeather = i % 2 === 0;
          const pMat = isFeather ? materials.haloGlow : materials.holyCore;
          const p = new THREE.Mesh(
            new THREE.BoxGeometry(isFeather ? 0.14 : 0.08, isFeather ? 0.05 : 0.08, isFeather ? 0.42 : 0.65),
            pMat
          );
          p.position.set(
            (Math.random() - 0.5) * 11,
            0.5 + Math.random() * 5.8,
            (Math.random() - 0.5) * 12
          );
          celestialEffectsGroup.add(p);
          holyParticles.push({ mesh: p, speed: 7 + Math.random() * 6 });
        }

        // 바닥 신성 성소 마법진 (Sanctuary Halo Ring)
        const magicRingGeo = new THREE.RingGeometry(2.1, 2.35, 32);
        const magicRingMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide, transparent: true, opacity: 0.45 });
        const magicRing = new THREE.Mesh(magicRingGeo, magicRingMat);
        magicRing.rotation.x = -Math.PI / 2;
        magicRing.position.y = 0.015;


        const innerRingGeo = new THREE.RingGeometry(1.3, 1.42, 8);
        const innerRingMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
        innerRing.rotation.x = -Math.PI / 2;
        innerRing.position.y = 0.018;


        // --- 6. 애니메이션 상태 머신 (날아오기 / 수면 2종) ---
        let currentAction = 'fly';
        let animSpeed = 1.0;
        let animTime = 0;
        const clock = new THREE.Clock();

        function damp(curr, target, lambda, dt) {
          return THREE.MathUtils.lerp(curr, target, 1 - Math.exp(-lambda * dt));
        }

        function updateAnimation(dt) {
          animTime += dt * animSpeed;
          const s = 10;

          // 머리 위 광륜(Halo) 및 바닥 성소 마법진 회전
          rig.halo.rotation.y += dt * (currentAction === 'fly' ? 1.8 : 0.45) * animSpeed;
          magicRing.rotation.z -= dt * 0.35 * animSpeed;
          innerRing.rotation.z += dt * 0.55 * animSpeed;

          if (currentAction === 'fly') {
            // ==========================================
            // 1) 날아오기 동작 (Celestial 6-Winged Descent)
            // ==========================================
            rig.eyesOpen.visible = true;
            rig.eyesClosed.visible = false;
            celestialEffectsGroup.visible = true;

            // 성스러운 빛/깃털 입자 흐름
            holyParticles.forEach(p => {
              p.mesh.position.z -= p.speed * dt * animSpeed;
              p.mesh.position.y -= 1.0 * dt * animSpeed;
              if (p.mesh.position.z < -6) {
                p.mesh.position.z = 6;
                p.mesh.position.y = 0.8 + Math.random() * 5.5;
              }
            });

            const w = animTime * 4.8; // 장엄하고 힘찬 6익 날개짓 주파수
            const flapUpper = Math.sin(w);
            const flapMid   = Math.sin(w - 0.55); // 중단 날개 위상차
            const flapLower = Math.sin(w - 1.10); // 하단 날개 위상차
            const lift = -Math.cos(w);

            holyLight.intensity = 3.0 + Math.sin(w * 2) * 0.8;

            // 전신 고공 부양 및 상하 리프트 반동
            rig.root.position.x = damp(rig.root.position.x, 0, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 3.15 + lift * 0.30, s * 1.3, dt);
            rig.root.position.z = damp(rig.root.position.z, Math.sin(w * 0.5) * 0.16, s, dt);

            // 강림 비행 피치 각도
            rig.root.rotation.x = damp(rig.root.rotation.x, 0.22 + flapUpper * 0.06, s, dt);
            rig.root.rotation.y = damp(rig.root.rotation.y, 0, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, 0, s, dt);

            // 흉곽 확장 및 성기사 휘장(Tabard) 바람에 나부낌
            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, 0.05 + flapUpper * 0.05, s, dt);
            rig.chest.rotation.x = damp(rig.chest.rotation.x, 0.08 - flapUpper * 0.06, s, dt);
            rig.tabardFront.rotation.x = damp(rig.tabardFront.rotation.x, 0.38 + Math.sin(w * 1.5) * 0.14, s, dt);
            rig.tabardBack.rotation.x = damp(rig.tabardBack.rotation.x, 0.45 + Math.cos(w * 1.5) * 0.16, s, dt);

            // 고개는 정면을 당당하게 응시
            rig.neck.rotation.x = damp(rig.neck.rotation.x, -0.14, s, dt);
            rig.head.rotation.x = damp(rig.head.rotation.x, -0.10 - flapUpper * 0.05, s, dt);
            rig.head.rotation.y = damp(rig.head.rotation.y, 0, s, dt);

            // 6장의 세라핌 날개 (상·중·하 3쌍) 위상차 퍼덕임
            const animateWingPair = (pair, fVal, ampZ, baseZ) => {
              const delayed = Math.sin(w - 0.75);
              pair.L.inner.rotation.z = damp(pair.L.inner.rotation.z, baseZ + fVal * ampZ, s * 1.4, dt);
              pair.L.inner.rotation.y = damp(pair.L.inner.rotation.y, -0.15 + fVal * 0.18, s * 1.4, dt);
              pair.L.outer.rotation.z = damp(pair.L.outer.rotation.z, delayed * (ampZ * 0.85), s * 1.4, dt);

              pair.R.inner.rotation.z = damp(pair.R.inner.rotation.z, -baseZ - fVal * ampZ, s * 1.4, dt);
              pair.R.inner.rotation.y = damp(pair.R.inner.rotation.y, 0.15 - fVal * 0.18, s * 1.4, dt);
              pair.R.outer.rotation.z = damp(pair.R.outer.rotation.z, -delayed * (ampZ * 0.85), s * 1.4, dt);
            };

            animateWingPair(rig.wingsUpper, flapUpper, 0.58, 0.18);
            animateWingPair(rig.wingsMid,   flapMid,   0.48, -0.05);
            animateWingPair(rig.wingsLower, flapLower, 0.38, -0.28);

            // 양팔: 왼손은 이지스 방패를 전방 측면에 방어, 오른손은 태양의 성검을 치켜들고 비행
            rig.armL.shoulder.rotation.x = damp(rig.armL.shoulder.rotation.x, -0.45 + flapUpper * 0.10, s, dt);
            rig.armL.shoulder.rotation.z = damp(rig.armL.shoulder.rotation.z, 0.32, s, dt);
            rig.armL.elbow.rotation.x = damp(rig.armL.elbow.rotation.x, -0.75, s, dt);

            rig.armR.shoulder.rotation.x = damp(rig.armR.shoulder.rotation.x, -0.35 - flapUpper * 0.12, s, dt);
            rig.armR.shoulder.rotation.z = damp(rig.armR.shoulder.rotation.z, -0.38, s, dt);
            rig.armR.elbow.rotation.x = damp(rig.armR.elbow.rotation.x, -0.55, s, dt);
            if (rig.armR.sword) {
              rig.armR.sword.rotation.x = damp(rig.armR.sword.rotation.x, 0.18, s, dt);
              rig.armR.sword.rotation.y = damp(rig.armR.sword.rotation.y, 0, s, dt);
            }

            // 두 다리: 대천사 특유의 우아한 공중 부양 포즈 (한쪽 무릎은 살짝 굽히고 다른 쪽은 뻗음)
            rig.legL.hip.rotation.x = damp(rig.legL.hip.rotation.x, -0.25 + flapUpper * 0.08, s, dt);
            rig.legL.knee.rotation.x = damp(rig.legL.knee.rotation.x, 0.65, s, dt);
            rig.legL.ankle.rotation.x = damp(rig.legL.ankle.rotation.x, 0.35, s, dt);

            rig.legR.hip.rotation.x = damp(rig.legR.hip.rotation.x, 0.22 + flapUpper * 0.08, s, dt);
            rig.legR.knee.rotation.x = damp(rig.legR.knee.rotation.x, 0.25, s, dt);
            rig.legR.ankle.rotation.x = damp(rig.legR.ankle.rotation.x, 0.45, s, dt);

          } else if (currentAction === 'sleep') {
            // ==========================================
            // 2) 수면 동작 (Sanctuary Prayer Slumber)
            // ==========================================
            rig.eyesOpen.visible = false;
            rig.eyesClosed.visible = true;
            celestialEffectsGroup.visible = false;

            const breath = Math.sin(animTime * 1.6); // 고요하고 성스러운 수면 호흡
            holyLight.intensity = 1.5 + breath * 0.4;

            // 성소 마법진 위에 무릎을 꿇고 앉아 6장의 날개로 몸을 겹겹이 감싼 채 잠든 자세
            rig.root.position.x = damp(rig.root.position.x, 0, s, dt);
            rig.root.position.y = damp(rig.root.position.y, 1.12 + breath * 0.025, s, dt);
            rig.root.position.z = damp(rig.root.position.z, 0, s, dt);

            rig.root.rotation.x = damp(rig.root.rotation.x, 0.14, s, dt);
            rig.root.rotation.y = damp(rig.root.rotation.y, 0, s, dt);
            rig.root.rotation.z = damp(rig.root.rotation.z, 0, s, dt);

            // 상체와 고개를 숙여 안식 자세
            rig.abdomen.rotation.x = damp(rig.abdomen.rotation.x, 0.16 + breath * 0.03, s, dt);
            rig.chest.rotation.x = damp(rig.chest.rotation.x, 0.22 + breath * 0.04, s, dt);
            rig.tabardFront.rotation.x = damp(rig.tabardFront.rotation.x, -0.25, s, dt);
            rig.tabardBack.rotation.x = damp(rig.tabardBack.rotation.x, 0.12, s, dt);

            rig.neck.rotation.x = damp(rig.neck.rotation.x, 0.22, s, dt);
            rig.head.rotation.x = damp(rig.head.rotation.x, 0.34 + breath * 0.03, s, dt);
            rig.head.rotation.y = damp(rig.head.rotation.y, 0, s, dt);

            // 6장의 천사 날개를 앞으로 겹겹이 접어 성스러운 보호막처럼 몸을 감쌈
            const foldWingPair = (pair, zAngle, yAngle, outerZ) => {
              pair.L.inner.rotation.z = damp(pair.L.inner.rotation.z, zAngle, s, dt);
              pair.L.inner.rotation.y = damp(pair.L.inner.rotation.y, yAngle + breath * 0.025, s, dt);
              pair.L.outer.rotation.z = damp(pair.L.outer.rotation.z, -outerZ, s, dt);

              pair.R.inner.rotation.z = damp(pair.R.inner.rotation.z, -zAngle, s, dt);
              pair.R.inner.rotation.y = damp(pair.R.inner.rotation.y, -yAngle - breath * 0.025, s, dt);
              pair.R.outer.rotation.z = damp(pair.R.outer.rotation.z, outerZ, s, dt);
            };

            foldWingPair(rig.wingsUpper, -0.20, 1.15, 0.78);
            foldWingPair(rig.wingsMid,   -0.35, 1.00, 0.65);
            foldWingPair(rig.wingsLower, -0.50, 0.85, 0.50);

            // 양팔을 가슴 앞으로 모아 성검과 방패를 바닥에 세워 짚고 휴식
            rig.armL.shoulder.rotation.x = damp(rig.armL.shoulder.rotation.x, -0.58, s, dt);
            rig.armL.shoulder.rotation.z = damp(rig.armL.shoulder.rotation.z, -0.18, s, dt);
            rig.armL.elbow.rotation.x = damp(rig.armL.elbow.rotation.x, -0.68, s, dt);

            rig.armR.shoulder.rotation.x = damp(rig.armR.shoulder.rotation.x, -0.52, s, dt);
            rig.armR.shoulder.rotation.z = damp(rig.armR.shoulder.rotation.z, 0.18, s, dt);
            rig.armR.elbow.rotation.x = damp(rig.armR.elbow.rotation.x, -0.58, s, dt);
            if (rig.armR.sword) {
              rig.armR.sword.rotation.x = damp(rig.armR.sword.rotation.x, 0.68, s, dt);
              rig.armR.sword.rotation.y = damp(rig.armR.sword.rotation.y, -0.15, s, dt);
            }

            // 두 다리를 성소 바닥에 가지런히 무릎 꿇음
            [rig.legL, rig.legR].forEach(leg => {
              leg.hip.rotation.x = damp(leg.hip.rotation.x, -1.25, s, dt);
              leg.knee.rotation.x = damp(leg.knee.rotation.x, 1.90, s, dt);
              leg.ankle.rotation.x = damp(leg.ankle.rotation.x, -0.55, s, dt);
            });
          }

          // 주기적 애니메이션/리깅 상태 디버그 로그 (약 2초 간격)
          if (! updateAnimation._lastLogTime || animTime - updateAnimation._lastLogTime >= 2.0) {
            updateAnimation._lastLogTime = animTime;
        
          }
        }
    return { rig, setAction(a) { currentAction = a; }, getAction() { return currentAction; }, update(dt) { updateAnimation(dt); } };
  },
};

const BOX_GEO_CACHE = {};   // 같은 크기 박스는 지오메트리를 공유

// 알 한 개의 움직임: 미세 숨결/공명 요동 + 종류별 장식 움직임
function animateEgg(id, p, baseY, te, dt) {
  const br = Math.sin(te);
  p.eggRoot.position.y = baseY + Math.sin(te * 1.4) * 0.035;
  p.eggRoot.rotation.z = Math.sin(te * 1.2) * 0.04;
  if (id === 'chicken') p.eggComb.rotation.z = Math.sin(te * 1.8) * 0.12;
  else if (id === 'dragon') { p.eWingL.rotation.z = br * 0.15; p.eWingR.rotation.z = -br * 0.15; }
  else if (id === 'eastern') p.orbitPivot.rotation.y += dt * 1.8;
  else if (id === 'lion') p.eggMane.forEach(emp => { emp.pivot.rotation.z = emp.baseZ + Math.sin(te * 1.6 + emp.phase) * 0.12; });
  else if (id === 'samjoko') p.eggHalo.rotation.z -= dt * 1.2;
  else if (id === 'demon') { p.eWingL.rotation.z = br * 0.14; p.eWingR.rotation.z = -br * 0.14; }
  else if (id === 'archangel') p.eggHalo.rotation.y += dt * 1.6;
}

// 움직임 여유(안전 여유 포함). 배치 때 한 줄로 훑은 범위(sweep)는 '숨쉬기 최대 + 후광 최고점'처럼
// 서로 다른 속도의 움직임이 동시에 극값이 되는 조합을 다 못 덮으므로, 무작위 자세 수천 개로 측정한 최대 초과량(+0.03)을 더해 둠.
// ※ 생물/알의 움직임 코드(animateCreature/animateEgg)를 바꾸면 이 값도 다시 측정해야 함.
// 알 배치에 적용하는 비율: 1.0=최악의 조합까지 전부 피함(알이 멀어짐), 낮출수록 알이 생물에 더 붙음(극단 움직임에서 살짝 닿을 수 있음)
const MOTION_MARGIN_SCALE = 0.3;
const CREATURE_MOTION_MARGIN = { chicken: 0.03, tiger: 0.03, dragon: 0.04, eastern: 0.04, lion: 0.23, samjoko: 0.12, demon: 0.03, archangel: 0.09 };   // 원본 수면 동작 기준으로 재측정(+0.03)
const EGG_MOTION_MARGIN_1X   = { chicken: 0.06, tiger: 0.06, dragon: 0.11, eastern: 0.10, lion: 0.12, samjoko: 0.13, demon: 0.16, archangel: 0.17 };   // 알 배율 1 기준(배율을 곱해서 씀)

// 움직임을 한 바퀴 돌려보며 각 부품이 닿을 수 있는 '최대 범위'(AABB 합집합)를 구함
function sweepMeshBoxes(obj, poseFn, steps = 24) {
  let env = null;
  for (let i = 0; i < steps; i++) {
    poseFn(i);
    const bs = collectMeshBoxes(obj);
    if (!env) env = bs;
    else for (let k = 0; k < bs.length; k++) { env[k].min.min(bs[k].min); env[k].max.max(bs[k].max); }
  }
  return env;
}

// 오브젝트 아래 모든 메시의 '실제' 월드 기준 AABB 목록을 구함.
// 부모(root)의 matrixWorld는 아직 갱신 전(항등)이라서, 결과는 root 기준 좌표가 됨.
function collectMeshBoxes(obj) {
  const boxes = [];
  // 부모(구역 root)의 월드 행렬이 이미 갱신돼 있어도(원본 동작 코드가 getWorldPosition을 부르면 갱신됨) '부모 기준 좌표'로 재도록 잠깐 항등으로 둠
  const par = obj.parent, savedParentWorld = par ? par.matrixWorld.clone() : null;
  if (par) par.matrixWorld.identity();
  (function rec(o) {
    if (o.visible === false) return;       // 안 보이는 것(관절 표시 구슬, 안 보이는 눈 등)은 범위 계산에서 제외
    o.updateWorldMatrix(false, false);
    if (o.isMesh && o.geometry) {
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      boxes.push(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
    }
    for (const ch of o.children) rec(ch);
  })(obj);
  if (par) par.matrixWorld.copy(savedParentWorld);
  return boxes;
}
// ================= 알·펫 등급: 일반 < 다크 < 이터널 < 디바인 =================
// 등급은 알 크기와 상관없이 알마다 따로 정해지고(둥지에서 알이 나올 때, 용부터), 부화한 펫에게 그대로 이어짐. 등급이 높을수록 돈을 더 많이 줌.
const GRADE_NAME = ['일반', '다크', '이터널', '디바인'];
const GRADE_MULT = [1, 2, 5, 10];                                    // 펫 수입 배율 (다크 ×2 · 이터널 ×5 · 디바인 ×10)
const GRADE_ODDS = [0.015, 0.004, 0.0008];                           // 알 하나가 다크 1.5% · 이터널 0.4% · 디바인 0.08% (나머지는 일반) → 3분마다 알이 새로 나올 때 다크 평균 10분 · 이터널 36분 · 디바인 3시간에 한 번꼴
const GRADE_ICON = ['', '🌑', '💠', '✨'];
const GRADE_ZONES = ['dragon', 'eastern', 'lion', 'samjoko', 'demon', 'archangel'];      // 용부터 등급 알이 나옴 (닭·호랑이는 항상 일반)
const clampGrade = (g) => Math.max(0, Math.min(3, Math.floor(Number(g)) || 0));
const _urlParam = (k) => { try { const v = new URLSearchParams(location.search).get(k); const n = v == null ? NaN : Number(v); return Number.isInteger(n) && n >= 0 && n <= 3 ? n : null; } catch (_) { return null; } };
const FORCE_GRADE = _urlParam('grade'), FORCE_SIZE = _urlParam('size');      // 주소 끝에 ?grade=3 (모든 알을 그 등급으로) / ?size=3 (모든 알을 그 크기 단계로: 0 작은 · 1 보통 · 2 큰 · 3 아주 큰) → 구경용
function rollGrade() {
  if (FORCE_GRADE !== null) return FORCE_GRADE;
  const r = Math.random(); return r < GRADE_ODDS[2] ? 3 : (r < GRADE_ODDS[2] + GRADE_ODDS[1] ? 2 : (r < GRADE_ODDS[2] + GRADE_ODDS[1] + GRADE_ODDS[0] ? 1 : 0));
}
// 알 크기(그 동물의 '보통 크기'를 1로 본 배수): 작은 알 40% / 보통 58.95% / 큰 알 1% / 아주 큰 알 0.05%

const OLD_EGG_TIER = { chicken: 1.03, tiger: 1.21, dragon: 1.39, eastern: 1.66, lion: 1.80, samjoko: 2.01, demon: 2.17, archangel: 2.37 };      // (버전 1: 알이 지금보다 2배 넘게 컸던 때의 배율)
const EGG_VIS1 = { chicken: 1.51, tiger: 1.49, dragon: 2.17, eastern: 2.05, lion: 2.25, samjoko: 3.01, demon: 2.87, archangel: 2.84 };      // 알(크기 1)의 겉보기 크기(m): 수정·날개 같은 장식 포함 가장 긴 쪽 (모델에서 잰 값)
const EGG_TIER = { chicken: 0.46, tiger: 0.57, dragon: 0.46, eastern: 0.56, lion: 0.58, samjoko: 0.50, demon: 0.59, archangel: 0.67 };
function createCreatureAndEgg(zone, corridorX, wallInnerX = 8.0) {
  const root = new THREE.Group();
  // 벽 안쪽 면 x = zone.side * 8.0 (PATH_WIDTH=16, WALL_THICK=1.2)
  // 생물을 벽에서 충분히 당겨서 가장 큰 생물도 벽과 겹치지 않게 함(±4.5)
  // 알은 생물과 겹치지 않게 복도 중앙 쪽(±1.8)에 둠
  root.position.set(0, 0, zone.zCenter);

  const creatureGroup = new THREE.Group();

  // 생물이 벽을 등지고 길 안쪽(자기 앞의 알 쪽)을 바라보도록 회전
  const inwardYaw = zone.side === -1 ? Math.PI / 2 : -Math.PI / 2;
  creatureGroup.position.set(zone.side * 4.5, 0, 0);
  creatureGroup.rotation.y = inwardYaw;

  root.add(creatureGroup);

  const mat = (color, rough = 0.65, metal = 0.1, emissive = 0x000000, eInt = 0) =>
    new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, emissive, emissiveIntensity: eInt });

  const box = (w, h, d, m, x = 0, y = 0, z = 0) => {
    const gk = w + ',' + h + ',' + d;
    const geo = BOX_GEO_CACHE[gk] || (BOX_GEO_CACHE[gk] = new THREE.BoxGeometry(w, h, d));
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  };
  // 원본 개별 생물 뷰어 파일들과 같은 방식의 관절(Group) + 박스 조립 도우미
  const createJoint = (name, x, y, z, parent) => {
    const g = new THREE.Group();
    g.name = name;
    g.position.set(x, y, z);
    if (parent) parent.add(g);
    return g;
  };
  const addBox = (w, h, d, m, x, y, z, parent) => {
    const mesh = box(w, h, d, m, x, y, z);
    if (parent) parent.add(mesh);
    return mesh;
  };
  // 알(egg) 컬렉션 원본 파일과 같은 인자 순서(parent가 맨 앞)의 박스 도우미 — 알 포팅 전용
  const addBoxE = (parent, w, h, d, m, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) => {
    const mesh = box(w, h, d, m, x, y, z);
    mesh.rotation.set(rx, ry, rz);
    parent.add(mesh);
    return mesh;
  };
  // 계단식 블록형 알 껍데기(모든 등급 알이 공유하는 기본 형태) — 원본 컬렉션 파일에서 그대로 가져옴
  function buildBlockyEggShell(rootGroup, scale, shellMat, accentMat, coreMat) {
    const s = scale;
    addBoxE(rootGroup, 0.85 * s, 0.18 * s, 0.85 * s, shellMat, 0, 0.09 * s, 0);
    addBoxE(rootGroup, 1.15 * s, 0.34 * s, 1.15 * s, shellMat, 0, 0.34 * s, 0);
    addBoxE(rootGroup, 1.28 * s, 0.44 * s, 1.28 * s, shellMat, 0, 0.72 * s, 0);
    if (accentMat) addBoxE(rootGroup, 1.32 * s, 0.12 * s, 1.32 * s, accentMat, 0, 0.72 * s, 0);
    const coreMesh = addBoxE(rootGroup, 0.82 * s, 0.38 * s, 0.82 * s, coreMat, 0, 1.05 * s, 0);
    const topCap = createJoint('TopCap', 0, 1.21 * s, 0, rootGroup);
    addBoxE(topCap, 1.12 * s, 0.30 * s, 1.12 * s, shellMat, 0, 0, 0);
    addBoxE(topCap, 0.86 * s, 0.24 * s, 0.86 * s, shellMat, 0, 0.26 * s, 0);
    addBoxE(topCap, 0.52 * s, 0.16 * s, 0.52 * s, shellMat, 0, 0.44 * s, 0);
    return { topCap, coreMesh };
  }

  // 생물 자리 바닥 성소/둥지 러그
  const sanctumDisc = new THREE.Mesh(
    new THREE.CylinderGeometry(2.3, 2.5, 0.06, 28),
    mat(zone.capColor, 0.5, 0.3, zone.accentColor, 0.25)
  );
  sanctumDisc.position.set(0, 0.03, 0);
  const spot = new THREE.Group();            // 바닥 장식(성소 원반·짚단 둥지): 동물이 일어나 움직여도 원래 자리에 남아야 함
  creatureGroup.add(spot);
  spot.add(sanctumDisc);

  // 알 받침 단상
  // 받침대 없음 (eggPedestal 제거)

  const animParts = { id: zone.id, root, creatureGroup, eggs: [] };
  let eggFactory = null;   // 각 생물 블록이 '알 1개 만드는 함수'를 여기에 넣어줌
  // 원본 동물 뷰어의 리그/동작 코드로 동물을 만들고, 자는 자세로 안착시킴
  const useFactory = () => {
    const F = CREATURE_FACTORIES[zone.id](creatureGroup);
    F.setAction('sleep');
    for (let i = 0; i < 240; i++) F.update(0.05);     // 부드럽게 보간되는 동작이라 자는 자세에 도달할 때까지 미리 돌려둠
    animParts.anim = F;
    animParts.rig = F.rig;
  };

  // -------------------------------------------------------------------------
  // (1) 🐔 Lv.1 닭 (수면 자세) + 닭의 알
  // -------------------------------------------------------------------------
  if (zone.id === 'chicken') {
    // 짚단 둥지 (이 게임에서 추가한 장식 — 원본 닭 뷰어에는 없음)
    const strawM = mat(0xd97706, 0.9);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const st = box(0.35, 0.14, 1.1, strawM, Math.cos(a) * 1.1, 0.08, Math.sin(a) * 1.1);
      st.rotation.y = a;
      spot.add(st);
    }

    useFactory();   // 원본 'chicken' 뷰어의 리그·동작 코드

    // [앞에 놓인 닭의 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('ChickenEgg_Root', 0, 0.30, 0, eggGroup);
    const eShellM = mat(0xfef3c7, 0.65, 0.05);
    const eSpotM = mat(0xd97706, 0.7, 0.05);
    const eCombM = mat(0xef4444, 0.45, 0.1, 0xef4444, 0.2);
    const eCoreM = mat(0xfde047, 0.2, 0.1, 0xfde047, 0.8);
    const eggS = 0.76;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eShellM, null, eCoreM);
    addBoxE(eggRoot, 0.14, 0.14, 0.05, eSpotM, 0.28, 0.55, 0.48);
    addBoxE(eggRoot, 0.10, 0.10, 0.05, eSpotM, -0.32, 0.42, 0.46);
    addBoxE(eggRoot, 0.12, 0.12, 0.05, eSpotM, 0.12, 0.72, -0.49);
    const eggComb = createJoint('ChickenEgg_Comb', 0, 0.48 * eggS, 0, eTopCap);
    addBoxE(eggComb, 0.08, 0.16, 0.26, eCombM, 0, 0.08, 0);
    addBoxE(eggComb, 0.08, 0.22, 0.10, eCombM, 0, 0.12, 0.08);
    addBoxE(eggComb, 0.08, 0.18, 0.10, eCombM, 0, 0.10, -0.05);
    egg.eggRoot = eggRoot;
    egg.eggComb = eggComb;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (2) 🐯 Lv.2 호랑이 (둥글게 말아 자는 자세) + 호랑이 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'tiger') {
    useFactory();   // 원본 'tiger' 뷰어의 리그·동작 코드

    // [앞에 놓인 호랑이 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('TigerEgg_Root', 0, 0.28, 0, eggGroup);
    const eOrangeM = mat(0xf97316, 0.55, 0.1);
    const eCreamM = mat(0xfffbeb, 0.65, 0.05);
    const eStripeM = mat(0x18181b, 0.8, 0.1);
    const eGoldCoreM = mat(0xf59e0b, 0.2, 0.2, 0xf59e0b, 1.1);
    const eggS = 0.84;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eOrangeM, eStripeM, eGoldCoreM);
    addBoxE(eggRoot, 0.68 * eggS, 0.72 * eggS, 0.10 * eggS, eCreamM, 0, 0.56 * eggS, 0.62 * eggS);
    addBoxE(eggRoot, 0.22 * eggS, 0.22 * eggS, 0.06 * eggS, eGoldCoreM, 0, 0.58 * eggS, 0.68 * eggS);
    for (const side of [-1, 1]) {
      addBoxE(eggRoot, 0.10, 0.12, 0.92 * eggS, eStripeM, side * 0.62 * eggS, 0.52 * eggS, 0);
      addBoxE(eggRoot, 0.10, 0.12, 0.82 * eggS, eStripeM, side * 0.60 * eggS, 0.85 * eggS, 0);
    }
    addBoxE(eTopCap, 0.36 * eggS, 0.06 * eggS, 0.06 * eggS, eStripeM, 0, 0.16 * eggS, 0.45 * eggS);
    addBoxE(eTopCap, 0.28 * eggS, 0.06 * eggS, 0.06 * eggS, eStripeM, 0, 0.06 * eggS, 0.55 * eggS);
    addBoxE(eTopCap, 0.07 * eggS, 0.24 * eggS, 0.06 * eggS, eStripeM, 0, 0.08 * eggS, 0.52 * eggS);
    const eEarL = createJoint('TigerEgg_EarL', 0.34 * eggS, 0.28 * eggS, 0, eTopCap);
    addBoxE(eEarL, 0.20, 0.24, 0.12, eStripeM, 0, 0.10, 0, 0, 0, -0.25);
    addBoxE(eEarL, 0.10, 0.10, 0.13, eCreamM, 0, 0.12, 0, 0, 0, -0.25);
    const eEarR = createJoint('TigerEgg_EarR', -0.34 * eggS, 0.28 * eggS, 0, eTopCap);
    addBoxE(eEarR, 0.20, 0.24, 0.12, eStripeM, 0, 0.10, 0, 0, 0, 0.25);
    addBoxE(eEarR, 0.10, 0.10, 0.13, eCreamM, 0, 0.12, 0, 0, 0, 0.25);
    const eTailPivot = createJoint('TigerEgg_Tail', 0, 0.22 * eggS, -0.58 * eggS, eggRoot);
    addBoxE(eTailPivot, 0.14, 0.14, 0.45, eOrangeM, 0.22, 0.05, -0.15, 0.2, 0.6, 0);
    addBoxE(eTailPivot, 0.15, 0.15, 0.14, eStripeM, 0.36, 0.10, -0.22, 0.2, 0.6, 0);
    egg.eggRoot = eggRoot;
    // animParts.earL/earR은 위에서 이미 실제 호랑이 귀로 설정해둠(알의 장식 귀로 덮어쓰지 않음)
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (3) 🐉 Lv.3 서양 드래곤 (날개를 접고 엎드려 자는 자세) + 드래곤 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'dragon') {
    useFactory();   // 원본 'dragon' 뷰어의 리그·동작 코드

    // [앞에 놓인 서양 드래곤 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('DragonEgg_Root', 0, 0.28, 0, eggGroup);
    const eObsidianM = mat(0x181326, 0.4, 0.35);
    const eScaleM = mat(0x2e1065, 0.45, 0.3);
    const eEnderM = mat(0xc084fc, 0.2, 0.1, 0xa855f7, 1.65);
    const eHornM = mat(0xfacc15, 0.3, 0.6, 0xca8a04, 0.25);
    const eggS = 0.90;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eObsidianM, eEnderM, eEnderM);
    addBoxE(eggRoot, 0.34, 0.34, 0.14, eEnderM, 0, 0.68 * eggS, 0.62 * eggS, 0, 0, Math.PI / 4);
    for (let i = 0; i < 4; i++) addBoxE(eggRoot, 0.12, 0.18, 0.22, eHornM, 0, (0.35 + i * 0.22) * eggS, -0.64 * eggS, -0.35, 0, 0);
    for (const side of [-1, 1]) {
      const hGroup = new THREE.Group();
      hGroup.position.set(side * 0.32 * eggS, 0.28 * eggS, -0.05);
      hGroup.rotation.set(-0.45, 0, side * -0.42);
      eTopCap.add(hGroup);
      addBoxE(hGroup, 0.14, 0.38, 0.14, eHornM, 0, 0.16, 0);
      addBoxE(hGroup, 0.10, 0.32, 0.10, eHornM, 0, 0.44, -0.08, -0.35, 0, 0);
    }
    const eWingL = createJoint('DragonEgg_WingL', 0.62 * eggS, 0.78 * eggS, 0, eggRoot);
    const eWingR = createJoint('DragonEgg_WingR', -0.62 * eggS, 0.78 * eggS, 0, eggRoot);
    for (const { w, side } of [{ w: eWingL, side: 1 }, { w: eWingR, side: -1 }]) {
      addBoxE(w, 0.48, 0.10, 0.10, eObsidianM, side * 0.22, 0.12, 0, 0, 0, side * 0.35);
      addBoxE(w, 0.45, 0.48, 0.04, eScaleM, side * 0.26, -0.08, -0.02, 0, 0, side * 0.2);
    }
    egg.eggRoot = eggRoot;
    egg.eWingL = eWingL;
    egg.eWingR = eWingR;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (4) 🐲 Lv.4 동양 청룡 (또아리를 틀고 여의주를 품은 수면 자세) + 청룡 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'eastern') {
    useFactory();   // 원본 'eastern' 뷰어의 리그·동작 코드

    // [앞에 놓인 동양 청룡 알 + 공전 여의주 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('EasternEgg_Root', 0, 0.42, 0, eggGroup);
    const eJadeM = mat(0x0d9488, 0.35, 0.25, 0x0f766e, 0.25);
    const eGoldM = mat(0xfacc15, 0.25, 0.75, 0xf59e0b, 0.4);
    const eCrimsonManeM = mat(0xef4444, 0.4, 0.15, 0xdc2626, 0.6);
    const ePearlM = mat(0x67e8f9, 0.1, 0.1, 0x22d3ee, 2.0);
    const eggS = 0.94;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eJadeM, eGoldM, ePearlM);
    for (let i = 0; i < 4; i++) addBoxE(eggRoot, 0.56 * eggS, 0.15 * eggS, 0.10 * eggS, eGoldM, 0, (0.30 + i * 0.20) * eggS, 0.62 * eggS);
    for (let i = 0; i < 5; i++) addBoxE(eggRoot, 0.14, 0.24, 0.26, eCrimsonManeM, 0, (0.30 + i * 0.22) * eggS, -0.64 * eggS, 0.4, 0, 0);
    for (const side of [-1, 1]) {
      const antler = new THREE.Group();
      antler.position.set(side * 0.28 * eggS, 0.32 * eggS, 0);
      antler.rotation.set(-0.2, 0, side * -0.35);
      eTopCap.add(antler);
      addBoxE(antler, 0.10, 0.48, 0.10, eGoldM, 0, 0.22, 0);
      addBoxE(antler, 0.08, 0.26, 0.08, eGoldM, side * 0.12, 0.30, 0.08, 0.3, 0, side * -0.6);
      addBoxE(antler, 0.08, 0.24, 0.08, eGoldM, side * -0.10, 0.42, -0.06, -0.3, 0, side * 0.5);
    }
    const eWhiskerL = createJoint('EasternEgg_WhiskerL', 0.48 * eggS, 0.76 * eggS, 0.48 * eggS, eggRoot);
    addBoxE(eWhiskerL, 0.46, 0.06, 0.06, eGoldM, 0.22, -0.06, 0.10, 0, -0.3, -0.25);
    const eWhiskerR = createJoint('EasternEgg_WhiskerR', -0.48 * eggS, 0.76 * eggS, 0.48 * eggS, eggRoot);
    addBoxE(eWhiskerR, 0.46, 0.06, 0.06, eGoldM, -0.22, -0.06, 0.10, 0, 0.3, 0.25);
    const orbitPivot = createJoint('EasternEgg_Orbit', 0, 0.75 * eggS, 0, eggRoot);
    const miniPearl = new THREE.Mesh(new THREE.IcosahedronGeometry(0.14, 0), ePearlM);
    miniPearl.position.set(0, 0.15, 0.98 * eggS);
    orbitPivot.add(miniPearl);
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      addBoxE(orbitPivot, 0.24, 0.10, 0.14, eGoldM, Math.cos(ang) * 0.92 * eggS, Math.sin(ang * 2) * 0.12, Math.sin(ang) * 0.92 * eggS, 0, -ang, 0);
    }
    egg.eggRoot = eggRoot;
    egg.orbitPivot = orbitPivot;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (5) 🌌 Lv.5 보라빛 성운 사자 (연한 라벤더·흩날리는 성운 갈기·강렬한 십자 안광/별빛) + 성운 사자 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'lion') {
    useFactory();   // 원본 'lion' 뷰어의 리그·동작 코드

    // [앞에 놓인 성운 사자 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('LionEgg_Root', 0, 0.34, 0, eggGroup);
    const eVioletM = mat(0xa855f7, 0.35, 0.2, 0x6b21a8, 0.55);
    const eLavenderM = mat(0xe9d5ff, 0.25, 0.15, 0xc084fc, 0.85);
    const ePinkManeM = mat(0xf472b6, 0.25, 0.15, 0xdb2777, 0.95);
    const eStarCoreM = mat(0xffffff, 0.05, 0.0, 0xfef08a, 3.0);
    const eCyanBeamM = mat(0x67e8f9, 0.1, 0.1, 0x38bdf8, 2.5);
    const eggS = 1.0;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eVioletM, eLavenderM, eStarCoreM);
    const eEyePivot = createJoint('LionEgg_StarEye', 0, 0.76 * eggS, 0.66 * eggS, eggRoot);
    addBoxE(eEyePivot, 0.26, 0.26, 0.10, eStarCoreM, 0, 0, 0.04, 0, 0, Math.PI / 4);
    addBoxE(eEyePivot, 0.68, 0.05, 0.04, eCyanBeamM, 0, 0, 0.08);
    addBoxE(eEyePivot, 0.05, 0.68, 0.04, eStarCoreM, 0, 0, 0.08);
    const eggMane = [];
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;

    };

  // -------------------------------------------------------------------------

  else if (zone.id === 'samjoko') {

  // -------------------------------------------------------------------------
  // (8) ✨ Lv.8 대천사(세라핌) (6장의 천사 날개를 접고 성검·성방패와 함께 안식하는 자세) + 대천사 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'archangel') {

    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함

    const eWingConfigs = [

        const ws = wc.scale;

        }
