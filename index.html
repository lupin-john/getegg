// ============================================================================
// 2. 생물 + 알 생성 및 수면(Sleep) 애니메이션 팩토리
// - 각 생물은 벽 안쪽에 큼직하게 자리잡아 숨을 쉬며 잠들어 있고(Sleep),
//   그 바로 앞(길 안쪽 방향)에 각 생물 특성에 맞는 디테일한 리깅 알(Egg)이 놓여 있음
// ============================================================================
const BOX_GEO_CACHE = {};   // 같은 크기 박스는 지오메트리를 공유

// 생물 한 마리의 움직임(숨쉬기·꼬리·날개·후광 등). t: 시간 위상, dt: 경과 시간(누적 회전용)
function animateCreature(c, t, dt) {
  const breath = Math.sin(t);
  // 생물 수면 호흡 (가슴과 몸통이 천천히 오르내림)
  if (c.body) {
    c.body.scale.y = 1 + breath * 0.035;
    c.body.scale.x = 1 + breath * 0.02;
  }
  if (c.id === 'chicken') {
    c.headPivot.rotation.x = 0.52 + breath * 0.06;
  } else if (c.id === 'tiger') {
    c.tailPivot.rotation.y = 0.65 + Math.sin(t * 1.2) * 0.1;
    c.earL.rotation.z = Math.sin(t * 1.5) * 0.08;
    c.earR.rotation.z = -Math.sin(t * 1.5) * 0.08;
  } else if (c.id === 'dragon') {
    c.wingL.inner.rotation.z = 0.42 + breath * 0.03;
    c.wingR.inner.rotation.z = -0.42 - breath * 0.03;
  } else if (c.id === 'eastern') {
    c.pearl.rotation.y += dt * 1.5;
    c.pearl.position.y = 0.45 + breath * 0.06;
  } else if (c.id === 'lion') {
    c.manePivots.forEach(mp => {
      mp.pivot.rotation.z = mp.baseZ + Math.sin(t * 1.6 + mp.phase) * 0.12;
    });
    c.stars.forEach((st, sIdx) => {
      st.scale.setScalar(0.8 + Math.abs(Math.sin(t * 2.2 + sIdx)) * 0.45);
    });
  } else if (c.id === 'samjoko') {
    c.haloPivot.rotation.z -= dt * 0.8;
  } else if (c.id === 'demon') {
    c.wingL.inner.rotation.y = 1.15 + breath * 0.03;
    c.wingR.inner.rotation.y = -1.15 - breath * 0.03;
  } else if (c.id === 'archangel') {
    c.haloPivot.rotation.y += dt * 1.2;
    c.seraphWings.forEach(sw => {
      sw.pivot.rotation.z = sw.baseZ + sw.side * breath * 0.06;
    });
  }
}

// 알 한 개의 움직임: 미세 숨결/공명 요동 + 종류별 장식 움직임
function animateEgg(id, p, baseY, te, dt) {
  const br = Math.sin(te);
  p.eggRoot.position.y = baseY + Math.sin(te * 1.4) * 0.035;
  p.eggRoot.rotation.z = Math.sin(te * 1.2) * 0.04;
  if (id === 'chicken') p.eggComb.rotation.z = Math.sin(te * 1.8) * 0.12;
  else if (id === 'dragon') { p.eWingL.rotation.z = br * 0.15; p.eWingR.rotation.z = -br * 0.15; }
  else if (id === 'eastern') p.orbitPivot.rotation.y += dt * 1.8;
  else if (id === 'lion') p.eggMane.forEach(emp => { emp.pivot.rotation.z = emp.baseZ + Math.sin(te * 1.6 + emp.phase) * 0.12; });
  else if (id === 'samjoko') p.eggHalo.rotation.z -= dt * 1.2;
  else if (id === 'demon') { p.eWingL.rotation.z = br * 0.14; p.eWingR.rotation.z = -br * 0.14; }
  else if (id === 'archangel') p.eggHalo.rotation.y += dt * 1.6;
}

// 움직임 여유(안전 여유 포함). 배치 때 한 줄로 훑은 범위(sweep)는 '숨쉬기 최대 + 후광 최고점'처럼
// 서로 다른 속도의 움직임이 동시에 극값이 되는 조합을 다 못 덮으므로, 무작위 자세 수천 개로 측정한 최대 초과량(+0.03)을 더해 둠.
// ※ 생물/알의 움직임 코드(animateCreature/animateEgg)를 바꾸면 이 값도 다시 측정해야 함.
// 알 배치에 적용하는 비율: 1.0=최악의 조합까지 전부 피함(알이 멀어짐), 낮출수록 알이 생물에 더 붙음(극단 움직임에서 살짝 닿을 수 있음)
const MOTION_MARGIN_SCALE = 0.3;
const CREATURE_MOTION_MARGIN = { chicken: 0.03, tiger: 0.06, dragon: 0.03, eastern: 0.04, lion: 0.07, samjoko: 0.18, demon: 0.03, archangel: 0.20 };
const EGG_MOTION_MARGIN_1X   = { chicken: 0.06, tiger: 0.06, dragon: 0.11, eastern: 0.10, lion: 0.12, samjoko: 0.13, demon: 0.16, archangel: 0.17 };   // 알 배율 1 기준(배율을 곱해서 씀)

// 움직임을 한 바퀴 돌려보며 각 부품이 닿을 수 있는 '최대 범위'(AABB 합집합)를 구함
function sweepMeshBoxes(obj, poseFn, steps = 24) {
  let env = null;
  for (let i = 0; i < steps; i++) {
    poseFn(i);
    const bs = collectMeshBoxes(obj);
    if (!env) env = bs;
    else for (let k = 0; k < bs.length; k++) { env[k].min.min(bs[k].min); env[k].max.max(bs[k].max); }
  }
  return env;
}

// 오브젝트 아래 모든 메시의 '실제' 월드 기준 AABB 목록을 구함.
// 부모(root)의 matrixWorld는 아직 갱신 전(항등)이라서, 결과는 root 기준 좌표가 됨.
function collectMeshBoxes(obj) {
  const boxes = [];
  (function rec(o) {
    o.updateWorldMatrix(false, false);
    if (o.isMesh && o.geometry) {
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      boxes.push(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
    }
    for (const ch of o.children) rec(ch);
  })(obj);
  return boxes;
}
function createCreatureAndEgg(zone, corridorX, wallInnerX = 8.0) {
  const root = new THREE.Group();
  // 벽 안쪽 면 x = zone.side * 8.0 (PATH_WIDTH=16, WALL_THICK=1.2)
  // 생물을 벽에서 충분히 당겨서 가장 큰 생물도 벽과 겹치지 않게 함(±4.5)
  // 알은 생물과 겹치지 않게 복도 중앙 쪽(±1.8)에 둠
  root.position.set(0, 0, zone.zCenter);

  const creatureGroup = new THREE.Group();

  // 생물이 벽을 등지고 길 안쪽(자기 앞의 알 쪽)을 바라보도록 회전
  const inwardYaw = zone.side === -1 ? Math.PI / 2 : -Math.PI / 2;
  creatureGroup.position.set(zone.side * 4.5, 0, 0);
  creatureGroup.rotation.y = inwardYaw;

  root.add(creatureGroup);

  const mat = (color, rough = 0.65, metal = 0.1, emissive = 0x000000, eInt = 0) =>
    new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, emissive, emissiveIntensity: eInt });

  const box = (w, h, d, m, x = 0, y = 0, z = 0) => {
    const gk = w + ',' + h + ',' + d;
    const geo = BOX_GEO_CACHE[gk] || (BOX_GEO_CACHE[gk] = new THREE.BoxGeometry(w, h, d));
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  };
  // 원본 개별 생물 뷰어 파일들과 같은 방식의 관절(Group) + 박스 조립 도우미
  const createJoint = (name, x, y, z, parent) => {
    const g = new THREE.Group();
    g.name = name;
    g.position.set(x, y, z);
    if (parent) parent.add(g);
    return g;
  };
  const addBox = (w, h, d, m, x, y, z, parent) => {
    const mesh = box(w, h, d, m, x, y, z);
    if (parent) parent.add(mesh);
    return mesh;
  };
  // 알(egg) 컬렉션 원본 파일과 같은 인자 순서(parent가 맨 앞)의 박스 도우미 — 알 포팅 전용
  const addBoxE = (parent, w, h, d, m, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) => {
    const mesh = box(w, h, d, m, x, y, z);
    mesh.rotation.set(rx, ry, rz);
    parent.add(mesh);
    return mesh;
  };
  // 계단식 블록형 알 껍데기(모든 등급 알이 공유하는 기본 형태) — 원본 컬렉션 파일에서 그대로 가져옴
  function buildBlockyEggShell(rootGroup, scale, shellMat, accentMat, coreMat) {
    const s = scale;
    addBoxE(rootGroup, 0.85 * s, 0.18 * s, 0.85 * s, shellMat, 0, 0.09 * s, 0);
    addBoxE(rootGroup, 1.15 * s, 0.34 * s, 1.15 * s, shellMat, 0, 0.34 * s, 0);
    addBoxE(rootGroup, 1.28 * s, 0.44 * s, 1.28 * s, shellMat, 0, 0.72 * s, 0);
    if (accentMat) addBoxE(rootGroup, 1.32 * s, 0.12 * s, 1.32 * s, accentMat, 0, 0.72 * s, 0);
    const coreMesh = addBoxE(rootGroup, 0.82 * s, 0.38 * s, 0.82 * s, coreMat, 0, 1.05 * s, 0);
    const topCap = createJoint('TopCap', 0, 1.21 * s, 0, rootGroup);
    addBoxE(topCap, 1.12 * s, 0.30 * s, 1.12 * s, shellMat, 0, 0, 0);
    addBoxE(topCap, 0.86 * s, 0.24 * s, 0.86 * s, shellMat, 0, 0.26 * s, 0);
    addBoxE(topCap, 0.52 * s, 0.16 * s, 0.52 * s, shellMat, 0, 0.44 * s, 0);
    return { topCap, coreMesh };
  }

  // 생물 자리 바닥 성소/둥지 러그
  const sanctumDisc = new THREE.Mesh(
    new THREE.CylinderGeometry(2.3, 2.5, 0.06, 28),
    mat(zone.capColor, 0.5, 0.3, zone.accentColor, 0.25)
  );
  sanctumDisc.position.set(0, 0.03, 0);
  creatureGroup.add(sanctumDisc);

  // 알 받침 단상
  // 받침대 없음 (eggPedestal 제거)

  const animParts = { id: zone.id, root, creatureGroup, eggs: [] };
  let eggFactory = null;   // 각 생물 블록이 '알 1개 만드는 함수'를 여기에 넣어줌

  // -------------------------------------------------------------------------
  // (1) 🐔 Lv.1 닭 (수면 자세) + 닭의 알
  // -------------------------------------------------------------------------
  if (zone.id === 'chicken') {
    const whiteM = mat(0xf8fafc, 0.75);
    const combM = mat(0xef4444, 0.5, 0.05, 0xef4444, 0.2);
    const beakM = mat(0xf59e0b, 0.5);
    const strawM = mat(0xd97706, 0.9);
    const eyeClosedM = mat(0x1e293b, 0.9);

    // 짚단 둥지
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const st = box(0.35, 0.14, 1.1, strawM, Math.cos(a) * 1.1, 0.08, Math.sin(a) * 1.1);
      st.rotation.y = a;
      creatureGroup.add(st);
    }

    // ---- 원본 "블록형 로우폴리 닭" 뷰어의 리깅을 그대로 가져와 조립 ----
    const wingFeatherM = mat(0xe2e8f0, 0.65);
    const legM = mat(0xfbbf24, 0.5);

    const root = createJoint('Root', 0, 0.85, 0, creatureGroup);
    const body = createJoint('Body', 0, 0, 0, root);
    addBox(0.68, 0.58, 0.84, whiteM, 0, 0.08, 0, body);
    addBox(0.60, 0.46, 0.22, whiteM, 0, 0.08, 0.46, body); // 앞가슴 돌출

    const neck = createJoint('Neck', 0, 0.28, 0.34, body);
    addBox(0.36, 0.36, 0.34, whiteM, 0, 0.14, 0.02, neck);

    const headPivot = createJoint('Head', 0, 0.30, 0.04, neck);
    addBox(0.42, 0.44, 0.44, whiteM, 0, 0.18, 0.02, headPivot);

    const comb = createJoint('Comb', 0, 0.40, 0.02, headPivot);
    addBox(0.10, 0.16, 0.38, combM, 0, 0.07, 0.02, comb);
    addBox(0.10, 0.10, 0.24, combM, 0, 0.16, -0.01, comb);
    addBox(0.10, 0.08, 0.12, combM, 0, 0.22, -0.03, comb);

    addBox(0.24, 0.11, 0.26, beakM, 0, 0.19, 0.34, headPivot);
    const lowerBeak = createJoint('LowerBeak', 0, 0.13, 0.22, headPivot);
    addBox(0.20, 0.07, 0.22, beakM, 0, -0.02, 0.10, lowerBeak);

    const wattle = createJoint('Wattle', 0, 0.10, 0.27, headPivot);
    addBox(0.12, 0.18, 0.14, combM, 0, -0.08, 0.0, wattle);

    // 눈: 자고 있으니 감은 눈만 보이게
    addBox(0.05, 0.03, 0.11, eyeClosedM, 0.215, 0.24, 0.10, headPivot);
    addBox(0.05, 0.03, 0.11, eyeClosedM, -0.215, 0.24, 0.10, headPivot);

    const wingL = createJoint('Wing_L', 0.35, 0.28, 0.05, body);
    addBox(0.11, 0.38, 0.56, wingFeatherM, 0.05, -0.16, -0.06, wingL);
    addBox(0.09, 0.24, 0.20, wingFeatherM, 0.05, -0.14, -0.38, wingL);

    const wingR = createJoint('Wing_R', -0.35, 0.28, 0.05, body);
    addBox(0.11, 0.38, 0.56, wingFeatherM, -0.05, -0.16, -0.06, wingR);
    addBox(0.09, 0.24, 0.20, wingFeatherM, -0.05, -0.14, -0.38, wingR);

    const tail = createJoint('Tail', 0, 0.24, -0.40, body);
    const tailMid = addBox(0.18, 0.42, 0.22, whiteM, 0, 0.16, -0.10, tail); tailMid.rotation.x = -0.45;
    const tailTip = addBox(0.14, 0.34, 0.18, wingFeatherM, 0, 0.26, -0.24, tail); tailTip.rotation.x = -0.85;
    const tailSideL = addBox(0.12, 0.30, 0.18, wingFeatherM, 0.11, 0.12, -0.12, tail); tailSideL.rotation.set(-0.5, 0.2, 0.15);
    const tailSideR = addBox(0.12, 0.30, 0.18, wingFeatherM, -0.11, 0.12, -0.12, tail); tailSideR.rotation.set(-0.5, -0.2, -0.15);

    function createChickenLeg(xOffset) {
      const hip = createJoint('Hip', xOffset, -0.18, 0.02, body);
      addBox(0.18, 0.22, 0.20, whiteM, 0, -0.08, 0, hip);
      addBox(0.08, 0.36, 0.08, legM, 0, -0.32, 0, hip);
      const ankle = createJoint('Ankle', 0, -0.52, 0, hip);
      addBox(0.07, 0.18, 0.07, legM, 0, -0.08, 0, ankle);
      const foot = createJoint('Foot', 0, -0.16, 0, ankle);
      addBox(0.18, 0.05, 0.16, legM, 0, 0.025, 0.04, foot);
      addBox(0.06, 0.05, 0.26, legM, 0, 0.025, 0.16, foot);
      const toeL = addBox(0.05, 0.05, 0.22, legM, 0.09, 0.025, 0.14, foot); toeL.rotation.y = -0.32;
      const toeR = addBox(0.05, 0.05, 0.22, legM, -0.09, 0.025, 0.14, foot); toeR.rotation.y = 0.32;
      addBox(0.05, 0.04, 0.12, legM, 0, 0.02, -0.06, foot);
      // 자는 자세: 다리를 몸통 아래로 완전히 접어 넣음
      hip.rotation.x = -1.25; ankle.rotation.x = 2.15; foot.rotation.x = -0.90;
      return { hip, ankle, foot };
    }
    createChickenLeg(0.18);
    createChickenLeg(-0.18);

    // ---- 수면 자세(원본의 'sleep' 상태 값을 그대로 고정 자세로 적용) ----
    root.position.y = 0.34; root.rotation.z = 0.04;
    body.rotation.x = 0.06;
    neck.rotation.x = -0.38;
    headPivot.rotation.x = 0.52; headPivot.rotation.y = 0.25; headPivot.rotation.z = 0.12;
    lowerBeak.rotation.x = 0.02;
    comb.rotation.z = 0.05;
    wingL.rotation.z = 0.06; wingL.rotation.x = 0.08;
    wingR.rotation.z = -0.06; wingR.rotation.x = 0.08;
    tail.rotation.x = -0.25;

    animParts.body = body;
    animParts.headPivot = headPivot;
    animParts.wingL = wingL;
    animParts.wingR = wingR;

    // [앞에 놓인 닭의 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('ChickenEgg_Root', 0, 0.30, 0, eggGroup);
    const eShellM = mat(0xfef3c7, 0.65, 0.05);
    const eSpotM = mat(0xd97706, 0.7, 0.05);
    const eCombM = mat(0xef4444, 0.45, 0.1, 0xef4444, 0.2);
    const eCoreM = mat(0xfde047, 0.2, 0.1, 0xfde047, 0.8);
    const eggS = 0.76;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eShellM, null, eCoreM);
    addBoxE(eggRoot, 0.14, 0.14, 0.05, eSpotM, 0.28, 0.55, 0.48);
    addBoxE(eggRoot, 0.10, 0.10, 0.05, eSpotM, -0.32, 0.42, 0.46);
    addBoxE(eggRoot, 0.12, 0.12, 0.05, eSpotM, 0.12, 0.72, -0.49);
    const eggComb = createJoint('ChickenEgg_Comb', 0, 0.48 * eggS, 0, eTopCap);
    addBoxE(eggComb, 0.08, 0.16, 0.26, eCombM, 0, 0.08, 0);
    addBoxE(eggComb, 0.08, 0.22, 0.10, eCombM, 0, 0.12, 0.08);
    addBoxE(eggComb, 0.08, 0.18, 0.10, eCombM, 0, 0.10, -0.05);
    egg.eggRoot = eggRoot;
    egg.eggComb = eggComb;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (2) 🐯 Lv.2 호랑이 (둥글게 말아 자는 자세) + 호랑이 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'tiger') {
    // ---- 원본 "로우폴리 호랑이" 뷰어(단순 블록 스타일 버전)의 리깅을 그대로 가져와 조립 ----
    // 알(egg)은 기존 스타일을 유지하므로, 알에서 쓰는 이름(orangeM/creamM/stripeM)은 그대로 둠
    const orangeM = mat(0xf97316, 0.65);
    const creamM = mat(0xf8fafc, 0.7);
    const stripeM = mat(0x18181b, 0.8);
    const noseM = mat(0xf472b6, 0.5);
    const eyeYellowM = mat(0xfacc15, 0.3, 0, 0x422006, 0.3);

    const root = createJoint('Root', 0, 1.38, 0, creatureGroup);

    const body = createJoint('Chest', 0, 0, 0.25, root); // update()가 쓰는 이름(body)
    body.add(box(0.95, 0.88, 1.15, orangeM, 0, 0, 0.25));
    body.add(box(0.78, 0.65, 0.9, creamM, 0, -0.16, 0.32));
    [-0.05, 0.25, 0.55].forEach((zPos, idx) => {
      const sH = idx === 1 ? 0.65 : 0.52;
      body.add(box(0.98, sH, 0.1, stripeM, 0, 0.12, zPos));
    });

    const abdomen = createJoint('Abdomen', 0, 0.02, -0.32, body);
    abdomen.add(box(0.84, 0.76, 1.05, orangeM, 0, -0.02, -0.52));
    abdomen.add(box(0.68, 0.2, 0.92, creamM, 0, -0.34, -0.52));
    [-0.25, -0.55, -0.85].forEach((zPos) => {
      abdomen.add(box(0.87, 0.55, 0.1, stripeM, 0, 0.1, zPos));
    });

    const neck = createJoint('Neck', 0, 0.28, 0.78, body);
    const neckMesh = box(0.62, 0.6, 0.45, orangeM, 0, 0.12, 0.12);
    neckMesh.rotation.x = -0.3;
    neck.add(neckMesh);

    const headPivot = createJoint('Head', 0, 0.28, 0.26, neck);
    headPivot.add(box(0.78, 0.68, 0.68, orangeM, 0, 0, 0.2));
    headPivot.add(box(0.14, 0.42, 0.45, creamM, 0.38, -0.08, 0.18));
    headPivot.add(box(0.14, 0.42, 0.45, creamM, -0.38, -0.08, 0.18));
    headPivot.add(box(0.1, 0.26, 0.7, stripeM, 0, 0.24, 0.21));
    headPivot.add(box(0.24, 0.08, 0.7, stripeM, 0.22, 0.26, 0.21));
    headPivot.add(box(0.24, 0.08, 0.7, stripeM, -0.22, 0.26, 0.21));
    headPivot.add(box(0.46, 0.26, 0.38, creamM, 0, -0.08, 0.62));
    headPivot.add(box(0.32, 0.16, 0.38, orangeM, 0, 0.06, 0.61));
    headPivot.add(box(0.18, 0.12, 0.1, noseM, 0, 0.04, 0.82));

    const jaw = createJoint('Jaw', 0, -0.22, 0.42, headPivot);
    jaw.add(box(0.36, 0.12, 0.34, creamM, 0, -0.02, 0.15));

    const earL = createJoint('EarL', 0.3, 0.36, 0.02, headPivot);
    earL.add(box(0.18, 0.22, 0.12, orangeM, 0, 0.08, 0));
    earL.add(box(0.1, 0.1, 0.13, creamM, 0, 0.08, -0.01));
    const earR = createJoint('EarR', -0.3, 0.36, 0.02, headPivot);
    earR.add(box(0.18, 0.22, 0.12, orangeM, 0, 0.08, 0));
    earR.add(box(0.1, 0.1, 0.13, creamM, 0, 0.08, -0.01));

    const eyesClosed = new THREE.Group();
    eyesClosed.add(box(0.16, 0.04, 0.07, stripeM, 0.2, 0.08, 0.53));
    eyesClosed.add(box(0.16, 0.04, 0.07, stripeM, -0.2, 0.08, 0.53));
    headPivot.add(eyesClosed);
    // (뜬 눈은 생략 — 항상 자는 중이라 감은 눈만 사용)
    void eyeYellowM;

    const tail1 = createJoint('Tail1', 0, 0.2, -0.98, abdomen);
    tail1.add(box(0.16, 0.16, 0.55, orangeM, 0, 0, -0.25));
    tail1.add(box(0.17, 0.17, 0.1, stripeM, 0, 0, -0.3));
    const tail2 = createJoint('Tail2', 0, 0, -0.5, tail1);
    tail2.add(box(0.14, 0.14, 0.55, orangeM, 0, 0, -0.25));
    tail2.add(box(0.15, 0.15, 0.1, stripeM, 0, 0, -0.28));
    const tail3 = createJoint('Tail3', 0, 0, -0.5, tail2);
    tail3.add(box(0.12, 0.12, 0.45, orangeM, 0, 0, -0.2));
    tail3.add(box(0.13, 0.13, 0.2, stripeM, 0, 0, -0.35));
    const tailPivot = tail1; // update()가 쓰는 이름(tailPivot)

    function createLeg(isFront, sideSign, parent, xOffset, yOffset, zOffset) {
      const upperLen = isFront ? 0.62 : 0.68;
      const lowerLen = isFront ? 0.58 : 0.62;
      const upperW = isFront ? 0.28 : 0.32;

      const hip = createJoint('Hip', xOffset * sideSign, yOffset, zOffset, parent);
      hip.add(box(upperW, upperLen, upperW * 1.1, orangeM, 0, -upperLen / 2, 0));
      hip.add(box(upperW + 0.02, 0.09, upperW * 1.12, stripeM, 0, -upperLen * 0.45, 0));

      const knee = createJoint('Knee', 0, -upperLen, 0, hip);
      knee.add(box(upperW * 0.82, lowerLen, upperW * 0.85, orangeM, 0, -lowerLen / 2, 0));
      knee.add(box(upperW * 0.85, 0.08, upperW * 0.88, stripeM, 0, -lowerLen * 0.4, 0));

      const paw = createJoint('Paw', 0, -lowerLen, 0, knee);
      paw.add(box(upperW * 0.95, 0.16, 0.34, creamM, 0, -0.06, 0.06));

      return { hip, knee, paw };
    }
    const frontL = createLeg(true, 1, body, 0.36, -0.18, 0.55);
    const frontR = createLeg(true, -1, body, 0.36, -0.18, 0.55);
    const backL = createLeg(false, 1, abdomen, 0.34, -0.12, -0.78);
    const backR = createLeg(false, -1, abdomen, 0.34, -0.12, -0.78);

    // ---- 수면(옆으로 몸을 둥글게 말고 누운) 자세 ----
    root.position.y = 0.52; root.rotation.x = 0.05; root.rotation.z = 0.38;
    body.rotation.x = 0.12; body.rotation.y = 0.28;
    abdomen.rotation.x = -0.15; abdomen.rotation.y = 0.42;
    neck.rotation.x = 0.32;
    headPivot.rotation.set(0.18, 0.35, -0.25);
    jaw.rotation.x = 0.02;
    earL.rotation.x = 0.1; earR.rotation.x = 0.1;
    frontL.hip.rotation.set(-1.25, 0, -0.2); frontL.knee.rotation.x = 1.85; frontL.paw.rotation.x = -0.5;
    frontR.hip.rotation.set(-1.15, 0, 0.15); frontR.knee.rotation.x = 1.65; frontR.paw.rotation.x = -0.4;
    backL.hip.rotation.set(-1.35, 0, -0.25); backL.knee.rotation.x = -1.45; backL.paw.rotation.x = 0.8;
    backR.hip.rotation.set(-1.2, 0, 0.2); backR.knee.rotation.x = -1.3; backR.paw.rotation.x = 0.7;
    tail1.rotation.set(-0.1, 0.65, 0);
    tail2.rotation.set(0.05, 0.75, 0);

    animParts.body = body;
    animParts.headPivot = headPivot;
    animParts.tailPivot = tailPivot;
    animParts.earL = earL;
    animParts.earR = earR;

    // [앞에 놓인 호랑이 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('TigerEgg_Root', 0, 0.28, 0, eggGroup);
    const eOrangeM = mat(0xf97316, 0.55, 0.1);
    const eCreamM = mat(0xfffbeb, 0.65, 0.05);
    const eStripeM = mat(0x18181b, 0.8, 0.1);
    const eGoldCoreM = mat(0xf59e0b, 0.2, 0.2, 0xf59e0b, 1.1);
    const eggS = 0.84;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eOrangeM, eStripeM, eGoldCoreM);
    addBoxE(eggRoot, 0.68 * eggS, 0.72 * eggS, 0.10 * eggS, eCreamM, 0, 0.56 * eggS, 0.62 * eggS);
    addBoxE(eggRoot, 0.22 * eggS, 0.22 * eggS, 0.06 * eggS, eGoldCoreM, 0, 0.58 * eggS, 0.68 * eggS);
    for (const side of [-1, 1]) {
      addBoxE(eggRoot, 0.10, 0.12, 0.92 * eggS, eStripeM, side * 0.62 * eggS, 0.52 * eggS, 0);
      addBoxE(eggRoot, 0.10, 0.12, 0.82 * eggS, eStripeM, side * 0.60 * eggS, 0.85 * eggS, 0);
    }
    addBoxE(eTopCap, 0.36 * eggS, 0.06 * eggS, 0.06 * eggS, eStripeM, 0, 0.16 * eggS, 0.45 * eggS);
    addBoxE(eTopCap, 0.28 * eggS, 0.06 * eggS, 0.06 * eggS, eStripeM, 0, 0.06 * eggS, 0.55 * eggS);
    addBoxE(eTopCap, 0.07 * eggS, 0.24 * eggS, 0.06 * eggS, eStripeM, 0, 0.08 * eggS, 0.52 * eggS);
    const eEarL = createJoint('TigerEgg_EarL', 0.34 * eggS, 0.28 * eggS, 0, eTopCap);
    addBoxE(eEarL, 0.20, 0.24, 0.12, eStripeM, 0, 0.10, 0, 0, 0, -0.25);
    addBoxE(eEarL, 0.10, 0.10, 0.13, eCreamM, 0, 0.12, 0, 0, 0, -0.25);
    const eEarR = createJoint('TigerEgg_EarR', -0.34 * eggS, 0.28 * eggS, 0, eTopCap);
    addBoxE(eEarR, 0.20, 0.24, 0.12, eStripeM, 0, 0.10, 0, 0, 0, 0.25);
    addBoxE(eEarR, 0.10, 0.10, 0.13, eCreamM, 0, 0.12, 0, 0, 0, 0.25);
    const eTailPivot = createJoint('TigerEgg_Tail', 0, 0.22 * eggS, -0.58 * eggS, eggRoot);
    addBoxE(eTailPivot, 0.14, 0.14, 0.45, eOrangeM, 0.22, 0.05, -0.15, 0.2, 0.6, 0);
    addBoxE(eTailPivot, 0.15, 0.15, 0.14, eStripeM, 0.36, 0.10, -0.22, 0.2, 0.6, 0);
    egg.eggRoot = eggRoot;
    // animParts.earL/earR은 위에서 이미 실제 호랑이 귀로 설정해둠(알의 장식 귀로 덮어쓰지 않음)
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (3) 🐉 Lv.3 서양 드래곤 (날개를 접고 엎드려 자는 자세) + 드래곤 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'dragon') {
    // ---- 원본 "블록형 로우폴리 드래곤" 뷰어의 리깅을 그대로 가져와 조립 ----
    const scaleM = mat(0x1e1b2e, 0.65, 0.3);
    const scaleDarkM = mat(0x110f1a, 0.7, 0.3);
    const bellyM = mat(0x3b3355, 0.65, 0.2);
    const wingBoneM = mat(0x2e2640, 0.6, 0.2);
    const wingMembraneM = mat(0x4c1d95, 0.5, 0.2);
    const spinePlateM = mat(0x9333ea, 0.4, 0.3, 0x9333ea, 0.5);
    const hornM = mat(0xd8b4fe, 0.45, 0.3);
    const eyeClosedM = mat(0x09070d, 0.8);
    const nostrilM = mat(0xa855f7, 0.5, 0.2, 0x7e22ce, 0.5);

    // 원본과 같은 호출 순서(parent 먼저)의 블록 도우미
    const addBlock = (parent, w, h, d, m, x, y, z, rx, ry, rz) => {
      const o = box(w, h, d, m, x, y, z);
      if (rx) o.rotation.x = rx; if (ry) o.rotation.y = ry; if (rz) o.rotation.z = rz;
      parent.add(o);
      return o;
    };

    const root = createJoint('Root', 0, 2.2, 0, creatureGroup);
    const body = createJoint('Chest', 0, 0, 0, root);   // update()가 쓰는 이름(body) 유지
    addBlock(body, 1.15, 0.92, 1.55, scaleM, 0, 0, 0.15);
    addBlock(body, 0.88, 0.22, 1.42, bellyM, 0, -0.42, 0.15);
    addBlock(body, 0.14, 0.26, 0.26, spinePlateM, 0, 0.56, 0.65);
    addBlock(body, 0.14, 0.28, 0.28, spinePlateM, 0, 0.57, 0.15);
    addBlock(body, 0.14, 0.26, 0.26, spinePlateM, 0, 0.56, -0.35);

    const abdomen = createJoint('Abdomen', 0, 0.02, -0.62, body);
    addBlock(abdomen, 0.92, 0.76, 1.15, scaleM, 0, -0.04, -0.52);

    const wingL = createDragonWing('L');

    const tail1 = createJoint('Tail1', 0, 0.04, -1.08, abdomen);

      const hip = createJoint('Hip', x, y, z, parent);

    createDragonLeg(body, 0.52, -0.25, 0.52, false);
    createDragonLeg(body, -0.52, -0.25, 0.52, false);

    createDragonLeg(abdomen, -0.44, -0.18, -0.68, true);

    // ---- 수면 자세(원본 'sleep' 상태 값을 고정 자세로) ----

    for (const side of [-1, 1]) {

    const eWingL = createJoint('DragonEgg_WingL', 0.62 * eggS, 0.78 * eggS, 0, eggRoot);

    for (const { w, side } of [{ w: eWingL, side: 1 }, { w: eWingR, side: -1 }]) {
      addBoxE(w, 0.48, 0.10, 0.10, eObsidianM, side * 0.22, 0.12, 0, 0, 0, side * 0.35);
      addBoxE(w, 0.45, 0.48, 0.04, eScaleM, side * 0.26, -0.08, -0.02, 0, 0, side * 0.2);
    }
    egg.eggRoot = eggRoot;
    egg.eWingL = eWingL;
    egg.eWingR = eWingR;
    egg.shell = eggS;
    return egg;
    };

  // -------------------------------------------------------------------------
  // (4) 🐲 Lv.4 동양 청룡 (또아리를 틀고 여의주를 품은 수면 자세) + 청룡 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'eastern') {
    // ---- 원본 "블록형 로우폴리 동양 청룡" 뷰어의 리깅을 그대로 가져와 조립 ----
    const jadeM = mat(0x0d9488, 0.55, 0.2);
    const jadeDarkM = mat(0x115e59, 0.65, 0.2);
    const goldM = mat(0xfacc15, 0.45, 0.3);
    const antlerM = mat(0xfde047, 0.4, 0.2);
    const maneM = mat(0xe11d48, 0.6, 0.1);

    const eyeClosedM = mat(0x062c28, 0.8);
    const orbM = mat(0x67e8f9, 0.15, 0.1, 0x06b6d4, 0.85);

    const addBlockE = (parent, w, h, d, m, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) => {
      const o = box(w, h, d, m, x, y, z);
      if (rx) o.rotation.x = rx; if (ry) o.rotation.y = ry; if (rz) o.rotation.z = rz;
      parent.add(o);
      return o;
    };

    const body = createJoint('Root_Spine0', 0, 2.5, 1.5, creatureGroup); // update()가 쓰는 이름(body) 유지

    function buildSegmentMesh(joint, w, h, len, zOffset = 0, hasMane = true) {
      addBlockE(joint, w, h, len, jadeM, 0, 0, zOffset);
      addBlockE(joint, w * 0.82, h * 0.18, len * 0.96, jadeDarkM, 0, h * 0.52, zOffset);

        addBlockE(joint, w * 0.18, h * 0.45, len * 0.42, maneM, 0, h * 0.72, zOffset - len * 0.12, -0.25, 0, 0);

    }
    buildSegmentMesh(body, 0.76, 0.72, 0.95, 0, true);

    const neck1 = createJoint('Neck_1', 0, 0.08, 0.45, body);

    for (const side of [-1, 1]) {

      addBlockE(headPivot, 0.14, 0.24, 0.48, jadeM, side * 0.42, 0.25, 0.08, 0.2, side * 0.3, 0);
      addBlockE(headPivot, 0.12, 0.12, 0.85, antlerM, side * 0.26, 0.55, -0.08, 0.45, -side * 0.22, 0);
      addBlockE(headPivot, 0.09, 0.36, 0.09, antlerM, side * 0.32, 0.78, -0.05, -0.2, 0, -side * 0.25);
      addBlockE(headPivot, 0.09, 0.42, 0.09, antlerM, side * 0.38, 0.88, -0.35, 0.3, 0, -side * 0.15);
    }
    addBlockE(headPivot, 0.56, 0.35, 0.45, maneM, 0, 0.42, 0.02, -0.35, 0, 0);
    // 감은 눈
    addBlockE(headPivot, 0.11, 0.05, 0.26, eyeClosedM, 0.38, 0.12, 0.48);
    addBlockE(headPivot, 0.11, 0.05, 0.26, eyeClosedM, -0.38, 0.12, 0.48);

    function createWhisker(side, parent) {
      const wBase = createJoint(`WhiskerBase_${side}`, side * 0.28, -0.02, 1.15, parent);
      addBlockE(wBase, 0.07, 0.07, 0.65, whiskerM, side * 0.12, -0.10, -0.25, -0.25, side * 0.35, 0);
      const wTip = createJoint(`WhiskerTip_${side}`, side * 0.22, -0.20, -0.52, wBase);
      addBlockE(wTip, 0.06, 0.06, 0.65, whiskerM, side * 0.08, -0.08, -0.28, -0.15, side * 0.2, 0);
      wBase.rotation.x = -0.25; wTip.rotation.x = 0.20;
      return { base: wBase, tip: wTip };
    }
    createWhisker(1, headPivot);
    createWhisker(-1, headPivot);

    const jaw = createJoint('Jaw', 0, -0.18, 0.55, headPivot);
    addBlockE(jaw, 0.50, 0.18, 0.68, goldM, 0, -0.06, 0.34);
    addBlockE(jaw, 0.34, 0.26, 0.28, maneM, 0, -0.22, 0.55, 0.3, 0, 0);
    jaw.rotation.x = 0.04;

    // 8단 척추/꼬리 — 둥글게 또아리를 튼 자세로 고정
    const spineSpecs = [
      { w: 0.76, h: 0.72, len: 0.95, dist: -0.88 }, { w: 0.72, h: 0.68, len: 0.95, dist: -0.88 },
      { w: 0.68, h: 0.65, len: 0.95, dist: -0.88 }, { w: 0.64, h: 0.62, len: 0.95, dist: -0.88 },
      { w: 0.56, h: 0.55, len: 0.90, dist: -0.85 }, { w: 0.48, h: 0.46, len: 0.85, dist: -0.80 },
      { w: 0.38, h: 0.38, len: 0.80, dist: -0.75 }, { w: 0.28, h: 0.28, len: 0.75, dist: -0.70 }
    ];
    const coilAnglesY = [-0.46, -0.50, -0.52, -0.52, -0.50, -0.48, -0.45, -0.40];
    const spines = [];
    let parentJoint = body;
    spineSpecs.forEach((spec, idx) => {
      const joint = createJoint(`Spine_${idx + 1}`, 0, 0, spec.dist, parentJoint);
      buildSegmentMesh(joint, spec.w, spec.h, spec.len, -spec.len * 0.42, true);
      joint.rotation.x = idx === 7 ? 0.12 : 0;
      joint.rotation.y = coilAnglesY[idx];
      spines.push(joint);
      parentJoint = joint;
    });
    const tailEnd = spines[spines.length - 1];
    addBlockE(tailEnd, 0.22, 0.48, 0.95, maneM, 0, 0.08, -0.85, 0.15, 0, 0);
    addBlockE(tailEnd, 0.46, 0.24, 0.75, maneM, 0, 0.04, -0.78, 0, 0, 0);
    addBlockE(tailEnd, 0.14, 0.28, 0.65, antlerM, 0, 0.22, -0.75, 0.25, 0, 0);

    function createDragonClawLeg(parent, xOffset, zOffset) {
      const hip = createJoint('Hip', xOffset, -0.18, zOffset, parent);

      addBlockE(paw, 0.34, 0.16, 0.42, jadeDarkM, 0, -0.05, 0.10);
      for (let c = -1; c <= 1; c++) addBlockE(paw, 0.07, 0.10, 0.24, antlerM, c * 0.11, -0.07, 0.34, 0.25, 0, 0);
      addBlockE(paw, 0.07, 0.09, 0.18, antlerM, 0, -0.06, -0.14, -0.2, 0, 0);
      // 자는 자세
      hip.rotation.x = -1.05; knee.rotation.x = 1.35; paw.rotation.x = -0.30;
      return { hip, knee, paw };
    }
    createDragonClawLeg(spines[0], 0.48, -0.35);
    createDragonClawLeg(spines[0], -0.48, -0.35);
    createDragonClawLeg(spines[3], 0.42, -0.35);
    createDragonClawLeg(spines[3], -0.42, -0.35);

    // 또아리 중심에 품은 여의주
    const pearl = new THREE.Mesh(new THREE.OctahedronGeometry(0.35, 1), orbM);
    pearl.position.set(0.15, 0.42, 0.25);
    body.add(pearl);

    // ---- 수면(또아리) 자세 ----
    body.position.set(-0.85, 0.46, 0.55);
    body.rotation.set(0, 0.55, 0.05);
    neck1.rotation.set(0.08, 0.42, 0);
    neck2.rotation.set(0.12, 0.45, 0);
    headPivot.rotation.set(-0.18, 0.35, -0.10);

    animParts.body = body;
    animParts.pearl = pearl;
    animParts.headPivot = headPivot;

    // [앞에 놓인 동양 청룡 알 + 공전 여의주 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('EasternEgg_Root', 0, 0.42, 0, eggGroup);
    const eJadeM = mat(0x0d9488, 0.35, 0.25, 0x0f766e, 0.25);
    const eGoldM = mat(0xfacc15, 0.25, 0.75, 0xf59e0b, 0.4);
    const eCrimsonManeM = mat(0xef4444, 0.4, 0.15, 0xdc2626, 0.6);
    const ePearlM = mat(0x67e8f9, 0.1, 0.1, 0x22d3ee, 2.0);
    const eggS = 0.94;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eJadeM, eGoldM, ePearlM);
    for (let i = 0; i < 4; i++) addBoxE(eggRoot, 0.56 * eggS, 0.15 * eggS, 0.10 * eggS, eGoldM, 0, (0.30 + i * 0.20) * eggS, 0.62 * eggS);
    for (let i = 0; i < 5; i++) addBoxE(eggRoot, 0.14, 0.24, 0.26, eCrimsonManeM, 0, (0.30 + i * 0.22) * eggS, -0.64 * eggS, 0.4, 0, 0);
    for (const side of [-1, 1]) {
      const antler = new THREE.Group();
      antler.position.set(side * 0.28 * eggS, 0.32 * eggS, 0);
      antler.rotation.set(-0.2, 0, side * -0.35);
      eTopCap.add(antler);
      addBoxE(antler, 0.10, 0.48, 0.10, eGoldM, 0, 0.22, 0);
      addBoxE(antler, 0.08, 0.26, 0.08, eGoldM, side * 0.12, 0.30, 0.08, 0.3, 0, side * -0.6);
      addBoxE(antler, 0.08, 0.24, 0.08, eGoldM, side * -0.10, 0.42, -0.06, -0.3, 0, side * 0.5);
    }
    const eWhiskerL = createJoint('EasternEgg_WhiskerL', 0.48 * eggS, 0.76 * eggS, 0.48 * eggS, eggRoot);
    addBoxE(eWhiskerL, 0.46, 0.06, 0.06, eGoldM, 0.22, -0.06, 0.10, 0, -0.3, -0.25);
    const eWhiskerR = createJoint('EasternEgg_WhiskerR', -0.48 * eggS, 0.76 * eggS, 0.48 * eggS, eggRoot);
    addBoxE(eWhiskerR, 0.46, 0.06, 0.06, eGoldM, -0.22, -0.06, 0.10, 0, 0.3, 0.25);
    const orbitPivot = createJoint('EasternEgg_Orbit', 0, 0.75 * eggS, 0, eggRoot);
    const miniPearl = new THREE.Mesh(new THREE.IcosahedronGeometry(0.14, 0), ePearlM);
    miniPearl.position.set(0, 0.15, 0.98 * eggS);
    orbitPivot.add(miniPearl);
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      addBoxE(orbitPivot, 0.24, 0.10, 0.14, eGoldM, Math.cos(ang) * 0.92 * eggS, Math.sin(ang * 2) * 0.12, Math.sin(ang) * 0.92 * eggS, 0, -ang, 0);
    }
    egg.eggRoot = eggRoot;
    egg.orbitPivot = orbitPivot;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (5) 🌌 Lv.5 보라빛 성운 사자 (연한 라벤더·흩날리는 성운 갈기·강렬한 십자 안광/별빛) + 성운 사자 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'lion') {
    // ---- 원본 "블록형 로우폴리 성운 사자" 뷰어의 리깅을 그대로 가져와 조립 ----
    const bodyLavM = mat(0xa855f7, 0.5, 0.2, 0x6b21a8, 0.5);
    const nebulaFurM = mat(0xd8b4fe, 0.55, 0.15, 0x9333ea, 0.55);
    const maneDeepM = mat(0xc084fc, 0.45, 0.1, 0x7e22ce, 0.6);
    const maneMagentaM = mat(0xf472b6, 0.4, 0.1, 0xdb2777, 0.68);
    const maneStarlightM = mat(0xfdf4ff, 0.35, 0.1, 0xe9d5ff, 0.6);
    const starGoldM = mat(0xfacc15, 0.3, 0.3, 0xf59e0b, 1.2);
    const starCyanM = mat(0x67e8f9, 0.3, 0.3, 0x06b6d4, 1.2);
    const starFlareM = mat(0xffffff, 0.1, 0.1, 0xffffff, 1.4);
    const eyeClosedM = mat(0x2a1a3a, 0.8);

    const stars = [];
    function addStarCrystal(parent, size, x, y, z, isCyan) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      parent.add(g);
      g.add(box(size, size, size, isCyan ? starCyanM : starGoldM));
      const sp = size * 3.1, th = size * 0.28;
      g.add(box(sp, th, th, starFlareM));
      g.add(box(th, sp, th, starFlareM));
      g.add(box(th, th, sp, starFlareM));
      stars.push(g);
      return g;
    }
    const addBlockLi = (parent, w, h, d, x, y, z, m, rx = 0, ry = 0, rz = 0) => {
      const o = box(w, h, d, m, x, y, z);
      if (rx) o.rotation.x = rx; if (ry) o.rotation.y = ry; if (rz) o.rotation.z = rz;
      parent.add(o);
      return o;
    };

    const body = createJoint('Chest', 0, 0.35, 0, creatureGroup); // update()가 쓰는 이름(body) 유지, root는 바로 위에서 흡수
    addBlockLi(body, 1.26, 1.18, 1.45, 0, 0.05, 0, bodyLavM);
    addBlockLi(body, 1.32, 0.88, 0.86, 0, -0.10, 0.38, nebulaFurM);
    addBlockLi(body, 0.62, 0.22, 1.30, 0, 0.68, 0.02, maneDeepM);
    addStarCrystal(body, 0.24, 0, -0.05, 0.84, false);
    addStarCrystal(body, 0.12, 0.66, 0.32, 0.35, true);
    addStarCrystal(body, 0.12, -0.66, 0.32, 0.35, true);

    const abdomen = createJoint('Abdomen', 0, 0.02, -0.72, body);
    addBlockLi(abdomen, 1.04, 0.98, 1.38, 0, 0, -0.58, bodyLavM);
    addBlockLi(abdomen, 0.92, 0.35, 1.25, 0, -0.42, -0.55, nebulaFurM);
    addStarCrystal(abdomen, 0.11, 0.54, 0.24, -0.45, false);
    addStarCrystal(abdomen, 0.11, -0.54, 0.24, -0.45, false);

    const neck = createJoint('Neck', 0, 0.35, 0.65, body);
    addBlockLi(neck, 0.92, 0.92, 0.75, 0, 0.10, 0.25, maneDeepM);
    const maneCrown = createJoint('ManeCrown', 0, 0.15, 0.35, neck);

    // 12방향 방사형 성운 갈기 — update()가 쓰는 manePivots 형태({pivot,baseZ,phase})로 담음
    const manePivots = [];
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const cx = Math.cos(angle), cy = Math.sin(angle);
      const strandPivot = new THREE.Group();
      strandPivot.position.set(cx * 0.52, cy * 0.52, 0);
      strandPivot.rotation.z = angle - Math.PI / 2;
      maneCrown.add(strandPivot);
      addBlockLi(strandPivot, 0.48, 0.44, 0.98, cx * 0.28, cy * 0.30, -0.28, maneDeepM);
      addBlockLi(strandPivot, 0.40, 0.36, 0.78, cx * 0.20, cy * 0.22, -0.05, maneMagentaM);
      addBlockLi(strandPivot, 0.30, 0.28, 0.54, cx * 0.12, cy * 0.14, 0.16, maneStarlightM);
      addStarCrystal(strandPivot, i % 2 === 0 ? 0.11 : 0.09, cx * 0.44, cy * 0.46, -0.58, i % 2 === 0);
      manePivots.push({ pivot: strandPivot, baseZ: strandPivot.rotation.z, phase: i * 0.5 });
    }
    // 등/옆으로 흘러내리는 장식 스트리머 2가닥 + 가슴 갈기도 같은 방식으로 흔들리게 포함
    for (const s of [-1, 1]) {
      const sp = new THREE.Group();
      sp.position.set(s * 0.42, 0.58, -0.15);
      sp.rotation.z = Math.PI * 0.5 + s * 0.4 - Math.PI / 2;
      maneCrown.add(sp);
      addBlockLi(sp, 0.36, 0.28, 1.15, 0, 0.08, -0.48, maneMagentaM, 0.22, 0, 0);
      addStarCrystal(sp, 0.11, 0, 0.14, -1.02, s !== 0);
      manePivots.push({ pivot: sp, baseZ: sp.rotation.z, phase: (s + 2) * 1.1 });
    }

    const headPivot = createJoint('Head', 0, 0.22, 0.62, neck);
    addBlockLi(headPivot, 0.86, 0.78, 0.76, 0, 0.04, 0.22, bodyLavM);
    addBlockLi(headPivot, 1.04, 0.46, 0.48, 0, -0.06, 0.18, maneMagentaM);
    addStarCrystal(headPivot, 0.16, 0, 0.28, 0.62, true);
    addBlockLi(headPivot, 0.54, 0.36, 0.52, 0, -0.08, 0.72, nebulaFurM);
    addBlockLi(headPivot, 0.24, 0.28, 0.16, 0.38, 0.48, 0.08, bodyLavM, 0, 0, -0.2);
    addBlockLi(headPivot, 0.24, 0.28, 0.16, -0.38, 0.48, 0.08, bodyLavM, 0, 0, 0.2);
    // 감은 눈
    addBlockLi(headPivot, 0.19, 0.04, 0.10, 0.27, 0.11, 0.60, eyeClosedM);
    addBlockLi(headPivot, 0.19, 0.04, 0.10, -0.27, 0.11, 0.60, eyeClosedM);

    const jaw = createJoint('Jaw', 0, -0.24, 0.45, headPivot);
    addBlockLi(jaw, 0.44, 0.18, 0.48, 0, -0.04, 0.24, bodyLavM);
    addBlockLi(jaw, 0.32, 0.20, 0.35, 0, -0.14, 0.26, maneStarlightM);

    function createLionLeg(parent, x, y, z, isFront) {
      const hip = createJoint('Hip', x, y, z, parent);
      const upperLen = isFront ? 0.78 : 0.86, upperW = isFront ? 0.38 : 0.42;
      addBlockLi(hip, upperW, upperLen, 0.44, 0, -upperLen / 2 + 0.08, 0, bodyLavM);
      addStarCrystal(hip, 0.11, x > 0 ? upperW * 0.54 : -upperW * 0.54, -0.22, 0.08, isFront);
      const knee = createJoint('Knee', 0, -upperLen + 0.12, 0, hip);
      const lowerLen = 0.72;
      addBlockLi(knee, 0.30, lowerLen, 0.32, 0, -lowerLen / 2, 0, nebulaFurM);
      addBlockLi(knee, 0.18, 0.46, 0.24, 0, -0.28, -0.20, maneMagentaM, 0.18, 0, 0);
      const paw = createJoint('Paw', 0, -lowerLen + 0.05, 0, knee);
      addBlockLi(paw, 0.38, 0.22, 0.46, 0, -0.08, 0.08, bodyLavM);
      addBlockLi(paw, 0.07, 0.10, 0.14, -0.11, -0.13, 0.33, starCyanM);
      addBlockLi(paw, 0.07, 0.10, 0.14, 0.0, -0.13, 0.35, starGoldM);
      addBlockLi(paw, 0.07, 0.10, 0.14, 0.11, -0.13, 0.33, starCyanM);
      return { hip, knee, paw };
    }
    const legFL = createLionLeg(body, 0.52, -0.22, 0.36, true);
    const legFR = createLionLeg(body, -0.52, -0.22, 0.36, true);
    const legBL = createLionLeg(abdomen, 0.46, -0.15, -0.95, false);
    const legBR = createLionLeg(abdomen, -0.46, -0.15, -0.95, false);

    const tail = [];
    let tailParent = abdomen;
    for (let i = 0; i < 4; i++) {
      const tz = i === 0 ? -1.22 : -0.52, ty = i === 0 ? 0.20 : 0;
      const tJoint = createJoint(`Tail_${i + 1}`, 0, ty, tz, tailParent);
      const thick = 0.20 - i * 0.025;
      addBlockLi(tJoint, thick, thick, 0.56, 0, 0, -0.25, i < 2 ? bodyLavM : nebulaFurM);
      if (i === 3) {
        addBlockLi(tJoint, 0.42, 0.42, 0.62, 0, 0, -0.62, maneMagentaM, 0, 0, Math.PI / 4);
        addBlockLi(tJoint, 0.28, 0.28, 0.52, 0, 0, -0.82, maneStarlightM);
        addStarCrystal(tJoint, 0.16, 0, 0, -1.12, true);
      }
      tail.push(tJoint);
      tailParent = tJoint;
    }

    // ---- 수면 자세(원본 'sleep' 상태 값을 고정 자세로) ----
    body.position.set(0, 0.62, 0.35);   // Chest가 Root 역할까지 겸함(0.35는 원래 chest의 root 기준 오프셋)
    body.rotation.set(0.08 + 0.04, 0.12, 0.18);
    abdomen.rotation.set(-0.12, 0.28, 0);
    neck.rotation.set(0.28, -0.18, 0);
    headPivot.rotation.set(0.15, 0, -0.22);
    jaw.rotation.x = 0.05;
    legFL.hip.rotation.set(-1.25, 0, -0.18);
    legFL.knee.rotation.x = -0.35; legFL.paw.rotation.x = 0.25;
    legFR.hip.rotation.set(-1.32, 0, 0.22);
    legFR.knee.rotation.x = -0.28; legFR.paw.rotation.x = 0.20;
    legBL.hip.rotation.set(-1.35, 0, 0.25); legBL.knee.rotation.x = 2.05; legBL.paw.rotation.x = -0.65;
    legBR.hip.rotation.set(-1.35, 0, -0.15); legBR.knee.rotation.x = 2.05; legBR.paw.rotation.x = -0.65;
    tail.forEach((tJoint, idx) => { tJoint.rotation.x = -0.08; tJoint.rotation.y = 0.42; });

    animParts.body = body;
    animParts.headPivot = headPivot;
    animParts.manePivots = manePivots;
    animParts.stars = stars;

    // [앞에 놓인 성운 사자 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('LionEgg_Root', 0, 0.34, 0, eggGroup);
    const eVioletM = mat(0xa855f7, 0.35, 0.2, 0x6b21a8, 0.55);
    const eLavenderM = mat(0xe9d5ff, 0.25, 0.15, 0xc084fc, 0.85);
    const ePinkManeM = mat(0xf472b6, 0.25, 0.15, 0xdb2777, 0.95);
    const eStarCoreM = mat(0xffffff, 0.05, 0.0, 0xfef08a, 3.0);
    const eCyanBeamM = mat(0x67e8f9, 0.1, 0.1, 0x38bdf8, 2.5);
    const eggS = 1.0;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eVioletM, eLavenderM, eStarCoreM);
    const eEyePivot = createJoint('LionEgg_StarEye', 0, 0.76 * eggS, 0.66 * eggS, eggRoot);
    addBoxE(eEyePivot, 0.26, 0.26, 0.10, eStarCoreM, 0, 0, 0.04, 0, 0, Math.PI / 4);
    addBoxE(eEyePivot, 0.68, 0.05, 0.04, eCyanBeamM, 0, 0, 0.08);
    addBoxE(eEyePivot, 0.05, 0.68, 0.04, eStarCoreM, 0, 0, 0.08);
    const eggMane = [];
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const mp = createJoint(`LionEgg_Mane_${i}`, Math.cos(ang) * 0.64 * eggS, 0.92 * eggS, Math.sin(ang) * 0.64 * eggS, eggRoot);
      mp.rotation.y = -ang;
      addBoxE(mp, 0.38, 0.18, 0.22, i % 2 === 0 ? eLavenderM : ePinkManeM, 0.18, 0.06, 0, 0, 0, 0.35);
      addBoxE(mp, 0.12, 0.12, 0.12, eStarCoreM, 0.40, 0.15, 0, Math.PI / 4, Math.PI / 4, 0);
      eggMane.push({ pivot: mp, phase: i * 0.55, baseZ: 0.25 });
    }
    const eGemCoords = [[0.42,0.48,0.52],[-0.42,0.48,0.52],[0.52,0.62,-0.42],[-0.52,0.62,-0.42],[0,0.42,0.42]];
    eGemCoords.forEach(([gx, gy, gz], idx) => {
      const g = new THREE.Group();
      g.position.set(gx * eggS, gy * eggS, gz * eggS);
      (idx === 4 ? eTopCap : eggRoot).add(g);
      addBoxE(g, 0.26, 0.04, 0.04, eStarCoreM); addBoxE(g, 0.04, 0.26, 0.04, eStarCoreM); addBoxE(g, 0.04, 0.04, 0.26, eCyanBeamM);
    });

    egg.eggRoot = eggRoot;
    egg.eggMane = eggMane;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (6) 🌑 Lv.6 어둠의 삼족오 (흑일식 광륜 + 3개의 다리 + 칠흑 날개 수면 자세) + 삼족오 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'samjoko') {
    // ---- 원본 "블록형 로우폴리 어둠의 삼족오" 뷰어의 리깅을 그대로 가져와 조립(일부 장식은 간소화) ----
    const obsidianM = mat(0x110c1d, 0.6, 0.3, 0x090414, 0.3);
    const abyssM = mat(0x1e1136, 0.65, 0.25, 0x2e1065, 0.4);
    const shadowEdgeM = mat(0x3b0764, 0.55, 0.2, 0x581c87, 0.5);
    const crimsonM = mat(0xf43f5e, 0.3, 0.1, 0xe11d48, 1.4);
    const hellGoldM = mat(0xfbbf24, 0.4, 0.3, 0xd97706, 0.7);
    const darkBeakM = mat(0x18181b, 0.45, 0.3);
    const voidSunM = mat(0x0a0612, 0.3, 0.2, 0x090414, 0.6);
    const eyeClosedM = mat(0x2a0a1a, 0.8);

    const addBlockSj = (parent, w, h, d, x, y, z, m, rx = 0, ry = 0, rz = 0) => {
      const o = box(w, h, d, m, x, y, z);
      if (rx) o.rotation.x = rx; if (ry) o.rotation.y = ry; if (rz) o.rotation.z = rz;
      parent.add(o);
      return o;
    };

    const body = createJoint('Chest', 0, 0.9, 0.15, creatureGroup); // update()가 쓰는 이름(body) 유지
    addBlockSj(body, 1.35, 1.15, 1.45, 0, 0.02, 0.1, obsidianM, 0.18, 0, 0);
    addBlockSj(body, 1.48, 0.75, 1.05, 0, 0.22, 0.28, abyssM, 0.25, 0, 0);
    addBlockSj(body, 0.55, 0.55, 0.18, 0, 0.08, 0.85, crimsonM, 0.18, 0, Math.PI / 4);
    addBlockSj(body, 0.32, 0.32, 0.22, 0, 0.08, 0.88, voidSunM, 0.18, 0, Math.PI / 4);
    for (const side of [-1, 1]) {
      addBlockSj(body, 0.28, 0.45, 0.95, side * 0.72, 0.25, 0.15, shadowEdgeM, 0.2, side * 0.22, -side * 0.25);
      addBlockSj(body, 0.18, 0.25, 0.55, side * 0.82, 0.18, -0.25, crimsonM, 0.15, side * 0.3, 0);
    }

    const abdomen = createJoint('Abdomen', 0, -0.18, -0.78, body);
    addBlockSj(abdomen, 1.08, 0.88, 1.15, 0, 0, -0.35, obsidianM, -0.12, 0, 0);
    addBlockSj(abdomen, 0.92, 0.65, 0.85, 0, -0.12, -0.55, abyssM, -0.18, 0, 0);

    // 등 뒤 흑일식 광륜(코로나 링) — 원본의 haloPivot 역할
    const haloPivot = createJoint('EclipseHalo', 0, 1.15, -0.25, body);
    addBlockSj(haloPivot, 0.88, 0.88, 0.14, 0, 0, 0, voidSunM);
    addBlockSj(haloPivot, 0.88, 0.88, 0.14, 0, 0, 0, voidSunM, 0, 0, Math.PI / 4);
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const r = 0.72, cx = Math.cos(ang) * r, cy = Math.sin(ang) * r;
      const spikeLen = i % 2 === 0 ? 0.55 : 0.34;
      addBlockSj(haloPivot, 0.16, spikeLen, 0.08, cx, cy, -0.02, i % 3 === 0 ? hellGoldM : crimsonM, 0, 0, ang - Math.PI / 2);
    }

    const neck = createJoint('Neck', 0, 0.52, 0.68, body);
    addBlockSj(neck, 0.72, 0.78, 0.72, 0, 0.22, 0.15, obsidianM, 0.35, 0, 0);

    const headPivot = createJoint('Head', 0, 0.52, 0.32, neck);
    addBlockSj(headPivot, 0.74, 0.66, 0.82, 0, 0.06, 0.12, obsidianM);
    for (const side of [-1, 1]) addBlockSj(headPivot, 0.22, 0.14, 0.58, side * 0.32, 0.26, 0.22, abyssM, 0.12, side * 0.15, -side * 0.28);
    addBlockSj(headPivot, 0.38, 0.30, 0.68, 0, -0.02, 0.72, darkBeakM, 0.12, 0, 0);
    addBlockSj(headPivot, 0.24, 0.28, 0.32, 0, -0.14, 1.08, darkBeakM, 0.65, 0, 0);
    // 감은 세 개의 마안
    for (const side of [-1, 1]) addBlockSj(headPivot, 0.08, 0.05, 0.28, side * 0.37, 0.08, 0.26, crimsonM, -0.12, 0, 0);
    addBlockSj(headPivot, 0.05, 0.22, 0.12, 0, 0.28, 0.50, hellGoldM, -0.15, 0, 0);

    const jaw = createJoint('Jaw', 0, -0.18, 0.45, headPivot);
    addBlockSj(jaw, 0.30, 0.14, 0.58, 0, -0.02, 0.26, darkBeakM, -0.05, 0, 0);
    addBlockSj(jaw, 0.18, 0.08, 0.42, 0, 0.05, 0.24, crimsonM);

    // 머리 위 3가닥 암흑 제왕 볏
    for (let c = -1; c <= 1; c++) {
      const crestPivot = createJoint(`Crest_${c + 1}`, c * 0.18, 0.36, -0.05, headPivot);
      const len = c === 0 ? 0.95 : 0.75;
      crestPivot.rotation.set(0.45 + Math.abs(c) * 0.12, c * 0.22, 0);
      addBlockSj(crestPivot, 0.16, 0.16, len, 0, 0, -len * 0.45, obsidianM);
      addBlockSj(crestPivot, 0.14, 0.14, len * 0.55, 0, 0.04, -len * 0.85, c === 0 ? hellGoldM : crimsonM);
    }

    // 초대형 2단 관절 칠흑 날개(장식 깃은 간소화)
    function createDarkWing(side, parent) {
      const inner = createJoint(side === 1 ? 'Wing_L_Inner' : 'Wing_R_Inner', side * 0.62, 0.42, 0.22, parent);
      addBlockSj(inner, side * 1.45, 0.22, 0.42, side * 0.72, 0.05, 0.18, obsidianM, 0, 0, side * 0.05);
      addBlockSj(inner, side * 1.35, 0.16, 0.75, side * 0.68, 0.0, -0.12, abyssM);
      for (let i = 0; i < 4; i++) {
        const fx = side * (0.28 + i * 0.3), fLen = 1.0 + i * 0.1;
        addBlockSj(inner, 0.22, 0.10, fLen, fx, -0.04, -0.35 - fLen * 0.35, obsidianM, -0.06, side * 0.08, 0);
      }
      const outer = createJoint(side === 1 ? 'Wing_L_Outer' : 'Wing_R_Outer', side * 1.42, 0.06, 0.15, inner);
      addBlockSj(outer, side * 1.65, 0.18, 0.34, side * 0.82, 0.02, 0.12, obsidianM);
      for (let j = 0; j < 5; j++) {
        const px = side * (0.22 + j * 0.3), pLen = 1.5 - Math.abs(j - 2) * 0.15;
        addBlockSj(outer, 0.22, 0.09, pLen, px, -0.02, -0.25 - pLen * 0.32, obsidianM, -0.04, side * 0.2, 0);
        addBlockSj(outer, 0.15, 0.07, 0.5, px, -0.03, -0.45 - pLen * 0.88, j % 2 === 0 ? crimsonM : shadowEdgeM, -0.04, side * 0.2, 0);
      }
      return { inner, outer };
    }
    const wingL = createDarkWing(1, body);
    const wingR = createDarkWing(-1, body);

    // 삼족(좌·중앙·우 황금 발톱 다리)
    function createCrowLeg(x, y, z, isCenter, parent) {
      const hip = createJoint('Hip', x, y, z, parent);
      addBlockSj(hip, 0.34, 0.58, 0.38, 0, -0.22, 0.04, isCenter ? abyssM : obsidianM, 0.25, 0, 0);
      addBlockSj(hip, 0.26, 0.24, 0.28, 0, -0.42, -0.05, crimsonM, 0.2, 0, 0);
      const knee = createJoint('Knee', 0, -0.48, 0.10, hip);
      addBlockSj(knee, 0.16, 0.56, 0.18, 0, -0.26, -0.06, darkBeakM, -0.28, 0, 0);
      addBlockSj(knee, 0.18, 0.38, 0.08, 0, -0.24, 0.04, hellGoldM, -0.28, 0, 0);
      const talon = createJoint('Talon', 0, -0.52, -0.14, knee);
      addBlockSj(talon, 0.22, 0.12, 0.24, 0, -0.04, 0.04, darkBeakM);
      [-0.10, 0, 0.10].forEach((tx, idx) => {
        const yaw = (idx - 1) * -0.25;
        addBlockSj(talon, 0.07, 0.08, 0.32, tx, -0.06, 0.22, darkBeakM, 0.15, yaw, 0);
        addBlockSj(talon, 0.06, 0.12, 0.18, tx * 1.35, -0.11, 0.38, isCenter ? crimsonM : hellGoldM, 0.55, yaw, 0);
      });
      return { hip, knee, talon };
    }
    const legL = createCrowLeg(0.44, -0.28, -0.18, false, abdomen);
    const legCenter = createCrowLeg(0.0, -0.32, 0.12, true, abdomen);
    const legR = createCrowLeg(-0.44, -0.28, -0.18, false, abdomen);

    // 5가닥 암흑 봉황형 꼬리깃
    const tailBase = createJoint('Tail_Base', 0, 0.05, -0.82, abdomen);
    addBlockSj(tailBase, 0.68, 0.32, 0.55, 0, 0, -0.22, obsidianM, -0.1, 0, 0);
    const tailPlumes = [];
    for (let t = -2; t <= 2; t++) {
      const tPivot = createJoint(`TailPlume_${t + 2}`, t * 0.18, 0.02, -0.38, tailBase);

      addBlockSj(tPivot, 0.24, 0.08, pLen * 0.65, 0, 0, -pLen * 0.32, obsidianM);
      addBlockSj(tPivot, 0.28, 0.09, pLen * 0.55, 0, 0.01, -pLen * 0.68, abyssM);
      addBlockSj(tPivot, 0.34, 0.10, 0.58, 0, 0.02, -pLen * 0.96, crimsonM);
      addBlockSj(tPivot, 0.18, 0.12, 0.28, 0, 0.02, -pLen * 0.96, isCenterPlume ? voidSunM : hellGoldM);
      tailPlumes.push(tPivot);
    }

    // ---- 수면 자세(원본 'sleep' 상태 값을 고정 자세로) ----
    body.position.y = 1.05; body.rotation.x = 0.12 - 0.18;
    abdomen.rotation.x = -0.18;
    neck.rotation.set(0.45, 0.12, 0);
    headPivot.rotation.set(0.42, 0, -0.10);
    jaw.rotation.x = 0.02;
    wingL.inner.rotation.set(0.35, -0.82, -0.52);
    wingL.outer.rotation.z = -1.15;
    wingR.inner.rotation.set(0.35, 0.82, 0.52);
    wingR.outer.rotation.z = 1.15;
    [legL, legCenter, legR].forEach((leg, idx) => {
      leg.hip.rotation.x = idx === 1 ? 0.55 : 0.42;
      leg.knee.rotation.x = -0.95;
      leg.talon.rotation.x = 0.48;
    });
    tailBase.rotation.x = -0.22;
    tailPlumes.forEach(tp => { tp.rotation.x = 0.08; });

    animParts.body = body;
    animParts.headPivot = headPivot;
    animParts.haloPivot = haloPivot;
    animParts.wingL = wingL;
    animParts.wingR = wingR;

    // [앞에 놓인 어둠의 삼족오 알 — 원본 알 컬렉션 뷰어에서 그대로 포팅]
    // 알 1개를 만드는 함수 — 생물마다 3~4번 호출해서 랜덤 크기/위치로 배치함
    eggFactory = (eggGroup) => {
    const egg = {};
    const eggRoot = createJoint('SamjokoEgg_Root', 0, 0.54, 0, eggGroup);
    const eObsidianM = mat(0x0b0714, 0.3, 0.45, 0x1e1b4b, 0.25);
    const eDarkFeatherM = mat(0x181028, 0.4, 0.35);
    const eCrimsonM = mat(0xe11d48, 0.15, 0.2, 0xf43f5e, 2.2);
    const eEclipseGoldM = mat(0xfbbf24, 0.2, 0.85, 0xd97706, 0.9);
    const eLaserWhiteM = mat(0xffffff, 0.05, 0.0, 0xffe4e6, 3.2);
    const eggS = 1.05;
    const { topCap: eTopCap } = buildBlockyEggShell(eggRoot, eggS, eObsidianM, eCrimsonM, eCrimsonM);
    const eThirdEye = createJoint('SamjokoEgg_ThirdEye', 0, 0.78 * eggS, 0.66 * eggS, eggRoot);
    addBoxE(eThirdEye, 0.18, 0.38, 0.10, eCrimsonM, 0, 0, 0.02);
    addBoxE(eThirdEye, 0.08, 0.26, 0.12, eLaserWhiteM, 0, 0, 0.04);
    addBoxE(eThirdEye, 0.65, 0.04, 0.04, eCrimsonM, 0, 0, 0.07);
    addBoxE(eThirdEye, 0.04, 0.65, 0.04, eEclipseGoldM, 0, 0, 0.07);
    for (let i = -1; i <= 1; i++) {
      addBoxE(eTopCap, 0.10, 0.42 - Math.abs(i) * 0.08, 0.18, eDarkFeatherM, i * 0.16, 0.52 * eggS, -0.05, -0.35, 0, i * -0.18);

    const eggHalo = createJoint('SamjokoEgg_Halo', 0, 0.92 * eggS, -0.72 * eggS, eggRoot);
    addBoxE(eggHalo, 0.95, 0.95, 0.08, eObsidianM, 0, 0, -0.04, 0, 0, Math.PI / 4);
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      addBoxE(eggHalo, 0.12, 0.42, 0.06, i % 2 === 0 ? eCrimsonM : eEclipseGoldM, Math.cos(ang) * 0.86, Math.sin(ang) * 0.86, 0, 0, 0, ang - Math.PI / 2);
    }
    for (const { w, side } of [{ w: createJoint('SamjokoEgg_WingL', 0.66 * eggS, 0.82 * eggS, 0, eggRoot), side: 1 }, { w: createJoint('SamjokoEgg_WingR', -0.66 * eggS, 0.82 * eggS, 0, eggRoot), side: -1 }]) {

        addBoxE(w, 0.56 - b * 0.06, 0.12, 0.10, eDarkFeatherM, side * (0.28 + b * 0.08), 0.16 - b * 0.12, 0, 0, 0, side * (0.3 - b * 0.15));
        addBoxE(w, 0.18, 0.08, 0.11, eCrimsonM, side * (0.54 + b * 0.06), 0.22 - b * 0.12, 0);

      for (const tx of [-0.07, 0, 0.07]) addBoxE(legPivot, 0.05, 0.06, 0.14, eCrimsonM, tx, -0.26, 0.28, 0.2, 0, 0);
    }
    egg.eggRoot = eggRoot;
    egg.eggHalo = eggHalo;
    egg.shell = eggS;
    return egg;
    };
  }

  // -------------------------------------------------------------------------
  // (7) 🔥 Lv.7 대악마(마왕) (가고일처럼 날개를 감싸 무릎 꿇고 잠든 자세 + 지옥불 대검) + 대악마 알
  // -------------------------------------------------------------------------
  else if (zone.id === 'demon') {
    // ---- 원본 "블록형 로우폴리 대악마" 뷰어의 리깅을 그대로 가져와 조립(장식 일부는 간소화) ----

    const eyeClosedM = mat(0x180408, 0.8);

    const addBoxD = (parent, w, h, d, m, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) => {
      const o = box(w, h, d, m, x, y, z);
      if (rx) o.rotation.x = rx; if (ry) o.rotation.y = ry; if (rz) o.rotation.z = rz;
      parent.add(o);

    const pelvis = createJoint('Pelvis', 0, 1.3, 0, creatureGroup);
    addBoxD(pelvis, 0.95, 0.45, 0.62, armorM, 0, 0, 0);
    addBoxD(pelvis, 0.30, 0.32, 0.68, magmaM, 0, 0.02, 0);

    const body = createJoint('Abdomen', 0, 0.25, 0, pelvis); // update()가 쓰는 이름(body)
    addBoxD(body, 1.05, 0.62, 0.66, crimsonSkinM, 0, 0.30, 0);
    addBoxD(body, 0.65, 0.10, 0.70, magmaM, 0, 0.22, 0);

    addBoxD(chest, 1.55, 0.90, 0.88, crimsonSkinM, 0, 0.45, 0);
    addBoxD(chest, 1.62, 0.45, 0.92, armorM, 0, 0.62, 0);
    const coreMesh = addBoxD(chest, 0.50, 0.50, 0.96, magmaM, 0, 0.50, 0);
    addBoxD(chest, 0.22, 0.75, 0.95, magmaM, 0, 0.46, 0);
    addBoxD(chest, 0.20, 0.35, 0.30, boneHornM, 0, 0.35, -0.52, -0.35, 0, 0);

    const neck = createJoint('Neck', 0, 0.90, 0.08, chest);
    addBoxD(neck, 0.52, 0.34, 0.50, darkSkinM, 0, 0.12, 0);

    const headPivot = createJoint('Head', 0, 0.26, 0.06, neck);
    addBoxD(headPivot, 0.68, 0.62, 0.72, crimsonSkinM, 0, 0.28, 0);
    addBoxD(headPivot, 0.72, 0.22, 0.75, armorM, 0, 0.48, 0.02);
    addBoxD(headPivot, 0.16, 0.28, 0.78, magmaM, 0, 0.42, 0.03);
    addBoxD(headPivot, 0.74, 0.12, 0.20, armorM, 0, 0.34, 0.34, 0.15, 0, 0);
    // 감은 눈
    addBoxD(headPivot, 0.20, 0.04, 0.08, eyeClosedM, 0.18, 0.24, 0.36, 0, 0, -0.12);
    addBoxD(headPivot, 0.20, 0.04, 0.08, eyeClosedM, -0.18, 0.24, 0.36, 0, 0, 0.12);
    // 거대한 3단 곡선 뿔
    for (const side of [-1, 1]) {
      addBoxD(headPivot, 0.26, 0.26, 0.55, armorM, side * 0.42, 0.48, -0.10, 0.35, side * -0.45, 0);
      addBoxD(headPivot, 0.20, 0.58, 0.22, boneHornM, side * 0.65, 0.76, -0.35, 0.25, 0, side * -0.25);
      addBoxD(headPivot, 0.14, 0.45, 0.14, magmaM, side * 0.76, 1.18, -0.25, 0.40, 0, side * -0.10);
    }

    const jaw = createJoint('Jaw', 0, 0.06, 0.10, headPivot);
    addBoxD(jaw, 0.56, 0.22, 0.56, darkSkinM, 0, -0.06, 0.10);
    addBoxD(jaw, 0.32, 0.16, 0.18, armorM, 0, -0.14, 0.36);
    addBoxD(jaw, 0.08, 0.16, 0.08, hellfireM, 0.18, 0.08, 0.32);
    addBoxD(jaw, 0.08, 0.16, 0.08, hellfireM, -0.18, 0.08, 0.32);

    function buildDemonWing(side) {
      const inner = createJoint(side > 0 ? 'WingInner_L' : 'WingInner_R', side * 0.55, 0.72, -0.38, chest);
      addBoxD(inner, side * 1.45, 0.22, 0.24, armorM, side * 0.72, 0.32, 0, 0, 0, side * 0.42);
      addBoxD(inner, 0.14, 0.42, 0.14, magmaM, side * 1.35, 0.72, 0.10, 0.3, 0, side * -0.2);
      addBoxD(inner, side * 1.40, 0.06, 1.35, wingMembraneM, side * 0.72, 0.12, -0.58, 0.15, 0, side * 0.35);
      const outer = createJoint(side > 0 ? 'WingOuter_L' : 'WingOuter_R', side * 1.38, 0.60, 0, inner);
      addBoxD(outer, side * 2.10, 0.18, 0.18, armorM, side * 1.05, 0.10, 0, 0, 0, side * 0.10);
      addBoxD(outer, 0.35, 0.14, 0.14, magmaM, side * 2.15, 0.20, 0, 0, 0, side * 0.10);
      addBoxD(outer, 0.10, 0.10, 1.6, boneHornM, side * 0.9, 0.08, -0.75, 0, side * 0.3, 0);
      addBoxD(outer, side * 2.15, 0.05, 1.70, wingMembraneM, side * 1.05, 0.04, -0.80, 0, 0, side * 0.08);
      return { inner, outer };
    }
    const wingL = buildDemonWing(1);
    const wingR = buildDemonWing(-1);

    function buildDemonArm(side) {
      const shoulder = createJoint(side > 0 ? 'Shoulder_L' : 'Shoulder_R', side * 0.92, 0.72, 0, chest);
      addBoxD(shoulder, 0.58, 0.46, 0.62, armorM, side * 0.12, 0.08, 0, 0, 0, side * -0.2);
      addBoxD(shoulder, 0.16, 0.45, 0.16, magmaM, side * 0.28, 0.38, 0, 0, 0, side * -0.45);
      addBoxD(shoulder, 0.42, 0.72, 0.44, crimsonSkinM, side * 0.10, -0.36, 0);
      const elbow = createJoint(side > 0 ? 'Elbow_L' : 'Elbow_R', side * 0.12, -0.72, 0, shoulder);
      addBoxD(elbow, 0.38, 0.68, 0.40, armorM, 0, -0.32, 0);
      addBoxD(elbow, 0.42, 0.14, 0.44, magmaM, 0, -0.52, 0);
      const hand = createJoint(side > 0 ? 'Hand_L' : 'Hand_R', 0, -0.68, 0, elbow);
      addBoxD(hand, 0.34, 0.32, 0.36, darkSkinM, 0, -0.14, 0);
      let sword = null;
      if (side < 0) {
        sword = createJoint('Hellfire_Sword', 0, -0.18, 0.15, hand);
        addBoxD(sword, 0.12, 0.12, 0.75, armorM, 0, 0, -0.15);
        addBoxD(sword, 0.22, 0.22, 0.22, magmaM, 0, 0, -0.58);
        addBoxD(sword, 0.95, 0.24, 0.22, armorM, 0, 0, 0.25);
        addBoxD(sword, 0.36, 0.10, 2.35, armorM, 0, 0, 1.48);
        addBoxD(sword, 0.50, 0.06, 2.20, hellfireM, 0, 0, 1.45);
      }
      return { shoulder, elbow, hand, sword };
    }
    const armL = buildDemonArm(1);
    const armR = buildDemonArm(-1);

    function buildDemonLeg(side) {
      const hip = createJoint(side > 0 ? 'Hip_L' : 'Hip_R', side * 0.42, -0.12, 0, pelvis);
      addBoxD(hip, 0.48, 0.82, 0.52, armorM, 0, -0.38, 0.05, -0.2, 0, 0);
      addBoxD(hip, 0.20, 0.30, 0.18, magmaM, 0, -0.68, 0.32);

      addBoxD(knee, 0.36, 0.75, 0.38, crimsonSkinM, 0, -0.34, -0.14, 0.42, 0, 0);
      const ankle = createJoint(side > 0 ? 'Ankle_L' : 'Ankle_R', 0, -0.66, -0.26, knee);
      addBoxD(ankle, 0.42, 0.28, 0.62, armorM, 0, -0.12, 0.20);
      addBoxD(ankle, 0.16, 0.22, 0.22, magmaM, 0.12, -0.15, 0.52);
      addBoxD(ankle, 0.16, 0.22, 0.22, magmaM, -0.12, -0.15, 0.52);
      return { hip, knee, ankle };
    }
    const legL = buildDemonLeg(1);
    const legR = buildDemonLeg(-1);

    const tailLen = [0.65, 0.65, 0.60, 0.55];
    const tails = [];
    let parentTail = pelvis;
    for (let i = 0; i < 4; i++) {
      const tz = i === 0 ? -0.28 : -tailLen[i - 1];
      const ty = i === 0 ? -0.05 : 0;
      const tJoint = createJoint(`Tail_${i + 1}`, 0, ty, tz, parentTail);
      const len = tailLen[i], th = [0.22, 0.18, 0.15, 0.12][i];

      parentTail = tJoint;
