  // -------------------------------------------------------------------------
  // (측정 기반 배치)
  //  1) 생물의 실제 부품 크기를 재서, 벽 안쪽 면에서 WALL_GAP만큼만 띄우고 최대한 벽에 붙임(겹침 없음)
  //  2) 그 앞쪽 부채꼴에 알 3~4개를 랜덤 크기로 놓되, 생물 표면에 바짝 붙이고 서로는 안 겹치게 함
  // -------------------------------------------------------------------------
  const WALL_GAP = 0.5;
  // 생물 움직임(숨쉬기·날개·후광 회전 등)을 한 바퀴 돌려보며 닿을 수 있는 최대 범위를 기준으로 삼음
  // 25초 분량을 돌려 천천히 도는 후광도 한 바퀴 이상 덮음
  const creatureBoxes = sweepMeshBoxes(creatureGroup, i => animParts.anim.update(0.9), 28).filter(bx => bx.max.y > 0.12);   // 바닥 장식(원반 등)은 제외
  const cMargin = CREATURE_MOTION_MARGIN[zone.id] || 0.1;
  const outerNow = (zone.side === -1 ? Math.min(...creatureBoxes.map(bx => bx.min.x)) : Math.max(...creatureBoxes.map(bx => bx.max.x))) + zone.side * cMargin;   // 움직이는 최대 범위까지 포함
  const shiftX = zone.side * (wallInnerX - WALL_GAP) - outerNow;
  creatureGroup.position.x += shiftX;
  creatureBoxes.forEach(bx => { bx.min.x += shiftX; bx.max.x += shiftX; });
  animParts.fit = { outerX: outerNow + shiftX, shiftX };      // (검증용 기록)

  function spawnNestEggs() {                   // 둥지 앞에 알 3~4개를 새로 놓음 (처음 + 3분마다 '알 초기화' 때 다시 부름)
    if (!eggFactory) return;
    const count = 3 + (Math.random() < 0.5 ? 1 : 0);
    // 크기: 같은 동물의 '보통 크기'(×1)를 기준으로 작은 알 40% / 보통 58.95% / 큰 알 1% / 아주 큰 알 0.05% (rollEggRel). 자리 잡기는 '큰 알부터'
    const tierS = EGG_TIER[zone.id] || 1;
    const picked = Array.from({ length: count }, () => rollEggRel() * tierS).sort((u, v) => v - u);
    const cx = creatureGroup.position.x;      // 생물 중심 x (root 기준)
    const placed = [];                        // 이미 놓은 알들 { eg, x, z }
    const zLo = Math.min(...creatureBoxes.map(bx => bx.min.z)) - 3.0, zHi = Math.max(...creatureBoxes.map(bx => bx.max.z)) + 3.0;
    // 생물 앞쪽(복도 쪽) 영역을 0.25칸 격자로 나눠, 칸마다 '생물 표면까지 거리'를 미리 계산해 둠(후보 거르기용, 오차 ±0.18)
    const GRID = 0.25, GU = 32, GZ = Math.ceil((zHi - zLo) / GRID);      // u: 생물 중심에서 복도 쪽으로 0~8
    const gridDist = new Float32Array(GU * GZ);
    for (let iu = 0; iu < GU; iu++) {
      const gx = cx - zone.side * (iu + 0.5) * GRID;
      for (let iz = 0; iz < GZ; iz++) {
        const gz = zLo + (iz + 0.5) * GRID;
        let dmin = 1e9;
        for (const bx of creatureBoxes) {
          const dx = Math.max(bx.min.x - gx, 0, gx - bx.max.x), dz = Math.max(bx.min.z - gz, 0, gz - bx.max.z);
          const d2 = dx * dx + dz * dz;
          if (d2 < dmin) dmin = d2;
        }
        gridDist[iu * GZ + iz] = Math.sqrt(dmin);
      }
    }
    const gridGapAt = (px, pz) => {
      const iu = Math.floor(((cx - px) * zone.side) / GRID), iz = Math.floor((pz - zLo) / GRID);
      if (iu < 0 || iu >= GU || iz < 0 || iz >= GZ) return 1e9;
      return gridDist[iu * GZ + iz];
    };
    const PAD = 0.05;                         // 부품 사이 기본 여유(움직임 여유는 따로 더함)

    // eg(알 부품 AABB 목록, 원점 기준)를 (ox,oz)에 놓았을 때 targets(AABB 목록)와 '3D로' 겹치는지
    const hitsBoxes = (eg, ox, oz, targets, pad) => {
      const ax0 = eg.aabb.min.x + ox - pad, ax1 = eg.aabb.max.x + ox + pad, az0 = eg.aabb.min.z + oz - pad, az1 = eg.aabb.max.z + oz + pad;
      for (const t of targets) {
        if (t.max.x < ax0 || t.min.x > ax1 || t.max.z < az0 || t.min.z > az1) continue;     // 전체 범위 밖이면 건너뜀(빠른 거름)
        for (const e of eg.boxes) {
          if (e.max.x + ox + pad < t.min.x || e.min.x + ox - pad > t.max.x) continue;
          if (e.max.z + oz + pad < t.min.z || e.min.z + oz - pad > t.max.z) continue;
          if (e.max.y + pad < t.min.y || e.min.y - pad > t.max.y) continue;                 // 높이도 여유를 두고 비교
          return true;
        }
      }
      return false;
    };

    for (let n = 0; n < picked.length; n++) {        // (자리를 못 찾으면 아래에서 70% 작은 알로 바꿔 다시 시도하므로 picked가 늘어날 수 있음)
      const g = new THREE.Group();
      const parts = eggFactory(g);
      const sc = picked[n];
      g.rotation.y = inwardYaw + (Math.random() - 0.5) * 1.0;
      g.scale.setScalar(sc);
      // 알 부품의 실제 크기를 움직임(둥실거림·날개·후광·여의주 회전)까지 한 바퀴 돌려서 구함(회전·배율 적용, 원점 기준)
      const baseYe = (zone.id === 'archangel' ? 0.38 : 0.18);
      const eboxes = sweepMeshBoxes(g, i => animateEgg(zone.id, parts, baseYe, i * 0.48 + 0.3, 0.48), 16);
      const aabb = { min: { x: 1e9, z: 1e9 }, max: { x: -1e9, z: -1e9 } };
      eboxes.forEach(bx => { aabb.min.x = Math.min(aabb.min.x, bx.min.x); aabb.max.x = Math.max(aabb.max.x, bx.max.x); aabb.min.z = Math.min(aabb.min.z, bx.min.z); aabb.max.z = Math.max(aabb.max.z, bx.max.z); });
      const eg = { boxes: eboxes, aabb };
      const shellR = 0.64 * parts.shell * sc;      // 알 껍데기 반경(집기·붙임 거리 계산용)
      const eMargin = (EGG_MOTION_MARGIN_1X[zone.id] || 0.15) * sc * MOTION_MARGIN_SCALE;   // 이 알이 움직일 때 더 벌어질 수 있는 범위

      const fits = (px, pz) => {
        if (px + aabb.max.x + eMargin > wallInnerX - 0.8 || px + aabb.min.x - eMargin < -(wallInnerX - 0.8)) return false;   // 양쪽 벽과 거리 확보
        if (hitsBoxes(eg, px, pz, creatureBoxes, PAD + cMargin * MOTION_MARGIN_SCALE + eMargin)) return false;                                 // 생물과 안 겹침(둘 다 움직이는 여유 포함)
        for (const o of placed) if (hitsBoxes(eg, px, pz, o.boxesAbs, PAD + eMargin + o.margin)) return false;           // 다른 알과 안 겹침
        return true;
      };
      const shellGap = (px, pz) => {               // 알 껍데기가 생물 표면에서 얼마나 떨어져 있는지(바닥 평면 기준)
        let gmin = 1e9;
        for (const bx of creatureBoxes) {
          const dx = Math.max(bx.min.x - px, 0, px - bx.max.x), dz = Math.max(bx.min.z - pz, 0, pz - bx.max.z);
          gmin = Math.min(gmin, Math.hypot(dx, dz));
        }
        return gmin - shellR;
      };

      // 생물 앞쪽(안쪽 절반) 영역에서 후보를 무작위로 뽑아, 껍데기가 생물 표면에서 0.5 이내인 곳만 고름.
      // 자리가 없으면 기준을 1.0 → 2.0 → 4.0 → 제한없음 순으로만 완화
      let best = null;
      for (const maxGap of [0.5, 1.0, 2.0, 4.0, 99]) {
        const cands = [];
        for (let k = 0; k < 500; k++) {
          const px = cx - zone.side * (Math.random() * GU * GRID);
          const pz = zLo + Math.random() * (zHi - zLo);
          if (gridGapAt(px, pz) - shellR > maxGap + 0.2) continue;      // 격자로 먼저 빠르게 거름(멀면 탈락)
          if (shellGap(px, pz) > maxGap) continue;                       // 정확한 거리로 다시 확인
          if (fits(px, pz)) cands.push({ x: px, z: pz });
        }
        if (cands.length) { best = cands[Math.floor(Math.random() * cands.length)]; break; }
      }
      if (!best) {                                                                                  // 겹치게 억지로 놓지는 않음
        if (sc * 0.7 >= tierS * 0.45) picked.splice(n + 1, 0, sc * 0.7);                              // 큰 알이라 자리가 없으면 70% 크기로 줄여서 다시 시도
        else console.warn('알 자리를 못 찾아 건너뜀:', zone.id, n);
        continue;
      }

      g.position.set(best.x, 0, best.z);
      root.add(g);
      placed.push({ x: best.x, z: best.z, margin: eMargin, boxesAbs: eboxes.map(bx => ({ min: { x: bx.min.x + best.x, y: bx.min.y, z: bx.min.z + best.z }, max: { x: bx.max.x + best.x, y: bx.max.y, z: bx.max.z + best.z } })) });
      const eo = {
        group: g, parts, scale: sc, shell: parts.shell,
        radius: shellR,                          // 알 껍데기 반경(집기 거리 계산용)
        baseY: (zone.id === 'archangel' ? 0.38 : 0.18),
        phase: Math.random() * 6.28,
        home: { pos: g.position.clone(), rot: g.rotation.clone() },
        grade: GRADE_ZONES.includes(zone.id) ? rollGrade() : 0      // 일반/다크/이터널/디바인(알 크기와 상관없이 따로 뽑음, 용부터만)
      };
      animParts.eggs.push(eo); if (eo.grade) eo.fx = attachGradeFx({ obj: g, rad: () => eo.radius }, eo.grade, 'egg');
    }
  }
  spawnNestEggs();
  animParts.respawnEggs = () => {              // 알 초기화: 둥지에 남은 알(들고 있던 알 포함)을 지우고 새로 뽑음
    for (let i = animParts.eggs.length - 1; i >= 0; i--) {
      const old = animParts.eggs[i]; if (old.hatch) continue;          // 플레이어가 내 칸에 설치해 부화 중인 알은 그대로 둠
      if (old.group.parent) old.group.parent.remove(old.group);
      animParts.eggs.splice(i, 1);
    }
    spawnNestEggs();
  };
  animParts.creatureBoxes = creatureBoxes;      // (검증용)
  animParts.makeEgg = eggFactory;               // 알 1개를 만드는 함수(저장된 알 복원에 사용)
  // 배치 계산(짚단 포함)이 끝났으니, 바닥 장식은 동물 그룹에서 떼어 구역 root의 같은 자리에 둠
  creatureGroup.remove(spot); root.add(spot);
  spot.position.set(creatureGroup.position.x, 0, creatureGroup.position.z);
  spot.rotation.y = creatureGroup.rotation.y;
  animParts.spot = spot;

  return animParts;
}

// ============================================================================
// 3. 배경 생성 (길게 이어진 복도 + 구역별 맞춤 배경색 + 8종 생물 & 알 배치)
// ============================================================================
function createBackground(scene) {
  GRADE_SCENE = scene;
  const PATH_WIDTH = 16;      // 길의 폭 (벽 사이 간격을 더 넓힘)
  const PATH_LENGTH = 1200;   // 8종 생물이 서로 엄청 멀리 떨어져 배치되도록 길을 1200으로 대폭 확장
  const WALL_HEIGHT = 9;      // 벽 높이
  const WALL_THICK = 1.2;     // 벽 두께

  scene.background = new THREE.Color(0x9fd8ef);
  scene.fog = new THREE.Fog(0x9fd8ef, 55, 210);

  // ---- 조명 ----
  const hemi = new THREE.HemisphereLight(0xffffff, 0x6a8a6a, 1.0);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(6, 14, -4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
  sun.shadow.camera.top = 16;   sun.shadow.camera.bottom = -16;
  sun.shadow.camera.far = 70;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  // ---- 끝/안전구역 치수 ----
  const SAFE_LENGTH = 46;   // 안전구역 세로(깊이, z 방향)
  const ROOM_WIDTH = 79.4;  // 안전구역 가로(폭, x 방향) — 이 숫자만 바꾸면 바닥·옆벽·울타리·이동 범위가 전부 따라감. 울타리 바깥선(ROOM_WIDTH/2 - 0.7 = 39) = 한 칸 폭(13) × (뒷줄 칸 수 4 ÷ 2 + 1)
  const ROOM_EXTRA = (ROOM_WIDTH - PATH_WIDTH) / 2;   // 복도 양옆으로 튀어나온 폭
  const SAFE_START = PATH_LENGTH / 2 - 36;      // +564 (안전선 위치. 닭 구역이 여기서 끝나므로 고정)
  const END_Z = SAFE_START + SAFE_LENGTH;       // +610 (안전구역 끝)
  const SAFE_END = END_Z;
  const CORRIDOR_Z0 = -PATH_LENGTH / 2;         // -600
  const CORRIDOR_LEN = SAFE_START - CORRIDOR_Z0;
  const corridorX = PATH_WIDTH / 2 + WALL_THICK / 2;

  // ---- 생물 기준 앞뒤 배경 색을 각 생물 특성에 맞게 구간별로 생성 ----
  const biomeWallGroups = [];
  BIOME_ZONES.forEach(zone => {
    const segLen = zone.zMax - zone.zMin;
    const segMidZ = (zone.zMin + zone.zMax) / 2;

    const zFloorMat = new THREE.MeshStandardMaterial({ color: zone.floorColor, roughness: 0.85 });
    const zWallMat  = new THREE.MeshStandardMaterial({ color: zone.wallColor, roughness: 0.9 });
    const zCapMat   = new THREE.MeshStandardMaterial({ color: zone.capColor, roughness: 0.6, metalness: 0.2 });
    const zPanelMat = new THREE.MeshStandardMaterial({ color: zone.panelColor, roughness: 0.75 });

    // 구역 바닥
    const segFloor = new THREE.Mesh(new THREE.PlaneGeometry(PATH_WIDTH, segLen), zFloorMat);
    segFloor.rotation.x = -Math.PI / 2;
    segFloor.position.set(0, 0.012, segMidZ);
    segFloor.receiveShadow = true;
    scene.add(segFloor);

    // 구역 양옆 벽
    const lWall = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, segLen), zWallMat);
    lWall.position.set(-corridorX, WALL_HEIGHT / 2, segMidZ);
    lWall.castShadow = true; lWall.receiveShadow = true;

    const rWall = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, segLen), zWallMat);
    rWall.position.set(corridorX, WALL_HEIGHT / 2, segMidZ);
    rWall.castShadow = true; rWall.receiveShadow = true;
    scene.add(lWall, rWall);

    // 구역 양옆 갓돌(Cap)
    const lCap = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK + 0.4, 0.4, segLen), zCapMat);
    lCap.position.set(-corridorX, WALL_HEIGHT + 0.2, segMidZ);
    const rCap = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK + 0.4, 0.4, segLen), zCapMat);
    rCap.position.set(corridorX, WALL_HEIGHT + 0.2, segMidZ);
    scene.add(lCap, rCap);

    // 구역 벽면 패널 장식
    const panelCount = Math.floor(segLen / 5);
    for (let i = 0; i < panelCount; i++) {
      const pz = zone.zMin + i * 5 + 2.5;
      for (const side of [-1, 1]) {
        const panel = new THREE.Mesh(new THREE.BoxGeometry(0.08, WALL_HEIGHT * 0.84, 2.8), zPanelMat);
        panel.position.set(side * corridorX - side * (WALL_THICK / 2 + 0.04), WALL_HEIGHT * 0.5, pz);
        scene.add(panel);
      }
    }

    // 생물이 위치한 벽면에 생물 상징 후광 아치 장식 추가
    const emblem = new THREE.Mesh(
      new THREE.BoxGeometry(0.14, 5.2, 6.2),
      new THREE.MeshStandardMaterial({
        color: zone.capColor,
        roughness: 0.3,
        metalness: 0.5,
        emissive: zone.accentColor,
        emissiveIntensity: 0.35
      })
    );
    emblem.position.set(
      zone.side * corridorX - zone.side * (WALL_THICK / 2 + 0.06),
      2.8,
      zone.zCenter
    );
    scene.add(emblem);

    biomeWallGroups.push({ zone, lWall, rWall });
  });

  // 가운데 달리는 느낌을 주는 격자
  const grid = new THREE.GridHelper(PATH_LENGTH, PATH_LENGTH / 2, 0xffffff, 0x888888);
  grid.scale.x = PATH_WIDTH / PATH_LENGTH;
  grid.position.y = 0.018;
  grid.material.opacity = 0.22;
  grid.material.transparent = true;
  scene.add(grid);

  // ---- 안전구역 기본 벽 및 바닥 ----
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x8c7a63, roughness: 0.95 });
  const wallTopMat = new THREE.MeshStandardMaterial({ color: 0x6f6050, roughness: 0.95 });

  function makeWall(x, len, z) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, len), wallMat);
    wall.position.set(x, WALL_HEIGHT / 2, z);
    wall.castShadow = true; wall.receiveShadow = true;
    return wall;
  }
  function makeCap(x, len, z) {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(WALL_THICK + 0.4, 0.4, len), wallTopMat);
    cap.position.set(x, WALL_HEIGHT + 0.2, z);
    cap.castShadow = true;
    return cap;
  }

  const roomX = ROOM_WIDTH / 2 + WALL_THICK / 2;
  const roomSideLen = SAFE_LENGTH + WALL_THICK;
  const roomMidZ = SAFE_START + SAFE_LENGTH / 2;
  // 안전구역 바깥 둘레 옆벽 (안전구역 '안쪽'(x ±18, z 564~600)은 비어 있고, 벽은 그 바깥 면에만 있음)
  scene.add(makeWall(-roomX, roomSideLen, roomMidZ));
  scene.add(makeWall(roomX, roomSideLen, roomMidZ));
  scene.add(makeCap(-roomX, roomSideLen, roomMidZ));
  scene.add(makeCap(roomX, roomSideLen, roomMidZ));

  const decor = new THREE.Group();
  scene.add(decor);

  const safeZone = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_WIDTH, SAFE_LENGTH),
    new THREE.MeshStandardMaterial({ color: 0xffe066, roughness: 0.8 })
  );
  safeZone.rotation.x = -Math.PI / 2;
  safeZone.position.set(0, 0.015, SAFE_START + SAFE_LENGTH / 2);
  safeZone.receiveShadow = true;
  scene.add(safeZone);

  // 안전선: 이 선(z = SAFE_START)을 알을 들고 넘으면 그 알은 내 것이 됨. 눈에 잘 띄게 굵은 금색 띠 + 흰 중심선
  const safeEdge = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_WIDTH, 0.7),
    new THREE.MeshBasicMaterial({ color: 0xfacc15 })
  );
  safeEdge.rotation.x = -Math.PI / 2;
  safeEdge.position.set(0, 0.02, SAFE_START);
  scene.add(safeEdge);
  const safeEdgeCore = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_WIDTH, 0.18),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  safeEdgeCore.rotation.x = -Math.PI / 2;
  safeEdgeCore.position.set(0, 0.025, SAFE_START);
  scene.add(safeEdgeCore);

  const endWall = new THREE.Mesh(
    new THREE.BoxGeometry(ROOM_WIDTH + WALL_THICK * 2, WALL_HEIGHT, WALL_THICK),
    wallMat
  );
  endWall.position.set(0, WALL_HEIGHT / 2, END_Z + WALL_THICK / 2);
  endWall.castShadow = true; endWall.receiveShadow = true;
  scene.add(endWall);

  const endCap = new THREE.Mesh(
    new THREE.BoxGeometry(ROOM_WIDTH + WALL_THICK * 2 + 0.4, 0.4, WALL_THICK + 0.4),
    wallTopMat
  );
  endCap.position.set(0, WALL_HEIGHT + 0.2, END_Z + WALL_THICK / 2);
  scene.add(endCap);

  // 북쪽 맨 끝(-600) 마감 벽
  const northEndWall = new THREE.Mesh(
    new THREE.BoxGeometry(PATH_WIDTH + WALL_THICK * 2, WALL_HEIGHT, WALL_THICK),
    new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4, metalness: 0.5 })
  );
  northEndWall.position.set(0, WALL_HEIGHT / 2, CORRIDOR_Z0 - WALL_THICK / 2);
  scene.add(northEndWall);

  function makeStep(x1, x2, z) {
    const w = new THREE.Mesh(
      new THREE.BoxGeometry(Math.abs(x2 - x1) + WALL_THICK, WALL_HEIGHT, WALL_THICK),
      wallMat
    );
    w.position.set((x1 + x2) / 2, WALL_HEIGHT / 2, z);
    w.castShadow = true; w.receiveShadow = true;
    return w;
  }
  // 복도 벽 바깥 면(x ±9.2) ~ 안전구역 옆벽 바깥 면(x ±19.2) 사이를 막음. 안전구역 경계(z=564) 바깥쪽(562.8~564)에만 있어서 안전구역 안으로는 안 들어옴
  [-1, 1].forEach(sd => {
    const inner = corridorX + WALL_THICK / 2, outer = roomX + WALL_THICK / 2;
    const w = new THREE.Mesh(new THREE.BoxGeometry(outer - inner, WALL_HEIGHT, WALL_THICK), wallMat);
    w.position.set(sd * (inner + outer) / 2, WALL_HEIGHT / 2, SAFE_START - WALL_THICK / 2);
    w.castShadow = true; w.receiveShadow = true;
    scene.add(w);
  });


  // 안전구역 울타리
  const postMat = new THREE.MeshLambertMaterial({ color: 0x8a6a45 });
  const railFenceMat = new THREE.MeshLambertMaterial({ color: 0x9c7a52 });
  const FENCE_INSET = 0.7;
  const fenceHalf = ROOM_WIDTH / 2 - FENCE_INSET;
  const fenceZ0 = SAFE_START + FENCE_INSET;
  const fenceZ1 = SAFE_END - FENCE_INSET;

  const FENCE_H = 0.4;         // 울타리 높이(짧은 점프로 넘을 수 있는 높이)
  function fencePost(x, z, h = FENCE_H, mat = postMat) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, h, 0.1), mat);
    post.position.set(x, h / 2, z);
    post.castShadow = true;
    return post;
  }
  function fenceLine(x1, z1, x2, z2, pMat = postMat, rMat = railFenceMat) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    const n = Math.max(2, Math.round(len / 1.8));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      decor.add(fencePost(x1 + dx * t, z1 + dz * t, FENCE_H, pMat));
    }
    for (const railY of [FENCE_H * 0.35, FENCE_H * 0.75]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, len + 0.1), rMat);
      rail.position.set((x1 + x2) / 2, railY, (z1 + z2) / 2);
      rail.rotation.y = Math.atan2(dx, dz);
      rail.castShadow = true;
      decor.add(rail);
    }
  }
  fenceLine(-fenceHalf, fenceZ0, -fenceHalf, fenceZ1);
  fenceLine(fenceHalf, fenceZ0, fenceHalf, fenceZ1);
  fenceLine(-fenceHalf, fenceZ1, fenceHalf, fenceZ1);

  // ---- 안전구역 칸(구획) 울타리: 한 칸 13×13 정사각형 8칸, 'ㄷ'자 한 줄로 광장을 둘러쌈 ----
  //   왼쪽 줄 2칸 + 뒷줄 4칸 + 오른쪽 줄 2칸. (예전: 10×10 12칸 → 알·펫이 커져서 칸 수를 줄이고 칸을 키움) 모든 칸의 문(폭 GATE)이 광장 쪽을 향해 있어서 광장에서 바로 드나들 수 있음(이중으로 겹친 줄 없음).
  //   양옆 줄 맨 뒤 칸과 뒷줄 사이 모서리 자리는 비워 둠(거기에 칸을 두면 이웃 칸에 막혀 문을 낼 수 없음).
  //   울타리는 낮아서(FENCE_H) 짧은 점프로 넘을 수 있음. 뒷줄에서 가운데 오른쪽 칸이 '내 칸'(금색 울타리, 시작 위치 바로 앞)
  const PLOT = 13, GATE = 3, SIDE_N = 2, BACK_N = 4, GATE_POST_H = 0.9;
  const sideX = BACK_N * PLOT / 2;                    // 양옆 줄의 광장 쪽 x (= 뒷줄 폭의 절반)
  const backZ0 = fenceZ1 - PLOT;                      // 뒷줄의 앞쪽 z
  const goldPostMat = new THREE.MeshLambertMaterial({ color: 0xb8860b });
  const goldRailMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
  const fenceRects = [];                              // 충돌용 얇은 벽 목록
  const FENCE_T = 0.12;                               // 벽 반두께
  const mineRect = { x0: 0, x1: PLOT, z0: backZ0, z1: fenceZ1 };
  const segs = [];
  for (const sd of [-1, 1]) {
    const xa = Math.min(sd * sideX, sd * fenceHalf), xb = Math.max(sd * sideX, sd * fenceHalf);
    for (let r = 0; r < SIDE_N; r++) {
      const za = backZ0 - PLOT * (SIDE_N - r), zb = za + PLOT;
      segs.push({ x: sd * sideX, z0: za, z1: zb, gate: (za + zb) / 2 });             // 광장 쪽 변(문)
      segs.push({ z: za, x0: xa, x1: xb, gate: null });                               // 칸의 앞 변(칸 사이 경계 포함)
    }
    segs.push({ z: backZ0, x0: xa, x1: xb, gate: null });                             // 맨 뒤 칸의 뒤 변(빈 모서리와의 경계)
    segs.push({ x: sd * sideX, z0: backZ0, z1: fenceZ1, gate: null });               // 빈 모서리 | 뒷줄 끝 칸 경계
  }
  for (let i = 0; i < BACK_N; i++) {
    const xa = -sideX + i * PLOT, xb = xa + PLOT;
    if (i > 0) segs.push({ x: xa, z0: backZ0, z1: fenceZ1, gate: null });            // 뒷줄 칸 사이 세로선
    segs.push({ z: backZ0, x0: xa, x1: xb, gate: (xa + xb) / 2 });                   // 뒷줄 칸의 앞 변(문)
  }
  const near = (a, b) => Math.abs(a - b) < 1e-6;
  const onMine = (g) => g.x !== undefined
    ? ((near(g.x, mineRect.x0) || near(g.x, mineRect.x1)) && g.z0 >= mineRect.z0 - 1e-6 && g.z1 <= mineRect.z1 + 1e-6)
    : ((near(g.z, mineRect.z0) || near(g.z, mineRect.z1)) && g.x0 >= mineRect.x0 - 1e-6 && g.x1 <= mineRect.x1 + 1e-6);
  for (const L of segs) {
    const vertical = L.x !== undefined, gold = false;       // 내 칸 표시는 접속한 사람마다 달라서 울타리 색 대신 바닥 표시로 함
    const a = vertical ? L.z0 : L.x0, b = vertical ? L.z1 : L.x1;
    const parts = L.gate === null ? [[a, b]] : [[a, L.gate - GATE / 2], [L.gate + GATE / 2, b]];
    const pm = gold ? goldPostMat : postMat, rm = gold ? goldRailMat : railFenceMat;
    for (const [s0, s1] of parts) {
      if (vertical) { fenceLine(L.x, s0, L.x, s1, pm, rm); fenceRects.push({ x0: L.x - FENCE_T, x1: L.x + FENCE_T, z0: s0 - FENCE_T, z1: s1 + FENCE_T }); }
      else          { fenceLine(s0, L.z, s1, L.z, pm, rm); fenceRects.push({ x0: s0 - FENCE_T, x1: s1 + FENCE_T, z0: L.z - FENCE_T, z1: L.z + FENCE_T }); }
    }
    if (L.gate !== null) for (const g of [L.gate - GATE / 2, L.gate + GATE / 2]) {   // 문 기둥(눈에 띄는 금색 기둥, 충돌 없음)
      decor.add(vertical ? fencePost(L.x, g, GATE_POST_H, goldPostMat) : fencePost(g, L.z, GATE_POST_H, goldPostMat));
    }
  }
  // 안전구역 바깥 둘레 울타리(왼쪽·오른쪽·뒤)도 막혀 있어야 뒤로 돌아 칸 안으로 들어올 수 없음 (앞쪽은 복도 입구라 열려 있음)
  fenceRects.push(
    { x0: -fenceHalf - FENCE_T, x1: -fenceHalf + FENCE_T, z0: fenceZ0 - FENCE_T, z1: fenceZ1 + FENCE_T },
    { x0:  fenceHalf - FENCE_T, x1:  fenceHalf + FENCE_T, z0: fenceZ0 - FENCE_T, z1: fenceZ1 + FENCE_T },
    { x0: -fenceHalf - FENCE_T, x1:  fenceHalf + FENCE_T, z0: fenceZ1 - FENCE_T, z1: fenceZ1 + FENCE_T }
  );
  const plotBounds = { mine: Object.assign({}, mineRect, { gate: { x: PLOT / 2, z: backZ0, vertical: false } }), others: [] };   // 칸 범위+문 위치(검증·알 놓기용)
  for (const sd of [-1, 1]) for (let r = 0; r < SIDE_N; r++) {
    const za = backZ0 - PLOT * (SIDE_N - r), xa = Math.min(sd * sideX, sd * fenceHalf), xb = Math.max(sd * sideX, sd * fenceHalf);
    plotBounds.others.push({ x0: xa, x1: xb, z0: za, z1: za + PLOT, gate: { x: sd * sideX, z: za + PLOT / 2, vertical: true } });
  }
  for (let i = 0; i < BACK_N; i++) {
    const xa = -sideX + i * PLOT; if (near(xa, mineRect.x0)) continue;
    plotBounds.others.push({ x0: xa, x1: xa + PLOT, z0: backZ0, z1: fenceZ1, gate: { x: xa + PLOT / 2, z: backZ0, vertical: false } });
  }
  // 8개 칸 전체 목록: 0~3 뒷줄(왼→오), 4~5 왼쪽 줄(앞→뒤), 6~7 오른쪽 줄(앞→뒤). gate=문 위치, inward=문에서 칸 안쪽으로 향하는 방향
  plotBounds.all = [];
  for (let i = 0; i < BACK_N; i++) {
    const xa = -sideX + i * PLOT;
    plotBounds.all.push({ i: plotBounds.all.length, kind: 'back', x0: xa, x1: xa + PLOT, z0: backZ0, z1: fenceZ1, gate: { x: xa + PLOT / 2, z: backZ0, vertical: false }, inward: { x: 0, z: 1 } });
  }
  for (const sd of [-1, 1]) for (let r = 0; r < SIDE_N; r++) {
    const za = backZ0 - PLOT * (SIDE_N - r), xa = Math.min(sd * sideX, sd * fenceHalf), xb = Math.max(sd * sideX, sd * fenceHalf);
    plotBounds.all.push({ i: plotBounds.all.length, kind: sd < 0 ? 'left' : 'right', x0: xa, x1: xb, z0: za, z1: za + PLOT, gate: { x: sd * sideX, z: za + PLOT / 2, vertical: true }, inward: { x: sd, z: 0 } });
  }
  plotBounds.defaultIndex = BACK_N / 2;  // 혼자 할 때(로그인 안 함)의 칸: 뒷줄 가운데 오른쪽
  const myGate = { x: PLOT / 2, z: backZ0, side: 'front' };

  // ---- 8종 생물(자고 있는 상태) & 그 앞의 알 생성 ----
  const creatures = BIOME_ZONES.map(zone => {
    const c = createCreatureAndEgg(zone, corridorX, PATH_WIDTH / 2);
    scene.add(c.root);
    return c;
  });

  let elapsed = 0;
  function update(dt, playerPos) {
    elapsed += dt;

    // 그림자 카메라가 플레이어를 따라가도록 갱신
    if (playerPos) {
      sun.position.set(playerPos.x + 6, 14, playerPos.z - 4);
      sun.target.position.copy(playerPos);
      sun.target.updateMatrixWorld();
    }

    // 8종 생물 수면 호흡 & 알 애니메이션 업데이트 (배치 때 움직임 범위를 재는 데도 같은 함수를 씀)
    creatures.forEach((c, idx) => {
      const t = elapsed * 2.0 + idx * 0.9;
      c.anim.update(dt);   // 원본 동작 코드(자는 중이면 수면 동작, 쫓아올 땐 달리기/날기)
      c.eggs.forEach((e) => animateEgg(c.id, e.parts, e.baseY, t + e.phase, dt));
    });
  }

  return {
    group: decor,
    pathWidth: PATH_WIDTH,
    pathLength: PATH_LENGTH,
    safeZone: { minZ: SAFE_START, maxZ: SAFE_END },
    fencePen: { halfSize: fenceHalf, z0: fenceZ0, z1: fenceZ1 },
    fenceRects,            // 칸 울타리 충돌용 벽 목록
    plotBounds,            // 칸 범위(내 칸 포함)
    gateWidth: GATE,
    plotSize: PLOT,        // 한 칸의 한 변 길이
    lights: { hemi, sun }, // (밤이 될 때 어둡게 하려고)
    myGate,                // 내 칸 문 위치
    endZ: END_Z,
    startZ: CORRIDOR_Z0,
    roomWidth: ROOM_WIDTH,
    wallThick: WALL_THICK,
    creatures,   // 바깥 frame()에서 접근 가능하게 반환
    update
  };
}
  </script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 320);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const bg = createBackground(scene);

    // ---- 플레이어 캐릭터 색 & GLTF 로더 ----
    // ---- 블록형 로우폴리 사람 캐릭터 (원본 뷰어에서 그대로 이식) ----
    let character = null;  // rig.root를 character로 씀

    // damp 보간 함수
    function damp(curr, target, lambda, dt) {
      return THREE.MathUtils.lerp(curr, target, 1 - Math.exp(-lambda * dt));
    }

    const humanMat = (color, rough = 0.65) =>
      new THREE.MeshStandardMaterial({ color, roughness: rough, flatShading: true });
    const mSkin = humanMat(0xfbbf98, 0.6), mHair = humanMat(0x3b2314, 0.75),
          mShirt = humanMat(0x0ea5e9, 0.65), mShirtD = humanMat(0x0284c7, 0.65),
          mPants = humanMat(0x1e3a8a, 0.7), mShoe = humanMat(0x334155, 0.6),
          mSole = humanMat(0xe2e8f0, 0.7);

    function hJoint(name, x, y, z, parent) {
      const g = new THREE.Group(); g.name = name;
      g.position.set(x, y, z); if (parent) parent.add(g); return g;
    }
    function hBox(w, h, d, m, x, y, z, parent) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true;
      if (parent) parent.add(mesh); return mesh;
    }

    // ================= 하이퍼 러닝머신 2대 (업로드한 파일에서 옮김) =================
    // 칸마다 자기 러닝머신 1대(칸 문 옆 광장, 주인이 접속해 있을 때만 만들어 둠). 내 것만 탈 수 있고, 걸어 올라가면 자동으로 올라타서 계속 달리며, 스페이스(모바일은 점프 버튼)로 내림
    function createHyperTreadmill(posX, posZ, themeColor = 0x00f0ff, subColor = 0xa855f7, withBlockyRunner = false) {
      const root = new THREE.Group();
      root.position.set(posX, 0, posZ);
      // 북쪽(-Z, 복도 방향)을 바라보도록 배치
      scene.add(root);

      const matMetal = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.3, metalness: 0.85 });
      const matChrome = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.2, metalness: 0.92 });
      const matBelt = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.75, metalness: 0.2 });
      const matNeon1 = new THREE.MeshStandardMaterial({
        color: themeColor, emissive: themeColor, emissiveIntensity: 1.8, roughness: 0.15, metalness: 0.3
      });
      const matNeon2 = new THREE.MeshStandardMaterial({
        color: subColor, emissive: subColor, emissiveIntensity: 1.6, roughness: 0.2, metalness: 0.3
      });
      const matFire = new THREE.MeshStandardMaterial({
        color: 0xfacc15, emissive: 0xff4500, emissiveIntensity: 2.2, transparent: true, opacity: 0.9
      });
      const matHolo = new THREE.MeshStandardMaterial({
        color: themeColor, emissive: themeColor, emissiveIntensity: 2.0, transparent: true, opacity: 0.65, side: THREE.DoubleSide
      });

      const box = (w, h, d, m, x = 0, y = 0, z = 0) => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      };

      // 1. 하부 베이스 프레임 & 네온 언더글로우 패드
      const underGlow = new THREE.Mesh(
        new THREE.PlaneGeometry(3.2, 5.2),
        new THREE.MeshBasicMaterial({ color: themeColor, transparent: true, opacity: 0.28, side: THREE.DoubleSide })
      );
      underGlow.rotation.x = -Math.PI / 2;
      underGlow.position.y = 0.015;
      root.add(underGlow);

      // 메인 데크 프레임
      root.add(box(2.3, 0.22, 4.3, matMetal, 0, 0.12, 0));
      // 좌우 육중한 사이드 아머 레일 (발광 라인 포함)
      root.add(box(0.28, 0.32, 4.45, matChrome, -1.08, 0.20, 0));
      root.add(box(0.28, 0.32, 4.45, matChrome, 1.08, 0.20, 0));
      root.add(box(0.06, 0.10, 4.48, matNeon1, -1.23, 0.22, 0));
      root.add(box(0.06, 0.10, 4.48, matNeon1, 1.23, 0.22, 0));
      root.add(box(0.08, 0.04, 4.3, matNeon2, -0.92, 0.37, 0));
      root.add(box(0.08, 0.04, 4.3, matNeon2, 0.92, 0.37, 0));

      // 앞·뒤 대구경 마그네틱 롤러 드럼
      const rollerGeo = new THREE.CylinderGeometry(0.16, 0.16, 1.78, 20);
      rollerGeo.rotateZ(Math.PI / 2);
      const frontRoller = new THREE.Mesh(rollerGeo, matChrome);
      frontRoller.position.set(0, 0.18, -2.08);
      const backRoller = new THREE.Mesh(rollerGeo, matChrome);
      backRoller.position.set(0, 0.18, 2.08);
      root.add(frontRoller, backRoller);

      // 2. 러닝 컨베이어 벨트 & 고속 스크롤 화살표(Chevron) 슬랫
      const beltSurface = box(1.76, 0.04, 4.05, matBelt, 0, 0.23, 0);
      root.add(beltSurface);

      const beltSlats = [];
      const slatCount = 14;
      for (let i = 0; i < slatCount; i++) {
        const slatGroup = new THREE.Group();
        const zPos = -1.95 + (i / slatCount) * 3.9;
        slatGroup.position.set(0, 0.255, zPos);

        // 가로 트레드 바
        const bar = box(1.68, 0.015, 0.07, matChrome, 0, 0, 0);
        slatGroup.add(bar);

        // V자 네온 셰브론(화살표) 문양
        const chevL = box(0.55, 0.02, 0.05, i % 2 === 0 ? matNeon1 : matNeon2, -0.24, 0.005, 0);
        chevL.rotation.y = 0.35;
        const chevR = box(0.55, 0.02, 0.05, i % 2 === 0 ? matNeon1 : matNeon2, 0.24, 0.005, 0);
        chevR.rotation.y = -0.35;
        slatGroup.add(chevL, chevR);

        root.add(slatGroup);
        beltSlats.push(slatGroup);
      }

      // 3. 전방 사이버 아치 게이트 & 홀로그램 계기판 콘솔
      const leftPillar = box(0.22, 2.3, 0.28, matMetal, -1.06, 1.25, -1.75);
      leftPillar.rotation.x = 0.18;
      const rightPillar = box(0.22, 2.3, 0.28, matMetal, 1.06, 1.25, -1.75);
      rightPillar.rotation.x = 0.18;
      root.add(leftPillar, rightPillar);

      // 기둥 네온 스트립
      const lpStrip = box(0.06, 2.15, 0.31, matNeon1, -1.06, 1.25, -1.75);
      lpStrip.rotation.x = 0.18;
      const rpStrip = box(0.06, 2.15, 0.31, matNeon1, 1.06, 1.25, -1.75);
      rpStrip.rotation.x = 0.18;
      root.add(lpStrip, rpStrip);

      // 손잡이 핸들바 (좌/우)
      root.add(box(0.12, 0.12, 1.15, matChrome, -1.02, 1.18, -1.25));
      root.add(box(0.12, 0.12, 1.15, matChrome, 1.02, 1.18, -1.25));
      root.add(box(0.14, 0.14, 0.35, matNeon2, -1.02, 1.18, -0.75));
      root.add(box(0.14, 0.14, 0.35, matNeon2, 1.02, 1.18, -0.75));

      // 상단 크로스 아치 & 회전 에너지 코어
      root.add(box(2.45, 0.22, 0.32, matMetal, 0, 2.38, -1.55));
      root.add(box(2.25, 0.08, 0.35, matNeon1, 0, 2.38, -1.55));

      const coreRotor = new THREE.Group();
      coreRotor.position.set(0, 2.38, -1.35);
      root.add(coreRotor);
      const coreRing1 = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.035, 10, 24), matNeon1);
      const coreRing2 = new THREE.Mesh(new THREE.TorusGeometry(0.20, 0.03, 10, 20), matNeon2);
      coreRotor.add(coreRing1, coreRing2);

      // 전방 홀로그램 대시보드 (계기판 + 회전 스피드 게이지 바)
      const consoleBase = box(1.55, 0.48, 0.22, matMetal, 0, 1.48, -1.65);
      consoleBase.rotation.x = -0.42;
      root.add(consoleBase);

      const holoScreen = box(1.42, 0.42, 0.03, matHolo, 0, 1.62, -1.56);
      holoScreen.rotation.x = -0.35;
      root.add(holoScreen);

      // 홀로그램 EQ/스피드 바
      const holoBars = [];
      for (let b = 0; b < 9; b++) {
        const barMesh = box(0.09, 0.22, 0.04, b % 2 === 0 ? matNeon1 : matNeon2, -0.48 + b * 0.12, 1.62, -1.52);
        barMesh.rotation.x = -0.35;
        root.add(barMesh);
        holoBars.push(barMesh);
      }

      // 4. 후방 듀얼 제트 애프터버너 터빈 (Dual Rear Booster Thrusters)
      const thrusterPivots = [];
      [-0.68, 0.68].forEach(tx => {
        const housing = box(0.46, 0.38, 0.52, matChrome, tx, 0.28, 2.15);
        root.add(housing);
        const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.28, 16), matMetal);
        nozzle.rotation.x = Math.PI / 2;
        nozzle.position.set(tx, 0.28, 2.45);
        root.add(nozzle);

        // 제트 화염 코어 피벗
        const flamePivot = new THREE.Group();
        flamePivot.position.set(tx, 0.28, 2.58);
        root.add(flamePivot);

        const outerFlame = new THREE.Mesh(new THREE.ConeGeometry(0.19, 1.15, 12), matNeon1);
        outerFlame.rotation.x = Math.PI / 2;
        outerFlame.position.z = 0.55;
        const innerFlame = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.85, 10), matFire);
        innerFlame.rotation.x = Math.PI / 2;
        innerFlame.position.z = 0.42;
        flamePivot.add(outerFlame, innerFlame);
        thrusterPivots.push({ flamePivot, outerFlame, innerFlame });
      });

      // 5. 특수효과(VFX) 파티클 시스템:
      // (A) 바닥에서 솟구치는 소닉 쇼크웨이브 링 (Shockwave Rings)
      const shockRings = [];
      for (let r = 0; r < 3; r++) {
        const ringGeo = new THREE.TorusGeometry(1.15, 0.035, 10, 32);
        ringGeo.rotateX(Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({
          color: r % 2 === 0 ? themeColor : subColor,
          transparent: true,
          opacity: 0.75
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.set(0, 0.3 + r * 0.65, 0);
        root.add(ring);
        shockRings.push({ mesh: ring, phase: r / 3 });
      }

      // (B) 발밑 마찰 스파크 & 고속 스피드 라인 파티클 (Sparks & Speed Lines)
      const sparks = [];
      for (let s = 0; s < 28; s++) {
        const isLine = s < 12;
        const spMesh = box(
          isLine ? 0.035 : 0.07,
          isLine ? 0.035 : 0.07,
          isLine ? 0.65 : 0.14,
          s % 3 === 0 ? matFire : (s % 2 === 0 ? matNeon1 : matNeon2),
          (Math.random() - 0.5) * 1.5,
          0.35 + Math.random() * 1.4,
          (Math.random() - 0.5) * 3.6
        );
        root.add(spMesh);
        sparks.push({
          mesh: spMesh,
          isLine,
          vx: (Math.random() - 0.5) * 0.8,
          vy: isLine ? 0 : (0.6 + Math.random() * 1.5),
          vz: isLine ? (6.5 + Math.random() * 5.0) : (3.5 + Math.random() * 4.0),
          life: Math.random()
        });
      }

      // (C) 옵션: 옆 러닝머신에서 맹렬히 달리는 블록형 인간 트레이너 (마인크래프트 스타일 리깅)
      let blockyRunner = null;
      if (withBlockyRunner) {
        const runnerRoot = new THREE.Group();
        runnerRoot.position.set(0, 0.26, 0.1);
        runnerRoot.rotation.y = Math.PI; // -Z 정면 콘솔을 바라보며 질주
        root.add(runnerRoot);

        const skinM = new THREE.MeshStandardMaterial({ color: 0xfbbf94, roughness: 0.6 });
        const hairM = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.5 });
        const shirtM = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.35 });
        const pantsM = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
        const shoeM = new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xe11d48, emissiveIntensity: 0.6 });

        const pelvis = new THREE.Group();
        pelvis.position.y = 0.72;
        runnerRoot.add(pelvis);

        const torso = box(0.42, 0.52, 0.24, shirtM, 0, 0.28, 0);
        pelvis.add(torso);
        // 등 뒤 부스터 오라 팩
        torso.add(box(0.26, 0.34, 0.12, matNeon2, 0, 0.02, -0.16));

        const head = new THREE.Group();
        head.position.set(0, 0.58, 0);
        pelvis.add(head);
        head.add(box(0.38, 0.38, 0.38, skinM, 0, 0.19, 0));
        head.add(box(0.40, 0.14, 0.40, hairM, 0, 0.35, 0));
        // 사이버 고글 바이저
        head.add(box(0.41, 0.10, 0.12, matNeon1, 0, 0.21, 0.16));

        const armL = new THREE.Group(); armL.position.set(0.30, 0.48, 0); pelvis.add(armL);
        armL.add(box(0.16, 0.48, 0.16, shirtM, 0, -0.20, 0));
        const armR = new THREE.Group(); armR.position.set(-0.30, 0.48, 0); pelvis.add(armR);
        armR.add(box(0.16, 0.48, 0.16, shirtM, 0, -0.20, 0));

        const legL = new THREE.Group(); legL.position.set(0.12, 0, 0); pelvis.add(legL);
        legL.add(box(0.17, 0.52, 0.17, pantsM, 0, -0.26, 0));
        legL.add(box(0.19, 0.14, 0.26, shoeM, 0, -0.52, 0.04));

        const legR = new THREE.Group(); legR.position.set(-0.12, 0, 0); pelvis.add(legR);
        legR.add(box(0.17, 0.52, 0.17, pantsM, 0, -0.26, 0));
        legR.add(box(0.19, 0.14, 0.26, shoeM, 0, -0.52, 0.04));

        blockyRunner = { runnerRoot, pelvis, head, armL, armR, legL, legR };

    function paintMesh(mesh) {

    function addFace(meshes) {

    // 단계가 높을수록 빠름. 달리는 플레이어 속도(25.2)보다 느린 단계는 못 따라잡고(닭·호랑이·용), 빠른 단계는 따라잡아서 잡음

    const FLYERS = ['dragon', 'eastern', 'samjoko', 'demon', 'archangel'];   // 원본 파일에 달리기가 아니라 날기 동작이 있는 동물
    const RUSH_GAP = 8;      // 떨어뜨린 알을 다시 주웠을 때, 동물이 순식간에 와서 서는 '내 뒤 거리'
    const RUSH_TIME = 0.8;   // 그 순식간(1초 안)

    const eggCounter = document.getElementById('egg-counter');

    // 각 동물의 AI 상태: asleep(자는 중) → rush(순식간에 접근) → chase(추격) → return(돌아가는 중) → settle(자리 잡는 중) → asleep
    bg.creatures.forEach(c => {

    function startKnock(dx, dz) {                              // (dx,dz) 방향으로 내팽개쳐져 날아감 — 동물에게 잡혔을 때와 방망이에 맞았을 때 공용
      knockVX = dx * KNOCK_SPEED; knockVZ = dz * KNOCK_SPEED; knockT = KNOCK_TIME; velY = KNOCK_UP; isOnGround = false;
      charYaw = Math.atan2(dx, dz); knockSide = Math.random() < 0.5 ? -1 : 1;      // 날아가는 방향을 보고(빙글 돌지 않음), 몸이 한쪽으로 살짝 기울어 엎어짐
    }

    // 날려가는 동안의 이동량 (조작 불가). 처음엔 세게 날아가고 땅에 닿으면 마찰로 미끄러지며 멈춤
    function knockStep(dt) {

    function knockPoseStep(dt) {
      const knocked = knockT > 0, f = knocked ? 1 - knockT / KNOCK_TIME : 1, air = knocked && !isOnGround, getUp = knocked && f > 0.78 ? (f - 0.78) / 0.22 : 0, lim = 1 - getUp;

      set(rig.armL.shoulder, 'z', (air ? 0.6 : 1.0) * lim); set(rig.armR.shoulder, 'z', (air ? -0.6 : -1.0) * lim);
      set(rig.legL.hip, 'x', (air ? -0.8 : 0.2) * lim + flail * 0.6); set(rig.legR.hip, 'x', (air ? 0.5 : -0.2) * lim - flail * 0.6);

    // 칸 좌표계(a,b): 문 앞 가장자리 가운데가 원점, a = 칸의 오른쪽(-6.5~6.5), b = 문에서 칸 안쪽으로(0~13).
    // 칸마다 방향이 달라도 같은 좌표로 저장 → 다른 칸을 배정받아도 알·펫 배치가 그대로 유지됨
    function plotFrame(i) {
      const P = bg.plotBounds.all[i], B = P.inward, A = { x: B.z, z: -B.x };
      return { P, i, facing: Math.atan2(-B.x, -B.z),                                  // facing: 문(광장) 쪽을 바라보는 방향
        toWorld: (a, b) => ({ x: P.gate.x + a * A.x + b * B.x, z: P.gate.z + a * A.z + b * B.z }),
        toLocal: (x, z) => ({ a: (x - P.gate.x) * A.x + (z - P.gate.z) * A.z, b: (x - P.gate.x) * B.x + (z - P.gate.z) * B.z }) };
    }
    const PLOT_N = bg.plotSize;                                 // 한 칸의 한 변 길이(13)
    let myPlotIdx = bg.plotBounds.defaultIndex, myFrame = plotFrame(myPlotIdx);
    const minePlaced = [];                                      // 내 칸에 놓인 알들의 자리 {a, b, r}
    let _idN = 0; const newId = () => Date.now().toString(36) + (++_idN).toString(36) + Math.floor(Math.random() * 1296).toString(36);
    // 내 칸 안에서 빈 자리 찾기: 안쪽부터 촘촘하게, 울타리·문 앞 길·다른 알과 안 겹치게
    function slotInMyPlot(r) {
      const m = 0.7 + r, aMin = -PLOT_N / 2 + m, aMax = PLOT_N / 2 - m, bMin = m, bMax = PLOT_N - m;
      for (let b = bMax; b >= bMin; b -= 0.5) {
        for (let a = aMin; a <= aMax; a += 0.5) {

          if (minePlaced.every(o => Math.hypot(a - o.a, b - o.b) >= r + o.r + 0.2)) return { a, b };
        }

    }
    // 칸이 꽉 차서 빈 자리가 없을 때: 다른 알과 가장 덜 겹치는 자리(칸 안쪽, 문 앞 길 제외)에라도 놓음
    function bestEffortSlot(r) {
      const m = 0.9 + r * 0.4;
      let best = null, bestClear = -1e9;
      for (let k = 0; k < 600; k++) {
        const a = -PLOT_N / 2 + m + Math.random() * (PLOT_N - 2 * m), b = m + Math.random() * (PLOT_N - 2 * m);
        if (b - r < 3.5 && Math.abs(a) < bg.gateWidth / 2 + 0.5 + r) continue;
        let clear = 1e9; for (const o of minePlaced) clear = Math.min(clear, Math.hypot(a - o.a, b - o.b) - r - o.r);

    }
    function secureEgg() {                                      // 알을 들고 안전선을 넘음 → 가방에 들어감(내 칸에 직접 설치하는 건 따로)
      const { c, e } = carriedEgg;
      carriedEgg = null; isCarrying = false; rig.carryMount.visible = false; carryingHud.style.display = 'none';
      rig.carryMount.remove(e.group); scene.remove(e.group);
      const k = c.eggs.indexOf(e); if (k >= 0) c.eggs.splice(k, 1);                                 // 둥지에서 알이 사라짐
      const roll = rollHatch(e.scale, c.id), item = { id: newId(), cid: c.id, s0: e.scale, grow: roll.grow, dur: roll.dur, grade: e.grade || 0 };    // 이 알의 부화 시간·최종 크기 배율이 정해짐
      if (inv.length >= INV_MAX) { toast('🎒 가득 참 · 내 칸에 놓았어요', 'warn', 2500); autoPlaceEgg(item); }
      else { inv.push(item); syncCounts(); renderHotbar(); saveGame(); }
      sendHome(c);                                                                                    // 동물은 돌아가서 다시 잠
      return item;
    }

    // ================= 부화: 내 칸의 알은 시간이 지나며 점점 커지고 → 부화 준비 → F로 '부화하기' → 흔들리다 깨지며 그 동물이 나옴 =================
    // 부화 시간(초): 동물 등급별 [가장 빠른 알, 가장 느린 알]. 앞 등급은 길어봤자 몇 분, 뒤로 갈수록 길어짐. 같은 등급 안에서는 알이 클수록 오래 걸림
    const HATCH_RANGE = { chicken: [10, 180], tiger: [30, 480], dragon: [60, 1200], eastern: [180, 2700], lion: [600, 7200], samjoko: [1800, 21600], demon: [3600, 43200], archangel: [10800, 86400] };
    const GROW_MAX = 2, FINAL_MAX_V = 4.5;                   // 부화 직전 크기: 처음 크기의 1~2배(알마다 랜덤). 다 자란 알의 겉보기 크기(장식 포함)는 4.5m를 넘지 않음

    const NET = { cfg: (typeof window !== 'undefined' && window.FIREBASE_CONFIG) || null, online: false, offset: 0, uid: null, nick: '', db: null, auth: null, saveRef: null, meRef: null };
    const nowMs = () => Date.now() + timeOffset + NET.offset;   // 서버 시각 기준(모든 사람이 같은 시간으로 알이 자람)
    const myEggs = [], pets = [], fxShards = [];              // 내 칸의 알들 / 부화해서 나온 동물들 / 알 깨지는 조각 효과
    const hatchInfoEl = document.getElementById('hatch-info'), hatchTextEl = document.getElementById('hatch-text'), hatchBarEl = document.getElementById('hatch-bar'), hatchFlashEl = document.getElementById('hatch-flash');
    function syncCounts() {

    }
    // 알 크기(0.55~1.5)가 클수록 오래 걸림. 크기 80% + 랜덤 20%로 정해서 30초(작은 알)~24시간(큰 알) 사이를 로그 간격으로 고름
    function rollHatch(s0, cid) {
      const [lo, hi] = HATCH_RANGE[cid] || [30, 86400];

      const sizeF = Math.max(0, Math.min(1, Math.log(rel / 0.5) / Math.log(2.3 / 0.5)));         // 0.5~2.3(로그 간격)

    }
    function fmtDur(ms) {
      const sec = Math.max(0, Math.ceil(ms / 1000));

    }

    function startHatch(e) {

    }
    // 펫 크기 보정: 생물 몸(원래는 알보다 2~4배 큼)을 '알 크기'에 맞춤 → 펫이 보이는 크기 = 알 크기 × PET_FIT (수입·가격에 쓰는 scale은 알 크기 그대로)
    const PET_FIT = {};
    bg.creatures.forEach(c => {

      const ext = (k) => Math.max(...bx.map(b => b.max[k])) - Math.min(...bx.map(b => b.min[k]));
      PET_FIT[c.id] = e ? (2 * e.radius / e.scale) / Math.cbrt(ext('x') * ext('y') * ext('z')) : 0.3;      // 알 지름 ÷ 몸 크기(가로·세로·높이의 기하평균)
    });
    function createPet(cid, x, z, yaw, scale, pop, grade) {     // 부화한 동물 1마리 만들기(내 칸·다른 사람 칸 공용). scale = 알의 마지막 크기, grade = 등급(0~3)
      const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g);
      const F = CREATURE_FACTORIES[cid](g);
      F.setAction('sleep'); for (let i = 0; i < 240; i++) F.update(0.05);
      const vis = scale * (PET_FIT[cid] || 0.3), pet = { cid, group: g, anim: F, scale, vis, t: pop ? 0 : 99, awake: false, grade: clampGrade(grade) };       // vis = 눈에 보이는 크기(알 크기만큼)
      if (pop) { F.setAction(FLYERS.includes(cid) ? 'fly' : 'run'); pet.awake = true; g.scale.setScalar(0.01); } else g.scale.setScalar(vis);
      if (pet.grade) pet.fx = attachGradeFx({ obj: g, rad: () => 0.64 * (EGG_SHELL[cid] || 1) * scale * 1.1 }, pet.grade, 'pet');      // 주변에 흐르는 아우라(등급별)

    }
    function spawnPet(cid, x, z, yaw, scale, pop, id, grade) {  // 내 펫
      const pet = createPet(cid, x, z, yaw, scale, pop, grade);
      const L = myFrame.toLocal(x, z); pet.a = L.a; pet.b = L.b; pet.yr = yaw - myFrame.facing; pet.id = id || newId();
      pets.push(pet); return pet;
    }
    function updatePetObj(p, dt) {
      p.anim.update(dt);

        p.t += dt; const k = Math.min(1, p.t / 0.7), c1 = 1.70158, c3 = c1 + 1;
        p.group.scale.setScalar(Math.max(0.01, p.vis * (1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2))));
        if (p.awake && p.t > 1.6) { p.anim.setAction('sleep'); p.awake = false; }
        if (p.t > 1.6) { p.t = 99; p.group.scale.setScalar(p.vis); }

    }
    function updatePets(dt) { for (const p of pets) updatePetObj(p, dt); }
    function burstShards(x, z, size) {                          // 알이 깨지며 튀는 조각
      const cols = [0xfef3c7, 0xfacc15, 0xffffff];
      for (let i = 0; i < 16; i++) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: cols[i % 3], transparent: true }));
        const sz = (0.12 + Math.random() * 0.18) * size; m.scale.set(sz, sz * 0.6, sz); m.position.set(x, size * 0.9, z);
        const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 4) * Math.sqrt(size);
        fxShards.push({ m, vx: Math.cos(a) * sp, vy: (3 + Math.random() * 4) * Math.sqrt(size), vz: Math.sin(a) * sp, life: 1.2 }); scene.add(m);
      }
    }
    function updateFx(dt) {
      for (let i = fxShards.length - 1; i >= 0; i--) {
        const f = fxShards[i]; f.life -= dt; f.vy -= 14 * dt;
        f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt; f.m.rotation.x += 6 * dt; f.m.rotation.z += 4 * dt;
        f.m.material.opacity = Math.max(0, f.life / 1.2);
        if (f.life <= 0 || f.m.position.y < 0) { scene.remove(f.m); f.m.material.dispose(); f.m.geometry.dispose(); fxShards.splice(i, 1); }
      }
    }
    function finishHatch(i) {                                   // 딴! 알이 깨지고 동물이 나옴

      scene.remove(e.group);

      bankMoney();                                              // 새 펫이 생기기 전까지 번 돈 확정 → 이제부터 새 펫 몫도 늘어남
      spawnPet(c.id, x, z, myFrame.facing, finalScale, true, undefined, e.grade || 0);   // 내 칸의 문(광장)을 바라보게 (알의 등급이 펫에게 이어짐)
      syncCounts(); saveGame(); pushRank(true);
      toast(`🎉 ${e.grade ? GRADE_NAME[e.grade] + ' ' : ''}${creatureName(c.id)} 부화! 💰 +${fmtRate(petRate(c.id, finalScale, e.grade || 0))}/초`, 'good', 4000);
    }
    function updateHatching(dt) {
      const now = nowMs();

    // 저장/복원: 부화 시간이 길어서(최대 하루) 새로고침해도 이어지도록 저장. 시간은 '시작 시각'으로 저장해서 꺼져 있던 시간도 흐름
    // 위치는 칸 좌표(a,b)로 저장 → 로그인할 때마다 다른 칸을 배정받아도 같은 배치. 온라인이면 서버(내 계정)에, 아니면 이 기기에 저장
    function snapshotSave() {
      const eggs = myEggs.map(({ c, e }) => { const L = myFrame.toLocal(e.group.position.x, e.group.position.z);
        return { id: e.id, cid: c.id, a: L.a, b: L.b, yr: e.group.rotation.y - myFrame.facing, s0: e.hatch.s0, grow: e.hatch.grow, start: e.hatch.start, dur: e.hatch.dur, hatching: e.hatch.state === 'hatching', hatchAt: e.hatch.hatchAt, grade: e.grade || 0 }; });

      return { v: 2, tierv: EGG_TIER_VER, nick: NET.nick || '', plot: myPlotIdx, look: lookToStr(myLook), money: Math.round(moneyBase * 100) / 100, moneyAt: moneyT0, tmLevel, trail: trailLevel, trailOn: trailOn ? 1 : 0, speed: Math.floor(speedPoints), inv: inv.map(it => ({ id: it.id, cid: it.cid, s0: it.s0, grow: it.grow, dur: it.dur, grade: it.grade || 0 })), eggs, pets: ps };
    }
    function saveGame() {
      bankMoney();                                              // 저장할 때마다 지금까지 번 돈을 확정
      const data = snapshotSave();
      try {
        if (NET.online && NET.saveRef) { const pr = NET.saveRef.set(Object.assign({ updated: firebase.database.ServerValue.TIMESTAMP }, data)); if (pr && pr.catch) pr.catch(netFail); }

    }
    function netFail(err) {                                     // 서버에 저장/전송이 안 될 때(규칙 미설정·인터넷 끊김 등): 조용히 넘어가지 않고 알림
      console.warn('서버 통신 실패', err); NET.failed = true;
      if (!NET._failToast || Date.now() - NET._failToast > 30000) { NET._failToast = Date.now(); toast('⚠️ 서버 저장 실패 (규칙/인터넷 확인)', 'bad', 4000); }
      try { netInfoEl.firstChild.textContent = '⚠ 서버 저장 실패 (Firebase 규칙/인터넷 확인) '; } catch (_) {}
    }
    function readLocalSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (_) { return null; } }
    // Firebase는 배열을 숫자 키 객체로 저장하고, 비어 있으면 지우고, 듬성듬성하면 객체로 돌려줌 → 읽을 때 항상 배열로 바꿔서 씀
    const toArr = (x) => Array.isArray(x) ? x.filter(v => v != null) : (x && typeof x === 'object' ? Object.values(x).filter(v => v != null) : []);
    function applySave(data) {                                  // 저장된 알·펫을 내 칸에 복원(v1: 예전 형식도 읽음)
      if (!data || !(data.v === 1 || data.v === 2)) return;

      _restoring = true; moneyBase = Number(data.money) || 0; moneyT0 = Number(data.moneyAt) || nowMs();
      tmLevel = Math.max(1, Math.min(TM_MAX, Math.floor(Number(data.tmLevel)) || 1)); speedPoints = Math.max(0, Number(data.speed) || 0);
      trailLevel = Math.max(0, Math.min(TRAIL_MAX, Math.floor(Number(data.trail)) || 0)); trailOn = trailLevel > 0 && (data.trailOn === undefined ? true : !!Number(data.trailOn));
      let eggsIn = toArr(data.eggs), petsIn = toArr(data.pets);
      if (data.v === 1) {                                       // 예전 저장(월드 좌표, 기본 칸) → 칸 좌표로 변환
        const F0 = { facing: Math.PI, toLocal: (x, z) => ({ a: x - 5, b: z - 599.3 }) };      // 예전(칸이 10×10이던 때) 내 칸의 문(x=5, z=599.3) 기준으로 변환 → 칸이 바뀌어도 알 배치가 문 기준으로 그대로
        const cv = (o) => { const L = F0.toLocal(o.x, o.z); return Object.assign({}, o, { a: L.a, b: L.b, yr: (o.yaw || 0) - F0.facing }); };

      }

      eggsIn = eggsIn.map(x => Object.assign({}, x, { s0: (Number(x.s0) || 1) * tmul(x.cid) })); petsIn = petsIn.map(x => Object.assign({}, x, { scale: (Number(x.scale) || 1) * tmul(x.cid) }));

      for (const it of toArr(data.inv)) if (it && inv.length < INV_MAX && bg.creatures.find(k => k.id === it.cid)) inv.push({ id: it.id || newId(), cid: it.cid, grade: clampGrade(it.grade), s0: (Number(it.s0) || 1) * tmul(it.cid), grow: capGrow(it.cid, (Number(it.s0) || 1) * tmul(it.cid), it.grow), dur: Number(it.dur) || 30000 });

      _restoring = false;

    function startLocal() { NET.guest = true; applySave(readLocalSave()); }      // 혼자 하기: 이 기기에 저장

    // ================= 돈 · 펫 판매 · 순위표 · 알림 메시지 =================

    const SELL_SECONDS = 1800;                                  // 판매가 = 그 펫이 30분 동안 버는 돈 (30분 넘게 키우면 팔지 않는 게 이득)
    const OFFLINE_CAP_SEC = 24 * 3600;                          // 접속하지 않은 동안 번 돈은 최대 24시간치까지
    const SELL_HOLD = 0.8;                                      // 판매는 실수 방지로 이만큼(초) 꾹 눌러야 함
    const BASE_RUN_SPEED = 4.2 * 2.4 * 2.5;                     // 기본 달리기 속도(25.2). 러닝머신 레벨마다 +5%
    const CREATURE_NAME = { chicken: '🐔 닭', tiger: '🐯 호랑이', dragon: '🐲 용', eastern: '🐉 청룡', lion: '🦁 사자', samjoko: '🐦 삼족오', demon: '😈 대악마', archangel: '😇 대천사' };

      const activeZone = BIOME_ZONES.find(z => charPos.z >= z.zMin && charPos.z < z.zMax);
      const bannerText = bannerOf(activeZone);   // 예: '🐔 Lv.1 닭의 보금자리'
      targetSkyColor.setHex(zoneSkyAt(charPos.z));            // 구역 경계 앞뒤 32m에서 이웃 구역 색과 연속으로 섞음(넘어갈 때 색이 뚝 바뀌지 않게)
      if (bannerText !== _lastBanner) { zoneBanner.textContent = bannerText; _lastBanner = bannerText; _bannerT = 2.5; }
      _bannerT = Math.max(0, _bannerT - dt); zoneBanner.style.opacity = _bannerT > 0 ? '1' : '0';      // 구역 이름은 구역이 바뀔 때 2.5초만
      currentSkyColor.lerp(targetSkyColor, Math.min(1, dt * 5));
      scene.background.copy(currentSkyColor);
      if (resetNight > 0.002) scene.background.lerp(NIGHT_SKY, resetNight * 0.92);                 // 알 초기화 중에는 밤하늘로
      scene.fog.color.copy(scene.background);
      if (bg.lights) { bg.lights.hemi.intensity = 1.0 - 0.7 * resetNight; bg.lights.sun.intensity = 1.0 - 0.85 * resetNight; }

      const camTarget = new THREE.Vector3(charPos.x, charPos.y + (0.9 - 0.45 * Math.min(1, knockPitch / 1.45)) * HOLDER_SCALE, charPos.z);   // 캐릭터 가슴 높이(크기에 비례)
      let camX = camTarget.x + Math.sin(camYaw) * Math.cos(camPitch) * dist;
      let camZ = camTarget.z + Math.cos(camYaw) * Math.cos(camPitch) * dist;
      const camY = Math.max(0.35, camTarget.y + Math.sin(camPitch) * dist);

      camX = Math.max(-halfW, Math.min(halfW, camX));
      camZ = Math.min(camZ, bg.endZ - 0.1);

      camera.position.set(camX, camY, camZ);
      camera.lookAt(camTarget);

      bg.update(dt, charPos);
      fitCreaturesInCorridor();       // 동물 몸이 벽을 뚫고 겹치지 않게(그리기 직전 최종 보정)
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
      } catch(e) {
        // 오류 발생 시 화면에 직접 표시
        document.body.style.background = '#fff';
        document.body.innerHTML = '<pre style="color:red;padding:20px;font-size:14px">오류: ' + e.message + '\n\n' + e.stack + '</pre>';
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>
